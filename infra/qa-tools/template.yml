AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Porth QA tools for the EMS testbed — clears and refills the Porth tables between test runs.

# These are EMS's tooling, deployed into EMS's own account. They were in the Components repo
# (since PORTH-228) purely by inheritance, which meant a cross-account deploy role would have
# been needed for Components CI to reach account 195950944420 — across a boundary that is
# purposefully independent (ADR-Z1). Nothing about them is shared: the seeder's reserved-name
# guard exists to protect frontend/tests/e2e/tier2/acceptance.spec.ts, a path in THIS repo.
#
# Cleanup empties the tables; seed refills them with the deterministic synthetic tenants that
# both the Tier 2 e2e suite and the PORTH-494 security lab need — one manifest, so the two
# cannot drift apart.
#
# Deployed by .github/workflows/deploy-qa-tools.yml.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging]
    Description: >
      Porth table-name suffix — must match the Porth install's `Environment` parameter, so the
      Lambdas resolve porth-tenants-${Environment} and friends. `prod` is deliberately not an
      allowed value: these functions delete data.

  EnvScope:
    Type: String
    Default: prod
    Description: >
      Read by nothing since the testbed seeder retired (2026-11-10). Kept because the deploy
      still passes it; remove the two together.

# No API Gateway. reset-env invokes the cleanup function by ARN over the AWS API, so an HTTP
# surface would exist only to be defended: it wipes tables,
# and the cheapest way to secure an endpoint nobody calls is not to create one. It also keeps
# apigateway:* out of the CloudFormation execution role.
Resources:

  QaCleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-qa-cleanup-${Environment}
      Handler: handler.handler
      Runtime: python3.13
      CodeUri: src/cleanup/
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          PORTH_ENV: !Ref Environment
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:DeleteItem
                - dynamodb:DescribeTable
              # Every table EMS holds (Richard, 2026-11-10): Porth's, EMS's own per slot, and prawf's
              # ledger. Named families only - never a wildcard over the account.
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/porth-*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ems-sample-app-*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ems-supplier-links-*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ems-ffug-*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/prawf-adapter-audit
Outputs:
  QaCleanupFunctionArn:
    Description: Invoked by reset-env.yml, once per table
    Value: !GetAtt QaCleanupFunction.Arn
