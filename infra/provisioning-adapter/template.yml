AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  prawf provisioning adapter for EMS (PRF-9). One adapter per target; the slot is chosen per call.
  Invoked directly by ARN, with no HTTP surface. Answers capabilities; seed and teardown on
  porth-org and porth-tenant (PRF-12, PRF-15); bootstrap on porth-platform (PRF-11); and reset (PRF-14).

# A standalone stack, like infra/qa-tools and for the same reasons: it writes Porth's tables, which
# the sample-app stack does not own, and it is prawf's backdoor rather than part of the application.
# Everything lives under infra/provisioning-adapter/ so it can be lifted out whole.
#
# IAM, in one paragraph. The function's own role (ExecutionRole) holds NO DynamoDB access. Every data
# call assumes DataRole with an inline session policy that admits only partition keys under
# ENV#{slot}#, so a request routed to the wrong slot is denied by AWS rather than avoided by code.
# DataRole's policy is the ceiling: the four Porth tables named explicitly (never porth-*, which on
# main also matches the sample app's own table), single-item writes, and Scan on the tenants table
# alone - ForAllValues over the absent LeadingKeys of a Scan evaluates true, so a Scan reads every
# slot's rows there; reset needs it (PRF-14) and the code filters to the slot. Porth's own repositories publish an event for every write and raise if they
# cannot, so DataRole may also put events on Porth's bus - that bus and no other.

Parameters:
  SlotMap:
    Type: String
    Default: '{"slots":{"porth-dau":{"environment_id":"ems-porth-dau","environment_class":"disposable"}}}'
    Description: >
      The target's own list of its slots. Single-slot until PRF-19 publishes contract 1.1.0, because
      a 1.0.0 caller cannot name a slot and a multi-slot adapter refuses a call that does not.
  PorthStackName:
    Type: String
    Default: serverlessrepo-porth-components
    Description: The Porth SAR stack. Its serverlessrepo:semanticVersion tag is the candidate version.
  PorthTenantsTable:
    Type: String
    Description: From the Porth stack's TenantsTableName output. Resolved by the deploy, never typed.
  PorthRolesTable:
    Type: String
    Description: From the Porth stack's RolesTableName output.
  PorthPermissionsTable:
    Type: String
    Description: From the Porth stack's PermissionsTableName output.
  PorthClaimMappingConfigsTable:
    Type: String
    Description: From the Porth stack's ClaimMappingConfigsTableName output.
  PorthEventBus:
    Type: String
    Description: From the Porth stack's EventBusName output (porth-events-{env}).
  AdapterVersion:
    Type: String
    Default: 0.0.0-dev
    Description: Build identity, set from the commit by the deploy.
  CallerRoleArn:
    Type: String
    Default: ''
    Description: >
      prawf-runner in the Components account. Empty in PRF-9, which is proven in-account only;
      PRF-10 sets it and the cross-account permission appears.

Conditions:
  # 'none' is the deploy's first pass: it releases the grant without unsetting the variable.
  HasCaller: !Not [!Or [!Equals [!Ref CallerRoleArn, ''], !Equals [!Ref CallerRoleArn, none]]]

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: prawf adapter runtime. No data access - it assumes DataRole narrowed to one slot.
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/prawf-adapter-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: adapter-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OwnLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/porth-provisioning-adapter:*
              - Sid: ReadSlotMap
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/prawf/adapter/slot-map
              - Sid: ReadPorthStackVersion
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${PorthStackName}/*
              # PRF-11: the platform baseline's IdP config and roles-claim namespace are the install's
              # own record of its IdP. Read, never written.
              - Sid: ReadPorthAuth
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/porth/auth

  DataRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Ceiling for Porth data access. Always assumed with a one-slot session policy.
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/prawf-adapter-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt ExecutionRole.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: porth-tables-ceiling
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadPorthTables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthTenantsTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthTenantsTable}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthRolesTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthRolesTable}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthPermissionsTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthPermissionsTable}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthClaimMappingConfigsTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthClaimMappingConfigsTable}/index/*
              # PRF-12: porth-tenant writes the tenant row, its role and grants, and its permissions.
              # PRF-11 and PRF-14: bootstrap writes the platform claim mapping; reset removes the others.
              # Single items only - no BatchWrite, no transactions; Porth's create path uses neither.
              - Sid: WritePorthTables
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthTenantsTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthRolesTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthPermissionsTable}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthClaimMappingConfigsTable}
              # PRF-14 (Richard, 2026-10-24): reset finds every tenant as Porth's tenant directory does,
              # by scanning the tenants table. That table only, never an index or another table. IAM
              # cannot hold a Scan to one slot - it may READ other slots' rows there, never write them -
              # and the adapter filters to the slot before it acts on a row.
              - Sid: ScanTheTenantsTable
                Effect: Allow
                Action: dynamodb:Scan
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthTenantsTable}
              - Sid: PorthEventsOnly
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${PorthEventBus}
              # prawf's own bookkeeping - which run wrote what, which dataset each entity carries - in
              # prawf's own table, never Porth's (Richard, 2026-10-25). Same one-slot session.
              - Sid: PrawfAuditTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt AuditTable.Arn
              - Sid: ScanNothingElse
                Effect: Deny
                Action: dynamodb:Scan
                NotResource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PorthTenantsTable}
              - Sid: NeverPartiQL
                Effect: Deny
                Action:
                  - dynamodb:PartiQLSelect
                  - dynamodb:ExecuteStatement
                  - dynamodb:BatchExecuteStatement
                  - dynamodb:ExecuteTransaction
                Resource: '*'

  # What prawf wrote, by run and entity, and which dataset each entity carries (ledger.py). A test
  # tool's bookkeeping does not belong in the application's tables, so it lives here: one partition
  # per slot and entity, ENV#{slot}#ENTITY#{entity}, under the same one-slot session as Porth's rows.
  # Retained: it is the record of what prawf did to a slot - except when the deploy that created it
  # rolls back, which would otherwise strand a fixed-name table and fail the next deploy.
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: prawf-adapter-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # A separate policy, not an inline statement on ExecutionRole: DataRole's trust names
  # ExecutionRole, so granting AssumeRole inline would make each role depend on the other.
  ExecutionRoleMayAssumeDataRole:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: assume-data-role
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AssumeDataRoleOnly
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt DataRole.Arn

  SlotMapParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /prawf/adapter/slot-map
      Type: String
      Value: !Ref SlotMap
      Description: The target's own list of its slots. Read by the adapter on every call.

  AdapterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/porth-provisioning-adapter
      RetentionInDays: 30

  AdapterFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ExecutionRoleMayAssumeDataRole
      - AdapterLogGroup
    Properties:
      FunctionName: porth-provisioning-adapter
      Handler: handler.handler
      Runtime: python3.13
      CodeUri: src/adapter/
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt ExecutionRole.Arn
      Environment:
        Variables:
          SLOT_MAP_PARAMETER: !Ref SlotMapParameter
          DATA_ROLE_ARN: !GetAtt DataRole.Arn
          PORTH_STACK_NAME: !Ref PorthStackName
          PORTH_TENANTS_TABLE: !Ref PorthTenantsTable
          PORTH_ROLES_TABLE: !Ref PorthRolesTable
          PORTH_PERMISSIONS_TABLE: !Ref PorthPermissionsTable
          PORTH_CLAIM_MAPPING_CONFIGS_TABLE: !Ref PorthClaimMappingConfigsTable
          # porth-common reads it at import (config.EVENT_BUS_NAME). Its default, porth-events, is
          # not the bus Porth deploys - left unset, every seed would write a row and then fail.
          PORTH_EVENT_BUS: !Ref PorthEventBus
          PRAWF_AUDIT_TABLE: !Ref AuditTable
          ADAPTER_VERSION: !Ref AdapterVersion

  # The principal IS the restriction. No aws:SourceAccount condition: that key exists only when one
  # AWS service calls another, so for a role invoking directly it is absent, the StringEquals is
  # false, and every call is denied with an error that reads like a missing grant.
  # A resource policy that names a role binds to that role's unique id, not its name. When the
  # caller's role is deleted and recreated - as prawf-runner was when prawf became one solution stack
  # (2026-10-22) - this grant names a role that no longer exists: every call is denied, and Lambda then
  # rejects ANY change to the function's policy as "The provided principal was invalid" until the
  # stale statement is gone. So the deploy releases this grant before re-granting it - see the
  # workflow's SAM deploy step. Removing first is the only order that works.
  CallerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasCaller
    Properties:
      FunctionName: !Ref AdapterFunction
      Action: lambda:InvokeFunction
      Principal: !Ref CallerRoleArn

Outputs:
  AdapterFunctionArn:
    Description: What the target register points at. One fixed ARN per target (R8).
    Value: !GetAtt AdapterFunction.Arn
  DataRoleArn:
    Description: The ceiling role. Never assumed without a one-slot session policy.
    Value: !GetAtt DataRole.Arn
  SlotMapParameterName:
    Description: The target's own list of its slots.
    Value: !Ref SlotMapParameter
  AuditTableName:
    Description: prawf's record of what each run wrote, and which dataset each entity carries.
    Value: !Ref AuditTable
