AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  enterprise-membership-sample — Porth Admin UI.
  Public example demonstrating porth-common portability.
  Deploys a React SPA to S3/CloudFront backed by the Porth API.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  PorthApiUrl:
    Type: String
    Description: >
      Base URL of the deployed Porth API
      (output PorthApiUrl from the Components stack)

  PorthAuthorizerFunctionArn:
    Type: String
    Description: >
      ARN of Porth's Lambda authorizer (output AuthorizerFunctionArn from the
      Components stack). The sample app's API is authorized by the SAME function
      that guards Porth's own — PORTH-612. Without it the app's routes reach the
      Lambda with no requestContext.authorizer.lambda, tenant_id is None, and the
      app's middleware returns 401 before any permission is consulted.

  AcmCertificateArn:
    Type: String
    NoEcho: true
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]+'
    ConstraintDescription: Must be a valid ACM certificate ARN in us-east-1.
    Description: >
      ARN of the ACM certificate covering the CloudFront aliases.
      Must be in us-east-1 regardless of the stack region.

  CloudFrontAlias:
    Type: String
    Default: '*.porth-sample.ems.estynsoftware.cloud'
    Description: Wildcard alternate domain name for tenant subdomains.

  CloudFrontApexAlias:
    Type: String
    Default: 'porth-sample.ems.estynsoftware.cloud'
    Description: Apex alternate domain name — used as the platform admin entry point.

  PorthAuthorizerFunctionRoleArn:
    Type: String
    Default: ''
    Description: >-
      EXECUTION role ARN of Porth's Lambda authorizer (output
      AuthorizerFunctionRoleArn, SAR 0.3.1+). This is the principal the sample
      app's own role trusts — not PorthAuthorizerFunctionArn above, which is the
      function and cannot appear in a trust policy. Resolved from the Porth
      stack by deploy.yml.

  PorthEnvSlot:
    Type: String
    Default: prod
    Description: >-
      The ADR-Z8 slot this install is pinned to — EMS's FixedEnvironment, which
      is what Porth puts in the porth-env session tag. Deliberately NOT
      PorthEnvironment below: that one suffixes table names (porth-sample-app-dev)
      and this one scopes identities (ENV#prod#…). They differ in EMS, and
      conflating them silently scopes a policy to a slot that never appears in a
      tag.

      Two readers now: the session-tag condition below, and ffug's
      PORTH_FIXED_ENVIRONMENT (PORTH-587) — the value an inbound context
      envelope is checked against. deploy.yml resolves it from the Porth stack
      rather than defaulting, because both readers fail silently when it is
      wrong.

  SampleApiDomainName:
    Type: String
    Default: 'sample-api.porth-sample.ems.estynsoftware.cloud'
    Description: >-
      Custom domain for the sample app's API. It exists so the session-policy
      index can be keyed on a STABLE host: CloudFront sends the origin's Host,
      and the execute-api hostname it used to send carries the API id, so a
      binding keyed on it breaks silently the moment the API is replaced.
      Covered by the wildcard in CloudFrontAlias.

  PorthEnvironment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: >
      Environment name passed to Lambda functions as PORTH_ENVIRONMENT.
      Used to resolve DynamoDB table names (e.g. porth-sample-app-dev).

  UatRunnerComponentsRepo:
    Type: String
    Default: 'dragoninex1le/Components'
    Description: >
      Repository whose GitHub OIDC identity may assume the Porth UAT runner role
      (ADR-Z11 PORTH-553, Richard's Q13 ruling) — the repo the UAT suite lives in.

  UatRunnerConsumerRepo:
    Type: String
    Default: 'dragoninex1le/enterprise-membership-sample'
    Description: >
      Second repository allowed to assume the UAT runner role: this one, so the
      ffug isolation proof runs from its own workflow rather than through a
      cross-repo dispatch.

      Two String parameters rather than one CommaDelimitedList, deliberately.
      The list version was correct and still did not work. `UatRunnerSubjectClaim`
      already existed on the deployed stack, with a STORED VALUE naming only the
      Components repo — and a template DEFAULT does not override a stored
      parameter value: sam deploy reuses the previous one for any parameter it is
      not explicitly given. The trust policy therefore kept the single old
      subject while the template read as though it allowed both, and this repo's
      OIDC was refused (proof run 32454844345). NEW parameter names have no
      stored value, so their defaults actually apply.

      They are also comma-free, which matters: `--parameter-overrides` takes a
      space-separated Key=Value shorthand, and a comma inside one of those values
      is its own small adventure.

  # ── PORTH-587: what ffug needs from the Porth install ─────────────────────
  #
  # Four values, all resolved from the Porth stack by deploy.yml rather than
  # defaulted here. The first two are the trap worth naming: Environment and
  # FixedEnvironment are two different axes wearing one word, and on this
  # install they hold DIFFERENT VALUES (dev and prod respectively). Getting
  # them the wrong way round produces a service that reads configuration which
  # does not exist, or writes keys nothing can read — both silent.

  PorthBranch:
    Type: String
    Default: dev
    Description: >
      The Porth install's DEPLOYMENT axis — its stack's `Environment`
      parameter. Drives the SSM document prefix (/porth/{branch}/services,
      /porth/{branch}/auth-session-policy/*), the event bus name
      (porth-events-{branch}) and the context key alias. NOT the data slot.

  PorthEventBusName:
    Type: String
    Default: ''
    Description: >
      The Porth domain event bus (output EventBusName from the Porth stack).
      A CUSTOM bus, not `default` — a rule written against the default bus
      matches nothing and reports no error, which is how the sample app's
      EntityEvent consumer has sat inert (tracked separately).

  PorthContextSigningKeyArn:
    Type: String
    Default: ''
    Description: >
      ARN of the context-token signing KMS key, written to SSM by the
      porth-install-once Terraform module and resolved by deploy.yml.

      A plain String, deliberately, having been AWS::SSM::Parameter::Value<String>
      for exactly one failed deploy. That type makes CLOUDFORMATION resolve the
      path, at change-set creation, using the DEPLOY role's credentials — not the
      CFN execution role's, which is the surprising half. sample-app-deploy-role
      holds no ssm:GetParameters, so the deploy died with an AccessDenied naming
      an action nothing in this template asks for. Resolving it in the workflow
      puts the read somewhere a reader can see it.

      Empty is allowed and is NOT a silent degradation: the two KMS grants below
      are conditional on it, so an install without it deploys the table and the
      lifecycle consumer — the tenant still gets its salt from the bus — while
      the request path has no verifier and refuses every call. Which half is
      wired is reported in the stack outputs rather than left to be discovered.

Conditions:

  # PORTH-587. Both KMS grants name a key ARN in their Resource, and IAM rejects
  # an empty one. Absent the key, ffug deploys as the bus consumer only.
  HasContextSigningKey: !Not [!Equals [!Ref PorthContextSigningKeyArn, '']]

Resources:

  # ── DynamoDB table for sample app data ───────────────────────────────────

  SampleAppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub porth-sample-app-${PorthEnvironment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ── Sample app API, authorized by Porth ───────────────────────────────────
  #
  # PORTH-612. This used to be SAM's implicit HttpApi with no Auth at all, so
  # every request arrived unauthenticated: no requestContext.authorizer.lambda,
  # tenant_id None, and sample_app/middleware.py returned 401 before any
  # permission was consulted. The SPA read that 401 as a dead session, re-ran the
  # Porth login, succeeded, retried, and looped — while Porth's logs stayed clean,
  # because these routes never reached Porth at all.
  #
  # The configuration mirrors Porth's own API deliberately. In particular there is
  # NO identity source (PORTH-479 Path B): HTTP API identity sources are
  # AND-matched, so [Authorization, Cookie] cannot express "either", and requiring
  # Authorization makes API Gateway 401 cookie-only BFF requests *without invoking
  # the authorizer*. Our calls are cookie-authenticated, so that would reproduce
  # the exact failure this resource exists to fix.
  SampleAppApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: PorthAuthorizer
        Authorizers:
          PorthAuthorizer:
            AuthorizerPayloadFormatVersion: "2.0"
            # False, so the authorizer returns an IAM policy and its context
            # lands at requestContext.authorizer.lambda — which is exactly where
            # sample_app/auth_context.py reads it from. Simple responses would
            # move it and the app would see nothing.
            EnableSimpleResponses: false
            FunctionArn: !Ref PorthAuthorizerFunctionArn
            FunctionInvokeRole: !GetAtt SampleAppAuthorizerInvokeRole.Arn
      # No CorsConfiguration: after PORTH-612 the SPA calls this same-origin
      # through CloudFront, so there is no preflight to answer. Adding one would
      # invite the cross-origin arrangement that cannot carry the session cookie.

  # ── The sample app's API, under a name that does not move ────────────────
  #
  # PORTH-586. CloudFront's /sample/* behaviour uses AllViewerExceptHostHeader,
  # so the authorizer sees the ORIGIN's Host — which was
  # {SampleAppApi}.execute-api.{region}.amazonaws.com. That already
  # distinguished this API from Porth's, and a session-policy binding could
  # have been keyed on it. It should not be: the name contains the API id, so
  # replacing the API silently stops matching the binding and every call here
  # denies with `no_binding`. Configuration that is really a fingerprint.
  #
  # Regional, not edge-optimised: CloudFront is already in front of it, and an
  # edge-optimised domain would put a second CloudFront distribution behind the
  # first.
  SampleAppApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref SampleApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref AcmCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  SampleAppApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref SampleAppApi
      DomainName: !Ref SampleAppApiDomain
      # The app serves its routes AT /sample and the API's stage is $default, so
      # there is no mapping key: the path arrives whole, exactly as it does via
      # the execute-api hostname today.
      Stage: $default

  # The A record is NOT here. HostedZoneName makes CloudFormation resolve the
  # zone with route53:ListHostedZones, and sample-app-deploy-role holds
  # route53:ListHostedZonesByName — a different action. The whole change set
  # rolled back on that one denial.
  #
  # deploy.yml upserts it instead, exactly as it already does for the CloudFront
  # apex alias, using the permission the role actually has. The two values that
  # step needs are published as outputs below.

  # ── The app's own base role ──────────────────────────────────────────────
  #
  # PORTH-586, and the whole point of PORTH-585. Porth's authorizer assumes this
  # role for requests arriving on this app's host, and hands the app credentials
  # narrowed to one tenant — for the app's OWN table, which Porth knows nothing
  # about and must not.
  #
  # Nothing in Porth names this role. The grant is entirely the trust policy
  # below: same account, so a resource-based grant stands on its own.
  #
  # The name is composed by the index from ${role_type}, so it has to match
  # porth-sample-app-{role_type}-{env}.
  SampleAppTenantRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub porth-sample-app-tenant-${PorthEnvironment}
      Description: >-
        Assumed by Porth's authorizer for requests to the sample app's API.
        The CEILING: this app's table and nothing else. Which tenant a given
        session may read is decided by SampleAppSessionPolicy, passed per
        request by the session-policy index.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref PorthAuthorizerFunctionRoleArn
            # BOTH actions. sts:TagSession is not optional and its absence is
            # silent: the tags are dropped, the session policy's
            # ${aws:PrincipalTag/porth-tenant} resolves to nothing, matches no
            # key, and the session can read nothing at all.
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: AppTableCeiling
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # No tenant condition here, deliberately (PORTH-586 review).
              #
              # Two layers with two jobs: the role says WHAT this application may
              # ever touch, the session policy says WHICH TENANT this request may
              # touch it for. Putting the tenant condition in the role collapses
              # that — the role stops being reusable for anything that is not a
              # single-tenant request, and the per-request layer the index exists
              # to select stops carrying the decision it is there to carry.
              #
              # Effective permission is the intersection of the two, so this
              # breadth is not reachable on its own: the authorizer always passes
              # a session policy for this binding, and an index entry with none
              # is what `porth-install check-session-index` reports.
              - Sid: AppTableOnly
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt SampleAppTable.Arn
                  - !Sub "${SampleAppTable.Arn}/index/*"
              # Scan is absent from the ceiling as well as the session policy. It
              # populates no dynamodb:LeadingKeys, so ForAllValues:StringLike
              # passes vacuously against it — granting it anywhere in this pair
              # would read as tenant-scoped while reaching every tenant.

  # The per-request narrowing, passed by the session-policy index as a
  # PolicyArn on the assume. This is the isolating layer.
  #
  # PORTH-586 review: it did not exist. The binding passed an empty
  # session_policy_arns and the tenant condition sat on the role, which worked
  # and put the decision in the wrong place — check-session-index said as much,
  # as a non-fatal advisory, and the advisory was right.
  SampleAppSessionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub porth-sample-app-tenant-session-${PorthEnvironment}
      Description: >-
        Narrows an assumed porth-sample-app-tenant session to one tenant, via
        the session tags Porth attaches to every assume.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OneTenantPartition
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt SampleAppTable.Arn
              - !Sub "${SampleAppTable.Arn}/index/*"
            Condition:
              # Both patterns. This app's rows are written at exactly
              # TENANT#{tenant} with no trailing separator, so '#*' alone cannot
              # match them — the fault PORTH-593 found in Porth's own template.
              # And the bare TENANT#{tenant}* form is a prefix match, so 'acme'
              # would reach 'acme-staging'.
              ForAllValues:StringLike:
                dynamodb:LeadingKeys:
                  - "TENANT#${aws:PrincipalTag/porth-tenant}"
                  - "TENANT#${aws:PrincipalTag/porth-tenant}#*"
              # The environment is NOT in the LeadingKeys, because it is not in
              # the keys. This app's table is per-environment by NAME
              # (porth-sample-app-{env}), unlike Porth's, whose rows carry an
              # ENV#{slot}# prefix. Writing ENV# into these patterns would match
              # nothing and deny every request while looking stricter.
              #
              # So the slot is fenced on the tag itself: a session carrying
              # another environment's tag cannot use this policy at all. Same
              # axis, expressed where it actually exists.
              StringEquals:
                aws:PrincipalTag/porth-env: !Ref PorthEnvSlot

  # API Gateway assumes this to call Porth's authorizer, which lives in another
  # stack. Scoped to that one function ARN and nothing else.
  SampleAppAuthorizerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName on purpose. The CFN execution role scopes IAM to
      # role/enterprise-membership-sample-* (see
      # infra/receiving-account-templates/sample-app-deploy-role.yaml in
      # Components), and every other role in this stack is CloudFormation-named,
      # so it inherits the stack prefix and matches. An explicit name outside
      # that prefix is denied at CREATE — and would have required widening a
      # deliberately narrow IAM grant to add one role.
      #
      # Nothing refers to this role by name; the API references it by ARN.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePorthAuthorizer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref PorthAuthorizerFunctionArn

  # ── Sample app API Lambda ─────────────────────────────────────────────────

  SampleAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-sample-app-${PorthEnvironment}
      CodeUri: lambdas/
      Handler: sample_app.handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PORTH_ENVIRONMENT: !Ref PorthEnvironment
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          CLOUDFRONT_ALIAS: !Ref CloudFrontAlias
      # PORTH-586: NO DynamoDBCrudPolicy on this table, deliberately.
      #
      # This function serves authorized requests, and every one of them arrives
      # with credentials the authorizer minted for it — SampleAppTenantRole,
      # narrowed to one tenant by session tags. A standing grant here would sit
      # underneath that as unconditioned CRUD on the whole table, every tenant,
      # and the narrowing above it would be advisory: any path that lost its
      # credentials would keep working, silently, against everyone's rows.
      #
      # Porth removed exactly this from its own API function in PORTH-550, for
      # exactly this reason. Nothing to fall back to is the point.
      #
      # SampleAppEventConsumerFunction below keeps its grant: no authorizer runs
      # for an EventBridge delivery, so it has no request credentials and its
      # execution role is the only identity available to it.
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            # The explicit, Porth-authorized API — not SAM's implicit one.
            ApiId: !Ref SampleAppApi
            Path: /sample/{proxy+}
            Method: ANY

  # ── Sample app EventBridge consumer Lambda ────────────────────────────────

  SampleAppEventConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-sample-app-events-${PorthEnvironment}
      CodeUri: lambdas/
      Handler: sample_app_events.handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          PORTH_ENVIRONMENT: !Ref PorthEnvironment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SampleAppTable
      Events:
        PorthEntityEvents:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - porth.components
              detail-type:
                - EntityEvent

  # ── ffug — deliberately dumb consuming service (ADR-Z11 PORTH-555) ───────
  # A test fixture, not a product. Echo-with-storage only; see lambdas/ffug/README.md
  # for the boundary rules. Phase A: plain IAM invoke, no porth-common.

  FfugTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub porth-ffug-${PorthEnvironment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        # ADR-Z8 shape — rows sit under ENV#{env}#TENANT#{tenant}, so tenant
        # isolation is a property of the key rather than of a code check.
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # PORTH-587. tenant.deleted strips the projection row of its salt and
      # stamps expires_at on what is left. That remainder is the order gate
      # which stops a late pre-deletion event resurrecting the tenant — it
      # holds a tenant id, a timestamp and nothing else. Bounded rather than
      # permanent because a marker that never expires IS residue, and
      # residue-free teardown is a UAT-5 assertion.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # The identity ffug narrows FROM (PORTH-550 / PORTH-587). ffug's execution
  # role holds no data access of its own; it assumes this one per request with
  # an inline session policy naming the request's tenant, and the intersection
  # is what reaches DynamoDB. Same mechanism the authorizer applies to a human
  # caller — applied here by the service to itself, because on the internal
  # plane there was no authorizer to do it.
  #
  # Unnamed, like every other role in this stack: the CFN execution role scopes
  # IAM to role/enterprise-membership-sample-*, which a CloudFormation-generated
  # name inherits and an explicit one would not.
  FfugTenantRole:
    Type: AWS::IAM::Role
    Properties:
      # ASCII only - IAM rejects anything outside Latin-1 printable, notably the
      # em dash this codebase uses freely. ffug-tests.yml guards it on the PR
      # because CloudFormation only finds out mid-deploy and rolls the stack back.
      Description: "ffug per-tenant data identity - assumed with a tenant-scoped session policy (PORTH-587)."
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # Account root, NOT the function role. Naming the function role here
            # is a CloudFormation cycle: this role would reference it, and it
            # would reference this role to be granted sts:AssumeRole. Root trust
            # means "assumable by any principal in this account that has been
            # GRANTED sts:AssumeRole on it" — the grant is the gate, and it
            # lives on the caller (FfugFunctionRole below), where it is visible.
            #
            # No sts:TagSession. PORTH-607 added it to PorthTenantRole's trust
            # for the authorizer's external path, which tags sessions;
            # narrowed_credentials() on the internal plane calls AssumeRole with
            # no Tags. Stated because a reviewer working from the PorthTenantRole
            # precedent will otherwise add it by reflex.
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ffug-table-tenant-keyed
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The CEILING. The per-request session policy intersects with it,
              # so the effective reach is one tenant's rows in one table.
              #
              # dynamodb:Scan is deliberately ABSENT and must stay absent. Scan
              # populates no dynamodb:LeadingKeys, so ForAllValues passes
              # vacuously against it and the condition below would bind nothing
              # — it is the one action no key condition can constrain (the trap
              # PORTH-580 exists to retire on Porth's own platform policy).
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt FfugTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      # Both shapes, matching tenant-scoped-default. The bare
                      # partition is the projection row; the #* form is
                      # everything under it. Omitting the bare one would make
                      # the salt unreadable and the failure would look like an
                      # unprovisioned tenant.
                      - ENV#*#TENANT#*
                      - ENV#*#TENANT#*#*

  # ffug's execution role. Note what is NOT here: any DynamoDB permission at
  # all. It used to carry DynamoDBCrudPolicy on FfugTable, and removing that is
  # the point of PORTH-587 rather than tidying. The Director raises instead of
  # proceeding when it cannot narrow, so with no ambient grant to fall back on,
  # a narrowing bug surfaces as AccessDenied — fail-closed as a structural
  # property rather than as a behaviour something could regress.
  FfugFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "ffug execution role - verifies context envelopes and assumes its tenant role. Holds no data access."
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ffug-narrow-and-verify
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !GetAtt FfugTenantRole.Arn
              # kms:Verify and NEVER kms:Sign (Head of Security condition H1).
              # ffug is a receiver: it checks that context was minted by someone
              # entitled to mint it, and cannot mint any itself. This role
              # attempting Sign and being denied is what UAT-4 witnesses live,
              # so adding Sign here would not merely widen a permission — it
              # would delete the demonstration.
              #
              # Conditional only because IAM rejects an empty Resource. Without
              # the key ffug has no verifier and refuses every call — loudly, at
              # the boundary — which is the correct posture for a service that
              # cannot check who is calling it.
              - !If
                - HasContextSigningKey
                - Effect: Allow
                  Action: kms:Verify
                  Resource: !Ref PorthContextSigningKeyArn
                - !Ref AWS::NoValue
              # The D3 service registry (is the calling service registered and
              # active?) and the session-policy template the narrowing renders.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/porth/${PorthBranch}/services
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/porth/${PorthBranch}/auth-session-policy/*

  FfugFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-ffug-${PorthEnvironment}
      CodeUri: lambdas/
      Handler: ffug.handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      # Explicit Role, so FfugTenantRole can be referenced by ARN above. SAM
      # rejects Role and Policies together — everything is in the role.
      Role: !GetAtt FfugFunctionRole.Arn
      Environment:
        Variables:
          # The two axes, kept apart on purpose. PORTH_BRANCH addresses
          # configuration; PORTH_FIXED_ENVIRONMENT addresses data. They hold
          # different values on this install.
          PORTH_BRANCH: !Ref PorthBranch
          PORTH_FIXED_ENVIRONMENT: !Ref PorthEnvSlot
          PORTH_ENVIRONMENT: !Ref PorthEnvironment
          # This service's registered identity — the audience it will accept in
          # a context token. Unset, the Director refuses every internal call
          # rather than skipping the audience check.
          PORTH_SERVICE_ID: ffug
          PORTH_SERVICE_DATA_IDENTITY: !GetAtt FfugTenantRole.Arn
          # Fetched by name as auth-session-policy/{name}, from the same
          # documents the authorizer selects among — one place to change the
          # narrowing rule rather than a copy that drifts (the defect entry 3
          # of the EMS upgrade log describes).
          PORTH_SERVICE_DATA_SCOPE: tenant-scoped-default
          FFUG_TABLE_NAME: !Ref FfugTable
      # No Events — ffug is invoked directly (IAM/SigV4), never through a
      # public HTTP route. The internal plane is the whole point.

  # ── ffug lifecycle consumer (PORTH-546 adoption, PORTH-587) ───────────────
  #
  # The half that runs with nobody calling ffug: a tenant acquires its salt in
  # ffug because Porth announced the tenant, not because anyone made a request.
  #
  # Its own function and its own role, deliberately. It acts for the platform,
  # across tenants, before any caller for that tenant exists — so it has the
  # opposite identity requirements to the request path and sharing a role would
  # mean granting the request path what this one needs. Narrowing this consumer
  # per record too is the stronger form of the claim and is its own ticket.
  FfugLifecycleFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "ffug lifecycle consumer - maintains the tenant projection from the Porth event bus (PORTH-587)."
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ffug-projection-maintenance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Unconditioned and cross-tenant, and that is the honest shape:
              # this function's whole job is to establish the boundary that
              # everything else is then bound by. No KMS and no STS — a bus
              # event is not an envelope and carries no signature to verify.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt FfugTable.Arn

  FfugLifecycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-ffug-lifecycle-${PorthEnvironment}
      CodeUri: lambdas/
      Handler: ffug.lifecycle.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt FfugLifecycleFunctionRole.Arn
      Environment:
        Variables:
          PORTH_BRANCH: !Ref PorthBranch
          PORTH_ENVIRONMENT: !Ref PorthEnvironment
          FFUG_TABLE_NAME: !Ref FfugTable
      Events:
        TenantLifecycle:
          Type: EventBridgeRule
          Properties:
            # The Porth domain bus, NOT the default bus. Porth publishes here
            # and nowhere else, so a rule that omits this matches nothing and
            # says nothing about it.
            EventBusName: !Ref PorthEventBusName
            Pattern:
              source:
                - porth.user-management
              detail-type:
                # Contract v1, lowercase. The capitalised `Tenant.*` domain
                # events are the audit/search feed and are explicitly NOT this
                # contract — subscribing to them from a consuming service is
                # the documented wrong thing.
                - tenant.created
                - tenant.updated
                - tenant.suspended
                - tenant.reactivated
                - tenant.deleted

  # Role the Components-repo UAT suite assumes to reach ffug in this account
  # (Q13 ruling, 2026-08-05). Unnamed deliberately: the deploy runs with
  # CAPABILITY_IAM, and a named role would require CAPABILITY_NAMED_IAM.
  # Consumers read the ARN from the stack output below.
  PorthUatRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      # ASCII only: the IAM API rejects any character outside the Latin-1
      # printable range, which excludes the em dash this codebase uses freely
      # in prose. Cost of learning that: one rolled-back stack (run
      # 31216080066). The guard in ffug-tests.yml now catches it on the PR.
      Description: "Porth ADR-Z11 UAT runner - mints context, invokes ffug, and reads its table to prove isolation."
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Both repos, ORed. Built with !Sub from two parameters rather
                # than passed as one pre-formatted list, so the trust policy
                # shows the shape it enforces instead of deferring it to a
                # parameter value nobody reads.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${UatRunnerComponentsRepo}:*'
                  - !Sub 'repo:${UatRunnerConsumerRepo}:*'
      Policies:
        - PolicyName: invoke-and-read-ffug
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FfugFunction.Arn
              # Read-only on the table so UAT journeys can prove isolation and
              # residue-free teardown by inspection. Never write.
              #
              # This grant is also why the salt is not a secret: whoever holds
              # this role can read every tenant's. Deliberate — it is what makes
              # "two tenants, two salts" checkable by inspection. The isolation
              # claim is that FFUG cannot make that read, not that nobody can.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt FfugTable.Arn
              # PORTH-587 — the signer. Without this NOTHING in this account can
              # mint a context token, so the internal plane has no caller and
              # ADR-Z11's UAT-2/3/4 cannot run at all. Porth's own dev-class
              # grant (PorthContextDeveloperSignPolicy) is emitted only when the
              # install passes DeveloperSignRoleArns, and porth-install.yml never
              # does — a green install with no signer and no error anywhere.
              #
              # Granting it here works because the context key's policy allows
              # the account root and denies only cross-account use, so
              # authorisation is delegated to IAM identity policies. That is
              # itself a finding, recorded in Components PR #294: the dev-class
              # condition governs what PORTH's template emits, not who in the
              # account can sign. If that hole is later closed with an explicit
              # key-policy Deny, THIS ROLE must be on the allow-list or the ffug
              # UAT stops working.
              #
              # ffug's own role holds kms:Verify and never this. The split is
              # the point: a compromised receiver cannot mint context for
              # another tenant (H1).
              - !If
                - HasContextSigningKey
                - Effect: Allow
                  Action: kms:Sign
                  Resource: !Ref PorthContextSigningKeyArn
                - !Ref AWS::NoValue

  # ── S3 bucket for React SPA static assets ────────────────────────────────

  AdminUIBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub porth-admin-ui-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AdminUIBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminUIBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AdminUIBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ── CloudFront OAC + Distribution ────────────────────────────────────────

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub porth-admin-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Comment: !Sub Porth Admin UI - ${Environment}
        Aliases:
          - !Ref CloudFrontAlias
          - !Ref CloudFrontApexAlias
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        # SPA fallback: serve index.html for all 403/404 so React Router handles routing
        # No CustomErrorResponses. They are DISTRIBUTION-WIDE — there is no way
        # to scope them to a behaviour — so the 403/404 → 200 /index.html rules
        # that existed for SPA deep links were also rewriting every API error
        # into a success.
        #
        # The symptom was a frontend crash that named nothing:
        #
        #     TypeError: s.map is not a function
        #
        # /sample/approvals returned 403, CloudFront turned it into 200 plus an
        # HTML document, axios saw 2xx and resolved, and the page called .map on
        # a string. Every API failure — a denied authorizer, a missing
        # permission, an unmapped route — arrived at the SPA wearing the same
        # disguise, and none of them could be told apart or even seen.
        #
        # Deep links are handled at the edge instead, on the DEFAULT behaviour
        # only, so /sample/* and /porth/* now return what they actually mean.
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaFallbackFunction.FunctionMetadata.FunctionARN
        # PORTH-531 / ADR-Z9 "Path B" — serve the BFF auth routes SAME-ORIGIN.
        #
        # The SPA and the Porth API are different subdomains, so calling
        # /auth/me cross-origin with credentials:'include' is rejected outright:
        # a credentialed request may not receive Access-Control-Allow-Origin: *,
        # which is what Porth answers by default. Routing /auth/* through this
        # distribution removes the cross-origin hop entirely and makes the
        # session cookie host-only. Same arrangement as the Style Classifier
        # admin app.
        CacheBehaviors:
          - PathPattern: /auth/*
            TargetOriginId: PorthApiOrigin
            ViewerProtocolPolicy: https-only
            # CachingDisabled — these are auth redirects and session reads;
            # caching any of them would serve one user's session to another.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards cookies, query strings and
            # viewer headers, but sends the ORIGIN's Host, which API Gateway's
            # custom domain needs to route the request.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
          # PORTH-531 — the API must be same-origin too, not only /auth/*.
          #
          # A credentialed cross-origin call to the Porth API can never pass the
          # browser's preflight: the API answers Access-Control-Allow-Origin: *
          # with no Allow-Credentials, and its allowed headers do not include
          # X-CSRF-Token (verified against the live API). SpaOrigins does not
          # change that — it feeds the authorizer's Origin allow-list, a
          # different layer. So the SPA calls the relative /porth prefix and
          # this behaviour forwards it to the API, with a CloudFront Function
          # stripping the prefix. Same arrangement as the Style Classifier
          # admin app ("the API base is the relative /porth prefix; CloudFront
          # strips it → the Porth API").
          - PathPattern: /porth/*
            TargetOriginId: PorthApiOrigin
            ViewerProtocolPolicy: https-only
            # CachingDisabled — authenticated API reads and writes.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards the empty Authorization
            # bearer (the authorizer's identity source), cookies and
            # X-CSRF-Token; sends the origin's Host for the API custom domain.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt PorthApiPathStripFunction.FunctionMetadata.FunctionARN
          # PORTH-612 — the sample app's API has to be same-origin for exactly the
          # reason /porth/* is. The session cookie is scoped to the zone, so a call
          # to the raw execute-api host never carries it: the request arrives
          # unauthenticated, the authorizer resolves no session, and the app 401s.
          # Attaching the authorizer alone does not fix that — both halves are
          # required, and either alone still fails.
          #
          # No path-strip function here: the app serves its routes AT /sample
          # (routers use prefix="/sample/ar" and the event path is
          # /sample/{proxy+}), so the prefix is real rather than a routing
          # convenience. Stripping it would 404 every call.
          - PathPattern: /sample/*
            TargetOriginId: SampleApiOrigin
            ViewerProtocolPolicy: https-only
            # CachingDisabled — authenticated, tenant-scoped reads and writes.
            # Caching any of these would serve one tenant's data to another.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards the session cookie and
            # X-CSRF-Token, and sends the origin's Host so API Gateway routes it.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AdminUIBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: PorthApiOrigin
            # PorthApiUrl is "https://host" — index 2 of the "/"-split is the host.
            DomainName: !Select [2, !Split ["/", !Ref PorthApiUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: SampleApiOrigin
            # PORTH-586 — the custom domain rather than the execute-api
            # hostname, so the Host the authorizer sees is stable and the
            # session-policy binding can be keyed on it. DependsOn is implicit
            # through the !Ref, but the API mapping must exist before traffic
            # arrives or the domain answers 404.
            DomainName: !Ref SampleApiDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

  # Rewrites SPA deep links to /index.html at the edge.
  #
  # Attached ONLY to the default behaviour, which is the whole point: the API
  # behaviours never see it, so their status codes survive. A path with a file
  # extension is an asset and passes through; anything else is a client route
  # that S3 has no object for, and would 404.
  SpaFallbackFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-fallback
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless paths to /index.html for SPA routing
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // An extension means an asset: /assets/index-abc.js, /favicon.ico.
          // Everything else is a client-side route.
          if (uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # Strips the /porth prefix the SPA uses for same-origin API calls; the Porth
  # API serves its routes at the root of its custom domain (PORTH-531).
  PorthApiPathStripFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub porth-admin-porth-strip-${Environment}
      AutoPublish: true
      FunctionConfig:
        Comment: Strip the /porth prefix before forwarding to the Porth API origin
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/porth/, '');
          if (request.uri === '') { request.uri = '/'; }
          return request;
        }

Outputs:

  AdminUIBucketName:
    Description: S3 bucket for the React admin SPA
    Value: !Ref AdminUIBucket
    Export:
      Name: !Sub ${AWS::StackName}-AdminUIBucketName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (used for cache invalidation in CI)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDistributionId

  CloudFrontUrl:
    Description: Public URL of the Porth Admin UI
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  SampleApiDomainName:
    Description: >-
      Custom domain the sample app's API answers on. This is the host the
      authorizer matches against context_rules in the session-policy index.
    Value: !Ref SampleApiDomainName
  SampleApiDomainRegionalDomainName:
    Description: >-
      Alias target for the sample API's custom domain. Consumed by deploy.yml's
      Route 53 upsert — see SampleAppApiDomain for why the record is not a
      stack resource.
    Value: !GetAtt SampleAppApiDomain.RegionalDomainName
  SampleApiDomainRegionalHostedZoneId:
    Description: Hosted zone of the alias target, for the same upsert.
    Value: !GetAtt SampleAppApiDomain.RegionalHostedZoneId
  SampleAppSessionPolicyArn:
    Description: >-
      The per-request narrowing the session-policy index passes on the assume.
      Named by the binding in deploy/porth/session-policy/index.template.json.
    Value: !Ref SampleAppSessionPolicy
  SampleAppTenantRoleArn:
    Description: >-
      The app's own base role, assumed by Porth's authorizer for requests to
      this app. Named by the session-policy index binding.
    Value: !GetAtt SampleAppTenantRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontUrl

  SampleAppApiUrl:
    Description: >
      Sample app API Gateway URL. The SPA no longer calls this directly — it goes
      through CloudFront at /sample/* so the session cookie is same-origin
      (PORTH-612). Kept for diagnostics and for callers that hold their own token.
    Value: !Sub https://${SampleAppApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub ${AWS::StackName}-SampleAppApiUrl

  FfugFunctionArn:
    Description: ffug Lambda ARN — the ADR-Z11 UAT compute target (PORTH-555)
    Value: !GetAtt FfugFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-FfugFunctionArn

  FfugTableName:
    Description: ffug tenant-keyed DynamoDB table
    Value: !Ref FfugTable
    Export:
      Name: !Sub ${AWS::StackName}-FfugTableName

  FfugLifecycleFunctionArn:
    Description: >
      ffug's tenant-lifecycle consumer (PORTH-587). Subscribed to the Porth
      domain bus; this is where a tenant's salt is minted, before any caller
      exists.
    Value: !GetAtt FfugLifecycleFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-FfugLifecycleFunctionArn

  FfugInternalPlaneWired:
    Description: >
      Whether ffug's REQUEST path is wired (PORTH-587). "yes" means the context
      signing key was resolved, so ffug can verify an envelope and the UAT
      runner can mint one. "no" means only the bus half is live: tenants still
      get their salt from tenant.created, and every synchronous call is refused
      because there is no verifier. Published because the difference is
      otherwise invisible until something calls ffug.
    Value: !If [HasContextSigningKey, 'yes', 'no']

  FfugTenantRoleArn:
    Description: >
      The identity ffug narrows from per request (PORTH-587). Published so a UAT
      journey can assert on the effective session policy rather than infer it.
    Value: !GetAtt FfugTenantRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-FfugTenantRoleArn

  PorthUatRunnerRoleArn:
    Description: Role the Components-repo UAT workflow assumes to reach ffug (Q13)
    Value: !GetAtt PorthUatRunnerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PorthUatRunnerRoleArn
