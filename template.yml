AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  enterprise-membership-sample — Porth Admin UI.
  Public example demonstrating porth-common portability.
  Deploys a React SPA to S3/CloudFront backed by the Porth API.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  PorthApiUrl:
    Type: String
    Description: >
      Base URL of the deployed Porth API
      (output PorthApiUrl from the Components stack)

  PorthAuthorizerFunctionArn:
    Type: String
    Description: >
      ARN of Porth's Lambda authorizer (output AuthorizerFunctionArn from the
      Components stack). The sample app's API is authorized by the SAME function
      that guards Porth's own — PORTH-612. Without it the app's routes reach the
      Lambda with no requestContext.authorizer.lambda, tenant_id is None, and the
      app's middleware returns 401 before any permission is consulted.

  AcmCertificateArn:
    Type: String
    NoEcho: true
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]+'
    ConstraintDescription: Must be a valid ACM certificate ARN in us-east-1.
    Description: >
      ARN of the ACM certificate covering the CloudFront aliases.
      Must be in us-east-1 regardless of the stack region.

  CloudFrontAlias:
    Type: String
    Default: '*.porth-sample.ems.estynsoftware.cloud'
    Description: Wildcard alternate domain name for tenant subdomains.

  CloudFrontApexAlias:
    Type: String
    Default: 'porth-sample.ems.estynsoftware.cloud'
    Description: Apex alternate domain name — used as the platform admin entry point.

  PorthAuthorizerFunctionRoleArn:
    Type: String
    Default: ''
    Description: >-
      EXECUTION role ARN of Porth's Lambda authorizer (output
      AuthorizerFunctionRoleArn, SAR 0.3.1+). This is the principal the sample
      app's own role trusts — not PorthAuthorizerFunctionArn above, which is the
      function and cannot appear in a trust policy. Resolved from the Porth
      stack by deploy.yml.

  PorthEnvSlot:
    Type: String
    Default: prod
    Description: >-
      The ADR-Z8 slot this install is pinned to — EMS's FixedEnvironment, which
      is what Porth puts in the porth-env session tag. Deliberately NOT
      PorthEnvironment below: that one suffixes table names (porth-sample-app-dev)
      and this one scopes identities (ENV#prod#…). They differ in EMS, and
      conflating them silently scopes a policy to a slot that never appears in a
      tag.

  SampleApiDomainName:
    Type: String
    Default: 'sample-api.porth-sample.ems.estynsoftware.cloud'
    Description: >-
      Custom domain for the sample app's API. It exists so the session-policy
      index can be keyed on a STABLE host: CloudFront sends the origin's Host,
      and the execute-api hostname it used to send carries the API id, so a
      binding keyed on it breaks silently the moment the API is replaced.
      Covered by the wildcard in CloudFrontAlias.

  PorthEnvironment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: >
      Environment name passed to Lambda functions as PORTH_ENVIRONMENT.
      Used to resolve DynamoDB table names (e.g. porth-sample-app-dev).

  UatRunnerSubjectClaim:
    Type: String
    Default: 'repo:dragoninex1le/Components:*'
    Description: >
      GitHub OIDC subject claim allowed to assume the Porth UAT runner role
      (ADR-Z11 PORTH-553, Richard's Q13 ruling). The UAT suite lives in the
      Components repo and calls ffug in this account. Tighten to a specific
      environment or ref when the UAT workflow's identity is fixed, e.g.
      'repo:dragoninex1le/Components:environment:porth-uat'.

Resources:

  # ── DynamoDB table for sample app data ───────────────────────────────────

  SampleAppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub porth-sample-app-${PorthEnvironment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ── Sample app API, authorized by Porth ───────────────────────────────────
  #
  # PORTH-612. This used to be SAM's implicit HttpApi with no Auth at all, so
  # every request arrived unauthenticated: no requestContext.authorizer.lambda,
  # tenant_id None, and sample_app/middleware.py returned 401 before any
  # permission was consulted. The SPA read that 401 as a dead session, re-ran the
  # Porth login, succeeded, retried, and looped — while Porth's logs stayed clean,
  # because these routes never reached Porth at all.
  #
  # The configuration mirrors Porth's own API deliberately. In particular there is
  # NO identity source (PORTH-479 Path B): HTTP API identity sources are
  # AND-matched, so [Authorization, Cookie] cannot express "either", and requiring
  # Authorization makes API Gateway 401 cookie-only BFF requests *without invoking
  # the authorizer*. Our calls are cookie-authenticated, so that would reproduce
  # the exact failure this resource exists to fix.
  SampleAppApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: PorthAuthorizer
        Authorizers:
          PorthAuthorizer:
            AuthorizerPayloadFormatVersion: "2.0"
            # False, so the authorizer returns an IAM policy and its context
            # lands at requestContext.authorizer.lambda — which is exactly where
            # sample_app/auth_context.py reads it from. Simple responses would
            # move it and the app would see nothing.
            EnableSimpleResponses: false
            FunctionArn: !Ref PorthAuthorizerFunctionArn
            FunctionInvokeRole: !GetAtt SampleAppAuthorizerInvokeRole.Arn
      # No CorsConfiguration: after PORTH-612 the SPA calls this same-origin
      # through CloudFront, so there is no preflight to answer. Adding one would
      # invite the cross-origin arrangement that cannot carry the session cookie.

  # ── The sample app's API, under a name that does not move ────────────────
  #
  # PORTH-586. CloudFront's /sample/* behaviour uses AllViewerExceptHostHeader,
  # so the authorizer sees the ORIGIN's Host — which was
  # {SampleAppApi}.execute-api.{region}.amazonaws.com. That already
  # distinguished this API from Porth's, and a session-policy binding could
  # have been keyed on it. It should not be: the name contains the API id, so
  # replacing the API silently stops matching the binding and every call here
  # denies with `no_binding`. Configuration that is really a fingerprint.
  #
  # Regional, not edge-optimised: CloudFront is already in front of it, and an
  # edge-optimised domain would put a second CloudFront distribution behind the
  # first.
  SampleAppApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref SampleApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref AcmCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  SampleAppApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref SampleAppApi
      DomainName: !Ref SampleAppApiDomain
      # The app serves its routes AT /sample and the API's stage is $default, so
      # there is no mapping key: the path arrives whole, exactly as it does via
      # the execute-api hostname today.
      Stage: $default

  SampleAppApiDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: 'ems.estynsoftware.cloud.'
      Name: !Ref SampleApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SampleAppApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt SampleAppApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  # ── The app's own base role ──────────────────────────────────────────────
  #
  # PORTH-586, and the whole point of PORTH-585. Porth's authorizer assumes this
  # role for requests arriving on this app's host, and hands the app credentials
  # narrowed to one tenant — for the app's OWN table, which Porth knows nothing
  # about and must not.
  #
  # Nothing in Porth names this role. The grant is entirely the trust policy
  # below: same account, so a resource-based grant stands on its own.
  #
  # The name is composed by the index from ${role_type}, so it has to match
  # porth-sample-app-{role_type}-{env}.
  SampleAppTenantRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub porth-sample-app-tenant-${PorthEnvironment}
      Description: >-
        Assumed by Porth's authorizer for requests to the sample app's API.
        Narrowed to one tenant by the porth-tenant session tag.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref PorthAuthorizerFunctionRoleArn
            # BOTH actions. sts:TagSession is not optional and its absence is
            # silent: the tags are dropped, ${aws:PrincipalTag/porth-tenant}
            # below resolves to nothing, matches no key, and the session can
            # read nothing at all — with no error naming the cause.
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: TenantScopedAppTable
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Tenant isolation is the KEY, environment isolation is the TABLE.
              # This table is per-environment by name (porth-sample-app-dev), so
              # there is no ENV# prefix in its keys to condition on and writing
              # one would constrain nothing. The slot is fenced by the second
              # statement's condition instead, on the tag itself.
              - Sid: TenantPartitionOnly
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt SampleAppTable.Arn
                  - !Sub "${SampleAppTable.Arn}/index/*"
                Condition:
                  # Two patterns, both needed. The tenant's own record has PK
                  # exactly TENANT#{tenant} with no trailing separator, so the
                  # '#*' pattern alone cannot match it — the mistake PORTH-593
                  # fixed in Porth's own policy. And the bare TENANT#{tenant}*
                  # form is a PREFIX match, so 'acme' would reach 'acme-staging'.
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - "TENANT#${aws:PrincipalTag/porth-tenant}"
                      - "TENANT#${aws:PrincipalTag/porth-tenant}#*"
                  # A session from another slot cannot use this role at all.
                  StringEquals:
                    aws:PrincipalTag/porth-env: !Ref PorthEnvSlot
              # Scan is absent on purpose. It populates no dynamodb:LeadingKeys,
              # so ForAllValues:StringLike passes vacuously against it — granting
              # it here would read as tenant-scoped while reaching every tenant.

  # API Gateway assumes this to call Porth's authorizer, which lives in another
  # stack. Scoped to that one function ARN and nothing else.
  SampleAppAuthorizerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName on purpose. The CFN execution role scopes IAM to
      # role/enterprise-membership-sample-* (see
      # infra/receiving-account-templates/sample-app-deploy-role.yaml in
      # Components), and every other role in this stack is CloudFormation-named,
      # so it inherits the stack prefix and matches. An explicit name outside
      # that prefix is denied at CREATE — and would have required widening a
      # deliberately narrow IAM grant to add one role.
      #
      # Nothing refers to this role by name; the API references it by ARN.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePorthAuthorizer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref PorthAuthorizerFunctionArn

  # ── Sample app API Lambda ─────────────────────────────────────────────────

  SampleAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-sample-app-${PorthEnvironment}
      CodeUri: lambdas/
      Handler: sample_app.handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PORTH_ENVIRONMENT: !Ref PorthEnvironment
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          CLOUDFRONT_ALIAS: !Ref CloudFrontAlias
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SampleAppTable
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            # The explicit, Porth-authorized API — not SAM's implicit one.
            ApiId: !Ref SampleAppApi
            Path: /sample/{proxy+}
            Method: ANY

  # ── Sample app EventBridge consumer Lambda ────────────────────────────────

  SampleAppEventConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-sample-app-events-${PorthEnvironment}
      CodeUri: lambdas/
      Handler: sample_app_events.handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          PORTH_ENVIRONMENT: !Ref PorthEnvironment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SampleAppTable
      Events:
        PorthEntityEvents:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - porth.components
              detail-type:
                - EntityEvent

  # ── ffug — deliberately dumb consuming service (ADR-Z11 PORTH-555) ───────
  # A test fixture, not a product. Echo-with-storage only; see lambdas/ffug/README.md
  # for the boundary rules. Phase A: plain IAM invoke, no porth-common.

  FfugTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub porth-ffug-${PorthEnvironment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        # ADR-Z8 shape — rows sit under ENV#{env}#TENANT#{tenant}, so tenant
        # isolation is a property of the key rather than of a code check.
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  FfugFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub porth-ffug-${PorthEnvironment}
      CodeUri: lambdas/
      Handler: ffug.handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          PORTH_ENVIRONMENT: !Ref PorthEnvironment
          FFUG_TABLE_NAME: !Ref FfugTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FfugTable
      # No Events — ffug is invoked directly (IAM/SigV4), never through a
      # public HTTP route. The internal plane is the whole point.

  # Role the Components-repo UAT suite assumes to reach ffug in this account
  # (Q13 ruling, 2026-08-05). Unnamed deliberately: the deploy runs with
  # CAPABILITY_IAM, and a named role would require CAPABILITY_NAMED_IAM.
  # Consumers read the ARN from the stack output below.
  PorthUatRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      # ASCII only: the IAM API rejects any character outside the Latin-1
      # printable range, which excludes the em dash this codebase uses freely
      # in prose. Cost of learning that: one rolled-back stack (run
      # 31216080066). The guard in ffug-tests.yml now catches it on the PR.
      Description: "Porth ADR-Z11 UAT runner - invoke/read ffug from the Components repo's UAT workflow."
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref UatRunnerSubjectClaim
      Policies:
        - PolicyName: invoke-and-read-ffug
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FfugFunction.Arn
              # Read-only on the table so UAT journeys can prove isolation and
              # residue-free teardown by inspection. Never write.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt FfugTable.Arn

  # ── S3 bucket for React SPA static assets ────────────────────────────────

  AdminUIBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub porth-admin-ui-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AdminUIBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminUIBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AdminUIBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ── CloudFront OAC + Distribution ────────────────────────────────────────

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub porth-admin-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Comment: !Sub Porth Admin UI - ${Environment}
        Aliases:
          - !Ref CloudFrontAlias
          - !Ref CloudFrontApexAlias
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        # SPA fallback: serve index.html for all 403/404 so React Router handles routing
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
        # PORTH-531 / ADR-Z9 "Path B" — serve the BFF auth routes SAME-ORIGIN.
        #
        # The SPA and the Porth API are different subdomains, so calling
        # /auth/me cross-origin with credentials:'include' is rejected outright:
        # a credentialed request may not receive Access-Control-Allow-Origin: *,
        # which is what Porth answers by default. Routing /auth/* through this
        # distribution removes the cross-origin hop entirely and makes the
        # session cookie host-only. Same arrangement as the Style Classifier
        # admin app.
        CacheBehaviors:
          - PathPattern: /auth/*
            TargetOriginId: PorthApiOrigin
            ViewerProtocolPolicy: https-only
            # CachingDisabled — these are auth redirects and session reads;
            # caching any of them would serve one user's session to another.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards cookies, query strings and
            # viewer headers, but sends the ORIGIN's Host, which API Gateway's
            # custom domain needs to route the request.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
          # PORTH-531 — the API must be same-origin too, not only /auth/*.
          #
          # A credentialed cross-origin call to the Porth API can never pass the
          # browser's preflight: the API answers Access-Control-Allow-Origin: *
          # with no Allow-Credentials, and its allowed headers do not include
          # X-CSRF-Token (verified against the live API). SpaOrigins does not
          # change that — it feeds the authorizer's Origin allow-list, a
          # different layer. So the SPA calls the relative /porth prefix and
          # this behaviour forwards it to the API, with a CloudFront Function
          # stripping the prefix. Same arrangement as the Style Classifier
          # admin app ("the API base is the relative /porth prefix; CloudFront
          # strips it → the Porth API").
          - PathPattern: /porth/*
            TargetOriginId: PorthApiOrigin
            ViewerProtocolPolicy: https-only
            # CachingDisabled — authenticated API reads and writes.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards the empty Authorization
            # bearer (the authorizer's identity source), cookies and
            # X-CSRF-Token; sends the origin's Host for the API custom domain.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt PorthApiPathStripFunction.FunctionMetadata.FunctionARN
          # PORTH-612 — the sample app's API has to be same-origin for exactly the
          # reason /porth/* is. The session cookie is scoped to the zone, so a call
          # to the raw execute-api host never carries it: the request arrives
          # unauthenticated, the authorizer resolves no session, and the app 401s.
          # Attaching the authorizer alone does not fix that — both halves are
          # required, and either alone still fails.
          #
          # No path-strip function here: the app serves its routes AT /sample
          # (routers use prefix="/sample/ar" and the event path is
          # /sample/{proxy+}), so the prefix is real rather than a routing
          # convenience. Stripping it would 404 every call.
          - PathPattern: /sample/*
            TargetOriginId: SampleApiOrigin
            ViewerProtocolPolicy: https-only
            # CachingDisabled — authenticated, tenant-scoped reads and writes.
            # Caching any of these would serve one tenant's data to another.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards the session cookie and
            # X-CSRF-Token, and sends the origin's Host so API Gateway routes it.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AdminUIBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: PorthApiOrigin
            # PorthApiUrl is "https://host" — index 2 of the "/"-split is the host.
            DomainName: !Select [2, !Split ["/", !Ref PorthApiUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: SampleApiOrigin
            # PORTH-586 — the custom domain rather than the execute-api
            # hostname, so the Host the authorizer sees is stable and the
            # session-policy binding can be keyed on it. DependsOn is implicit
            # through the !Ref, but the API mapping must exist before traffic
            # arrives or the domain answers 404.
            DomainName: !Ref SampleApiDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

  # Strips the /porth prefix the SPA uses for same-origin API calls; the Porth
  # API serves its routes at the root of its custom domain (PORTH-531).
  PorthApiPathStripFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub porth-admin-porth-strip-${Environment}
      AutoPublish: true
      FunctionConfig:
        Comment: Strip the /porth prefix before forwarding to the Porth API origin
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/porth/, '');
          if (request.uri === '') { request.uri = '/'; }
          return request;
        }

Outputs:

  AdminUIBucketName:
    Description: S3 bucket for the React admin SPA
    Value: !Ref AdminUIBucket
    Export:
      Name: !Sub ${AWS::StackName}-AdminUIBucketName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (used for cache invalidation in CI)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDistributionId

  CloudFrontUrl:
    Description: Public URL of the Porth Admin UI
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  SampleApiDomainName:
    Description: >-
      Custom domain the sample app's API answers on. This is the host the
      authorizer matches against context_rules in the session-policy index.
    Value: !Ref SampleApiDomainName
  SampleAppTenantRoleArn:
    Description: >-
      The app's own base role, assumed by Porth's authorizer for requests to
      this app. Named by the session-policy index binding.
    Value: !GetAtt SampleAppTenantRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontUrl

  SampleAppApiUrl:
    Description: >
      Sample app API Gateway URL. The SPA no longer calls this directly — it goes
      through CloudFront at /sample/* so the session cookie is same-origin
      (PORTH-612). Kept for diagnostics and for callers that hold their own token.
    Value: !Sub https://${SampleAppApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub ${AWS::StackName}-SampleAppApiUrl

  FfugFunctionArn:
    Description: ffug Lambda ARN — the ADR-Z11 UAT compute target (PORTH-555)
    Value: !GetAtt FfugFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-FfugFunctionArn

  FfugTableName:
    Description: ffug tenant-keyed DynamoDB table
    Value: !Ref FfugTable
    Export:
      Name: !Sub ${AWS::StackName}-FfugTableName

  PorthUatRunnerRoleArn:
    Description: Role the Components-repo UAT workflow assumes to reach ffug (Q13)
    Value: !GetAtt PorthUatRunnerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PorthUatRunnerRoleArn
