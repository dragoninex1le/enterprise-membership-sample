name: Deploy Admin UI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      run_api_tests:
        description: 'Run API integration tests (wipes all DynamoDB tables before and after — opt-in only)'
        type: boolean
        default: false

# Serialise deploy runs per branch — prevents concurrent cleanup/bootstrap
# steps from racing each other and deleting the platform tenant mid-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  SAM_STACK_NAME: enterprise-membership-sample
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: sample-app-deploy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install Python dependencies
        run: pip install boto3

      - name: Validate required secrets
        run: |
          MISSING=()
          [ -z "${{ vars.ACM_CERTIFICATE_ARN }}" ]            && MISSING+=("ACM_CERTIFICATE_ARN")
          [ -z "${{ secrets.GH_PAT }}" ]                    && MISSING+=("GH_PAT")
          [ -z "${{ vars.AWS_ROLE_ARN }}" ]                && MISSING+=("AWS_ROLE_ARN")
          [ -z "${{ secrets.PLATFORM_AUTH0_DOMAIN }}" ]     && MISSING+=("PLATFORM_AUTH0_DOMAIN")
          [ -z "${{ secrets.PLATFORM_AUTH0_CLIENT_ID }}" ]  && MISSING+=("PLATFORM_AUTH0_CLIENT_ID")
          [ -z "${{ secrets.PORTH_AUTH_TEST_TOKEN }}" ]     && MISSING+=("PORTH_AUTH_TEST_TOKEN")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Porth is deployed
        run: |
          if ! aws cloudformation describe-stacks --stack-name porth-prod >/dev/null 2>&1; then
            echo "❌ porth-prod stack not found in EMS. Run porth-install.yml first."
            exit 1
          fi
          echo "✅ porth-prod present"

      - name: Resolve porth-prod stack outputs
        run: |
          STACK=porth-prod
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          echo "PORTH_API_URL=${{ vars.PORTH_API_URL }}"                                        >> $GITHUB_ENV
          echo "PORTH_TENANTS_TABLE=$(get_output TenantsTableName)"                            >> $GITHUB_ENV
          echo "PORTH_PERMISSIONS_TABLE=$(get_output PermissionsTableName)"                    >> $GITHUB_ENV
          echo "PORTH_ROLES_TABLE=$(get_output RolesTableName)"                                >> $GITHUB_ENV
          echo "PORTH_CLAIM_MAPPING_CONFIGS_TABLE=$(get_output ClaimMappingConfigsTableName)"  >> $GITHUB_ENV
          echo "PORTH_AUTHORIZER_ARN=$(get_output AuthorizerFunctionArn)"                      >> $GITHUB_ENV

      - name: Resolve sample app stack outputs
        run: |
          STACK=${{ env.SAM_STACK_NAME }}
          SAMPLE_API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SampleAppApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "SAMPLE_APP_API_URL=${SAMPLE_API_URL}" >> $GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.PORTH_API_URL }}
          VITE_SAMPLE_APP_API_URL: ${{ env.SAMPLE_APP_API_URL }}
          VITE_PLATFORM_APEX: porth-sample

      # ── Step 1: SAM build + deploy ───────────────────────────────────────────
      - name: SAM build
        run: sam build

      - name: SAM deploy (infrastructure)
        run: |
          PARAM_OVERRIDES=(
            "Environment=dev"
            "PorthApiUrl=${{ env.PORTH_API_URL }}"
            "AcmCertificateArn=${{ vars.ACM_CERTIFICATE_ARN }}"
            "PorthEnvironment=dev"
          )
          # Only pass PorthAuthorizerArn when non-empty — SAM CLI rejects blank Key= values
          if [ -n "${{ env.PORTH_AUTHORIZER_ARN }}" ]; then
            PARAM_OVERRIDES+=("PorthAuthorizerArn=${{ env.PORTH_AUTHORIZER_ARN }}")
          fi
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --parameter-overrides "${PARAM_OVERRIDES[@]}" \
            --no-fail-on-empty-changeset

      - name: Resolve stack outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='AdminUIBucketName'].OutputValue" \
            --output text)
          CF_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "cf_id=$CF_ID"   >> $GITHUB_OUTPUT

      # ── Step 2: Sync frontend assets to S3 + invalidate CDN ─────────────────────
      # Done immediately after infrastructure deploy so the live site is always
      # up-to-date even if the bootstrap/test steps below fail.
      - name: Sync assets to S3
        run: |
          aws s3 sync frontend/dist s3://${{ steps.outputs.outputs.bucket }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/index.html \
            s3://${{ steps.outputs.outputs.bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.cf_id }} \
            --paths "/*"


