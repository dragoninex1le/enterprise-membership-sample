name: Deploy Admin UI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise deploy runs per branch so concurrent runs don't race on the
# shared sample-app stack.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  SAM_STACK_NAME: enterprise-membership-sample
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: sample-app-deploy
    env:
      # Porth components CloudFormation stack name. A SAR *console* install
      # names the stack serverlessrepo-<app-name>. Override by setting the
      # PORTH_STACK_NAME variable in the sample-app-deploy environment.
      PORTH_STACK_NAME: ${{ vars.PORTH_STACK_NAME || 'serverlessrepo-porth-components' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install Python dependencies
        run: pip install boto3

      - name: Validate required config
        run: |
          MISSING=()
          [ -z "${{ vars.ACM_CERTIFICATE_ARN }}" ] && MISSING+=("ACM_CERTIFICATE_ARN (env var)")
          # PORTH-540: the GH_PAT check is gone. It was never used by this workflow, and its
          # only consumer anywhere in the repo was bootstrap.yml's `pip install git+https://…`,
          # which is deleted. Requiring a secret nothing reads just blocks deploys.
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required config: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required config present"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Which role this actually ran as. Cheap, and it settles a question that
      # otherwise needs repo settings to answer: AWS_ROLE_ARN is an environment
      # variable, so the workflow file alone cannot tell you. Worth recording on
      # every run — several failures this week were a DEPLOYED role having
      # drifted from the template it was supposed to match, and the first
      # question each time was "which role is this?".
      - name: Caller identity
        run: aws sts get-caller-identity

      - name: Verify Porth components are deployed in EMS (pre-check)
        run: |
          echo "Looking for the Porth components stack: $PORTH_STACK_NAME"
          set +e
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$PORTH_STACK_NAME" \
            --query "Stacks[0].StackStatus" --output text 2>&1)
          DESCRIBE_RC=$?
          set -e
          if [ "$DESCRIBE_RC" -ne 0 ]; then
            echo "❌ Could not find the Porth stack '$PORTH_STACK_NAME'. AWS said:"
            echo "$STACK_STATUS"
            echo ""
            echo "Porth-related stacks that DO exist in this account:"
            aws cloudformation list-stacks \
              --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE IMPORT_COMPLETE \
              --query "StackSummaries[?contains(StackName, 'porth') || contains(StackName, 'serverlessrepo')].StackName" \
              --output text || true
            echo ""
            echo "If the name differs, set the PORTH_STACK_NAME variable in the"
            echo "sample-app-deploy environment to the correct stack name."
            exit 1
          fi
          if [[ "$STACK_STATUS" != "CREATE_COMPLETE" && "$STACK_STATUS" != "UPDATE_COMPLETE" ]]; then
            echo "❌ Porth stack '$PORTH_STACK_NAME' is in state $STACK_STATUS — not safe to deploy against it"
            exit 1
          fi
          echo "✅ Porth components present and healthy ($PORTH_STACK_NAME — $STACK_STATUS)"

      - name: Resolve Porth stack outputs (EMS)
        run: |
          STACK="$PORTH_STACK_NAME"
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          PORTH_API_URL=$(get_output PorthApiUrl)
          if [ -z "$PORTH_API_URL" ] || [ "$PORTH_API_URL" == "None" ]; then
            echo "❌ Could not resolve PorthApiUrl from the $STACK stack outputs"
            exit 1
          fi
          echo "PORTH_API_URL=$PORTH_API_URL" >> $GITHUB_ENV
          echo "✅ Resolved PORTH_API_URL=$PORTH_API_URL"

          # PORTH-612: the sample app's API is authorized by Porth's authorizer.
          PORTH_AUTHORIZER_ARN=$(get_output AuthorizerFunctionArn)
          if [ -z "$PORTH_AUTHORIZER_ARN" ] || [ "$PORTH_AUTHORIZER_ARN" == "None" ]; then
            echo "❌ Could not resolve AuthorizerFunctionArn from the $STACK stack outputs."
            echo "❌ Without it the sample app's API would deploy with no authorizer,"
            echo "❌ and every one of its routes would 401 before any permission check."
            exit 1
          fi
          echo "PORTH_AUTHORIZER_ARN=$PORTH_AUTHORIZER_ARN" >> $GITHUB_ENV
          echo "✅ Resolved PORTH_AUTHORIZER_ARN=$PORTH_AUTHORIZER_ARN"

          # PORTH-587 — what ffug needs from the install, read from the install
          # rather than assumed here.
          #
          # Environment and FixedEnvironment are two different axes wearing one
          # word, and on this install they hold DIFFERENT VALUES (dev / prod).
          # Environment addresses configuration — SSM document paths, the event
          # bus name, the context key alias. FixedEnvironment addresses data —
          # the ENV#{slot}# prefix on every partition key, and the value an
          # inbound context envelope is checked against.
          #
          # Swapping them produces a service that reads configuration which does
          # not exist, or writes keys nothing can read. Both are silent, which is
          # why these are resolved and hard-failed rather than defaulted.
          get_param() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Parameters[?ParameterKey=='$1'].ParameterValue" \
              --output text
          }
          PORTH_BRANCH=$(get_param Environment)
          PORTH_ENV_SLOT=$(get_param FixedEnvironment)
          PORTH_EVENT_BUS=$(get_output EventBusName)

          MISSING=()
          [ -z "$PORTH_BRANCH" ] || [ "$PORTH_BRANCH" == "None" ] && MISSING+=("Environment (stack parameter)")
          [ -z "$PORTH_ENV_SLOT" ] || [ "$PORTH_ENV_SLOT" == "None" ] && MISSING+=("FixedEnvironment (stack parameter)")
          [ -z "$PORTH_EVENT_BUS" ] || [ "$PORTH_EVENT_BUS" == "None" ] && MISSING+=("EventBusName (stack output)")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Could not resolve from $STACK: ${MISSING[*]}"
            echo "❌ ffug would deploy pointed at the wrong environment axis or the"
            echo "❌ wrong event bus, and both failures are silent — no tenant is"
            echo "❌ ever provisioned and nothing reports why."
            exit 1
          fi

          echo "PORTH_BRANCH=$PORTH_BRANCH" >> $GITHUB_ENV
          echo "PORTH_ENV_SLOT=$PORTH_ENV_SLOT" >> $GITHUB_ENV
          echo "PORTH_EVENT_BUS=$PORTH_EVENT_BUS" >> $GITHUB_ENV
          echo "✅ Porth branch (config axis) = $PORTH_BRANCH"
          echo "✅ Porth slot   (data axis)   = $PORTH_ENV_SLOT"
          echo "✅ Porth event bus            = $PORTH_EVENT_BUS"

      # ── The app's own permissions (PORTH-610) ────────────────────────────────
      # These belong here, not in the Porth install. Porth owns the
      # porth-platform and porth-tenant namespaces; anything this app enforces
      # is this app's to register, from this app's deploy.
      #
      # That boundary is not a preference. PORTH-609 was a Porth install
      # deleting these very permissions, and the reason nothing put them back is
      # that nothing owned them — they had only ever been created by hand. The
      # app's pages then 403 while Porth's logs stay clean, because Porth
      # allowed every request it saw and these routes never reach it.
      #
      # Converging and additive: registers what is missing, unions the grants,
      # writes nothing on a second run, and removes nothing ever.
      - name: Seed the app's own Porth permissions
        run: |
          set -euo pipefail

          STACK="$PORTH_STACK_NAME"
          get_output() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text 2>/dev/null || echo ""
          }

          export PORTH_PERMISSIONS_TABLE=$(get_output PermissionsTableName)
          export PORTH_ROLES_TABLE=$(get_output RolesTableName)
          export PORTH_TENANTS_TABLE=$(get_output TenantsTableName)
          export PORTH_ENV_SCOPE="${{ vars.PORTH_ENV_SCOPE || 'prod' }}"

          if [ -z "$PORTH_PERMISSIONS_TABLE" ] || [ "$PORTH_PERMISSIONS_TABLE" = "None" ]; then
            echo "::error::could not resolve Porth table names from $STACK."
            echo "::error::The app's permissions cannot be registered, so its"
            echo "::error::pages will 403 with nothing in Porth's logs."
            exit 1
          fi

          python -m pip install --quiet boto3
          python scripts/seed_app_permissions.py

      - name: Resolve sample app stack outputs
        run: |
          STACK=${{ env.SAM_STACK_NAME }}
          SAMPLE_API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SampleAppApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "SAMPLE_APP_API_URL=${SAMPLE_API_URL}" >> $GITHUB_ENV

      # @estyn/porth-admin (the BFF auth SDK, PORTH-531) is served from the Porth
      # CodeArtifact npm repo in the Components account, not the public registry.
      # frontend/.npmrc points the @estyn scope there and reads the token from this
      # env var. Same pattern as the Style Classifier admin build.
      - name: Authenticate npm to CodeArtifact (porth-npm for @estyn/porth-admin)
        run: |
          set -euo pipefail
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain porth --domain-owner 084847995635 \
            --query authorizationToken --output text --region "$AWS_REGION")
          echo "::add-mask::${TOKEN}"
          echo "CODEARTIFACT_AUTH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        # npm install rather than ci: @estyn/porth-admin is a new dependency and is
        # not yet in package-lock.json, which `npm ci` refuses to reconcile. Revert
        # to `npm ci` once the lockfile is regenerated against CodeArtifact.
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # PORTH-531: the SPA calls the Porth API same-origin under the /porth
          # prefix (a CloudFront behaviour strips it — see template.yml). The
          # absolute PorthApiUrl must NOT be baked into the bundle: a
          # credentialed cross-origin call cannot pass Porth's preflight
          # (ACAO * without credentials, no X-CSRF-Token in the allow-list).
          # PORTH_API_URL is still resolved above — SAM needs it as the
          # CloudFront origin.
          VITE_API_BASE_URL: /porth
          # PORTH-612 — empty ON PURPOSE, and it must stay a set-but-empty value
          # rather than being removed. sampleApp.ts reads
          #   VITE_SAMPLE_APP_API_URL ?? VITE_API_BASE_URL
          # so deleting this line falls back to /porth and every sample call would
          # be prefixed onto the Porth API. Empty means the SPA calls /sample/*
          # on its own origin, which CloudFront routes to the app's API — the only
          # arrangement where the zone-scoped session cookie is actually sent.
          VITE_SAMPLE_APP_API_URL: ''
          VITE_PLATFORM_APEX: porth-sample

      # ffug is a test fixture for ADR-Z11 (PORTH-555) — its own suite gates the
      # deploy that ships it. Scoped to ffug deliberately: this workflow had no
      # Python test step before, and widening it is a separate change.
      # PORTH-613 — the sample app now depends on porth-common, which lives in
      # the Porth CodeArtifact repo and not on PyPI. `sam build` shells out to
      # pip, so pip needs the index BEFORE the build, not after.
      #
      # The token fetched earlier is npm's (frontend/.npmrc reads
      # CODEARTIFACT_AUTH_TOKEN for @estyn/porth-admin) and does nothing for pip.
      # Without this step the build fails on:
      #
      #   ERROR: Could not find a version that satisfies the requirement porth-common
      #
      # which reads as a bad version pin rather than an unconfigured index.
      #
      # `login --tool pip` sets a global index-url, so the rest of the build
      # resolves through the same repository. That is safe because porth-py
      # proxies PyPI — fastapi, mangum and boto3 come through it too, as they
      # already do for every porth-install run.
      - name: Configure pip for CodeArtifact (porth-common)
        run: |
          set -euo pipefail
          aws codeartifact login --tool pip \
            --domain porth --domain-owner 084847995635 \
            --repository porth-py --region "$AWS_REGION"

      # PORTH-612 — sample_app/tests too, not just ffug. Those tests assert the
      # things this deploy is otherwise free to break silently: that the app's API
      # is behind the Porth authorizer and same-origin, and that the permissions
      # the seeder registers are the ones the routers enforce. Both failures are
      # invisible from Porth's side, so CI is the only place they surface early.
      - name: Run unit tests (ADR-Z11 PORTH-555, PORTH-612)
        working-directory: lambdas
        run: |
          set -euo pipefail
          # requirements.txt, not a curated list. This installed a hand-listed
          # `pytest boto3 pyyaml` back when it ran only ffug/tests, which needed
          # nothing else — and adding sample_app/tests broke CI on the first push
          # with `ModuleNotFoundError: No module named 'starlette'`, because those
          # tests import FastAPI and porth_common. A curated list is a second
          # statement of requirements.txt and drifts the moment the app gains a
          # dependency; this way the tests run against the same set the Lambda
          # will. porth-common is in it, which is why the CodeArtifact login now
          # comes first (PORTH-614).
          python -m pip install --quiet -r requirements.txt pytest pyyaml
          python -m pytest ffug/tests sample_app/tests -q

      # ── SAM build + deploy ───────────────────────────────────────────────────────────────

      - name: SAM build
        run: sam build

      - name: Clean up stacks stuck in a non-recoverable state
        run: |
          # A stack left in REVIEW_IN_PROGRESS (failed --resolve-s3) or
          # ROLLBACK_COMPLETE / *_FAILED (failed initial CREATE) cannot be
          # updated — it must be deleted before it can be recreated cleanly.
          for STACK in aws-sam-cli-managed-default "$SAM_STACK_NAME"; do
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NONE")
            echo "$STACK state: $STATUS"
            case "$STATUS" in
              REVIEW_IN_PROGRESS|ROLLBACK_COMPLETE|CREATE_FAILED|ROLLBACK_FAILED|DELETE_FAILED)
                echo "  Deleting $STACK (state $STATUS) so it can be recreated cleanly..."
                aws cloudformation delete-stack --stack-name "$STACK"
                aws cloudformation wait stack-delete-complete --stack-name "$STACK" || true
                echo "  Deleted."
                ;;
              *)
                echo "  No cleanup needed."
                ;;
            esac
          done

      - name: SAM deploy (infrastructure)
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --s3-prefix ${{ env.SAM_STACK_NAME }} \
            --parameter-overrides \
              Environment=dev \
              PorthApiUrl=${{ env.PORTH_API_URL }} \
              PorthAuthorizerFunctionArn=${{ env.PORTH_AUTHORIZER_ARN }} \
              AcmCertificateArn=${{ vars.ACM_CERTIFICATE_ARN }} \
              CloudFrontAlias='*.porth-sample.ems.estynsoftware.cloud' \
              CloudFrontApexAlias='porth-sample.ems.estynsoftware.cloud' \
              PorthEnvironment=dev \
              PorthBranch=${{ env.PORTH_BRANCH }} \
              PorthEnvironmentSlot=${{ env.PORTH_ENV_SLOT }} \
              PorthEventBusName=${{ env.PORTH_EVENT_BUS }} \
              PorthContextSigningKeyArn=/porth/${{ env.PORTH_BRANCH }}/infra/context-signing-key-arn \
            --no-fail-on-empty-changeset

      - name: Diagnose SAM managed-bucket failure
        if: failure()
        run: |
          echo "=== aws-sam-cli-managed-default stack status ==="
          aws cloudformation describe-stacks --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].StackStatus" --output text 2>&1 || echo "(stack not found)"
          echo ""
          echo "=== failed resource events ==="
          aws cloudformation describe-stack-events --stack-name aws-sam-cli-managed-default \
            --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output text 2>&1 || echo "(no events)"
          echo ""
          echo "=== change sets ==="
          aws cloudformation list-change-sets --stack-name aws-sam-cli-managed-default \
            --query 'Summaries[].[ChangeSetName,Status,StatusReason]' --output text 2>&1 || echo "(no change sets)"

      - name: Capture CloudFront distribution outputs
        if: success()
        run: |
          set -euo pipefail
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          CF_DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "CloudFront domain: $CF_DOMAIN"
          echo "CloudFront distribution ID: $CF_DIST_ID"
          {
            echo "## CloudFront Distribution"
            echo "- **Domain:** $CF_DOMAIN"
            echo "- **Distribution ID:** $CF_DIST_ID"
            echo "- **Alias record needed:** porth-sample.ems.estynsoftware.cloud → $CF_DOMAIN"
            echo "- **CloudFront Hosted Zone ID for Alias:** Z2FDTNDATAQYW2"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upsert Route 53 alias for CloudFront (apex)
        # Creates/updates porth-sample.ems.estynsoftware.cloud → CloudFront
        # distribution on every deploy so the alias is always current even if
        # the distribution is recreated. Requires route53:ListHostedZonesByName,
        # route53:ChangeResourceRecordSets, route53:GetChange on sample-app-deploy-role.
        run: |
          set -euo pipefail
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text | sed 's|https://||')
          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "ems.estynsoftware.cloud." \
            --query "HostedZones[0].Id" \
            --output text | sed 's|/hostedzone/||')
          echo "Upserting: porth-sample.ems.estynsoftware.cloud → $CF_DOMAIN (HZ $HOSTED_ZONE_ID)"
          aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch "{
              \"Changes\": [{
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"porth-sample.ems.estynsoftware.cloud\",
                  \"Type\": \"A\",
                  \"AliasTarget\": {
                    \"HostedZoneId\": \"Z2FDTNDATAQYW2\",
                    \"DNSName\": \"$CF_DOMAIN\",
                    \"EvaluateTargetHealth\": false
                  }
                }
              }]
            }"
          echo "✅ Route 53 alias upserted: porth-sample.ems.estynsoftware.cloud → $CF_DOMAIN"

      - name: Resolve stack outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='AdminUIBucketName'].OutputValue" \
            --output text)
          CF_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "cf_id=$CF_ID"   >> $GITHUB_OUTPUT

      # ── Sync frontend assets to S3 + invalidate CDN ────────────────────────────
      - name: Sync assets to S3
        run: |
          aws s3 sync frontend/dist s3://${{ steps.outputs.outputs.bucket }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/index.html \
            s3://${{ steps.outputs.outputs.bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.cf_id }} \
            --paths "/*"
