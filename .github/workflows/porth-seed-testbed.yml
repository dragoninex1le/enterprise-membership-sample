name: Porth — seed testbed tenants

# Refills the Porth tables with the deterministic synthetic tenants that BOTH the Tier 2 e2e
# suite and the PORTH-494 security lab run against — one manifest, so the two cannot drift.
#
# The workflow holds NO testbed configuration. The manifest lives in SSM at
# /porth/config/testbed and is read by the Lambda in-account; this job passes only the
# environment slot. That keeps the testbed's configuration in the account it configures —
# versioned and audited by SSM — rather than in a public repo's variables, where it is
# neither, and where GitHub masks only exact registered secret values anyway.
#
# Test-tenant passwords are in Secrets Manager, referenced from the manifest by name. The
# seeder only calls DescribeSecret and is structurally incapable of reading a value.
#
# Order of operations:
#   reset-env  →  porth-seed-testbed  →  Tier 2 e2e / PORTH-494
#
# Tier 2 creates its own `demo-tenant` / `Demo Corp` in beforeAll and tolerates a 409. The
# seeder refuses those names, and any name CONTAINING them: the test finds its row with
# getByRole('row').filter({hasText}).first() — a substring match in DOM order — and the next
# action writes IdP config onto whatever row matched.
#
# Requires the porth-qa-tools stack (Actions → Deploy Porth QA Tools).

on:
  workflow_dispatch:
    inputs:
      env_scope:
        description: >
          ADR-Z8 slot to seed under (ENV#{scope}#…). Must match the Porth install's
          FixedEnvironment or the authorizer will never resolve these tenants.
        required: false
        default: 'prod'
      dry_run:
        description: 'Validate the manifest and report the plan without writing anything'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: porth-seed-testbed
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  QA_STACK: porth-qa-tools
  MANIFEST_PARAM: /porth/config/testbed
  ENV_SCOPE: ${{ inputs.env_scope || 'prod' }}
  DRY_RUN: ${{ inputs.dry_run || false }}

jobs:
  seed:
    name: Seed testbed tenants
    runs-on: ubuntu-latest
    # Its own environment, so its role's OIDC `sub` pins it here. That role can invoke the
    # seed Lambda and read the manifest — it cannot delete stacks or read credentials.
    environment: porth-seed

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Read-only pre-check, so a missing or malformed manifest names the SSM parameter to fix
      # rather than surfacing as a Lambda error. What it prints is non-secret by construction —
      # the manifest carries `password_secret` names, never values.
      - name: Show the manifest
        run: |
          set -euo pipefail
          # --with-decryption so the parameter works as String or SecureString. Without it a
          # SecureString returns KMS ciphertext and the JSON parse fails on something that
          # looks nothing like the real problem.
          MANIFEST=$(aws ssm get-parameter --name "$MANIFEST_PARAM" --with-decryption \
            --query Parameter.Value --output text --region "$AWS_REGION" 2>/dev/null || echo "")

          if [ -z "$MANIFEST" ]; then
            echo "::error::$MANIFEST_PARAM does not exist. The tenant manifest lives in SSM,"
            echo "::error::not in this repo. Create it with:"
            echo "::error::  aws ssm put-parameter --name $MANIFEST_PARAM --type SecureString --value file://manifest.json"
            exit 1
          fi

          MANIFEST="$MANIFEST" python3 - <<'PY'
          import json, os, sys

          param = os.environ["MANIFEST_PARAM"]
          try:
              manifest = json.loads(os.environ["MANIFEST"])
          except json.JSONDecodeError as e:
              print(f"::error::{param} is not valid JSON: {e}")
              sys.exit(1)

          tenants = manifest.get("tenants") if isinstance(manifest, dict) else manifest
          if not isinstance(tenants, list) or not tenants:
              print(f"::error::{param} must be an object with a non-empty 'tenants' array")
              sys.exit(1)

          # Match on the KEY, never the value — the SSM path conventionally ends in
          # `/password`, so a substring scan of the serialised manifest would reject every
          # correct manifest.
          def credential_keys(node, path="manifest"):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if "password" in key.lower() and key != "password_secret":
                          yield f"{path}.{key}"
                      yield from credential_keys(value, f"{path}.{key}")
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      yield from credential_keys(value, f"{path}[{i}]")

          offenders = list(credential_keys(manifest))
          if offenders:
              print(f"::error::{param} has credential fields that should be password_secret:")
              for field in offenders:
                  print(f"::error::  {field}")
              print("::error::password_secret is a Secrets Manager NAME, not a path or a value —")
              print("::error::e.g. porth/testbed/tenants/acme/password, with no leading slash")
              print("::error::(the IAM grant matches secret:porth/testbed/*).")
              sys.exit(1)

          platform = manifest.get("platform") if isinstance(manifest, dict) else None
          if platform:
              print(f"  platform — {platform.get('admin', {}).get('email', '<no email>')}")

          for t in tenants:
              flag = " [reserved_for_e2e]" if t.get("reserved_for_e2e") else ""
              issuer = (t.get("idp") or {}).get("issuer", "<no idp>")
              print(f"  {t.get('tenant_id', '<missing>')}{flag} — issuer={issuer}")
          print(f"{len(tenants)} tenant(s) in {param}")
          PY

      - name: Resolve the seed function
        run: |
          set -euo pipefail
          SEED_FN=$(aws cloudformation describe-stacks \
            --stack-name "$QA_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='QaSeedFunctionArn'].OutputValue | [0]" \
            --output text --region "$AWS_REGION" 2>/dev/null || echo "")

          if [ -z "$SEED_FN" ] || [ "$SEED_FN" = "None" ]; then
            echo "::error::No QaSeedFunction in stack '$QA_STACK'. Deploy it first:"
            echo "::error::  Actions → Deploy Porth QA Tools"
            exit 1
          fi
          echo "SEED_FN=$SEED_FN" >> "$GITHUB_ENV"

      - name: Seed
        run: |
          set -euo pipefail
          # Only the slot and the dry-run flag. The Lambda reads the manifest itself.
          PAYLOAD=$(python3 -c '
          import json, os
          print(json.dumps({
              "env_scope": os.environ["ENV_SCOPE"],
              "dry_run": os.environ["DRY_RUN"].lower() == "true",
          }))')

          aws lambda invoke \
            --function-name "$SEED_FN" \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            --region "$AWS_REGION" \
            /tmp/seed-response.json > /tmp/seed-meta.json

          if grep -q '"FunctionError"' /tmp/seed-meta.json; then
            echo "::error::QaSeedFunction raised an unhandled error"
            cat /tmp/seed-response.json
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          envelope = json.load(open("/tmp/seed-response.json"))
          status = envelope.get("statusCode", 500)
          body = json.loads(envelope.get("body", "{}"))

          if status not in (200, 207):
              print(f"::error::Seeding failed ({status}): {body.get('error', body)}")
              for detail in body.get("details", []):
                  print(f"::error::  {detail}")
              sys.exit(1)

          lines = ["## Testbed seeded", "",
                   f"- **Env scope:** `{body['env_scope']}` (records at `ENV#{body['env_scope']}#…`)",
                   f"- **Dry run:** {body['dry_run']}", "",
                   "| Tenant | Status | Porth org | Role |", "|---|---|---|---|"]

          failed = False
          for r in body["results"]:
              lines.append(
                  f"| `{r['tenant_id']}` | {r['status']} | "
                  f"`{r.get('porth_org_uuid', '—')}` | `{r.get('role_id', '—')}` |"
              )
              for w in r.get("warnings", []):
                  print(f"::warning::{r['tenant_id']}: {w}")
              if r["status"] == "error":
                  print(f"::error::{r['tenant_id']}: {r.get('error')}")
                  failed = True

          lines += ["", "Resolved set published to SSM `/porth/testbed/tenants` — the",
                    "PORTH-494 config is generated from it, not hand-maintained."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")

          print("\n".join(lines))
          sys.exit(1 if failed else 0)
          PY

      - name: Next steps
        if: success()
        run: |
          {
            echo ""
            echo "Next: Tier 2 E2E (**E2E Tests** → run workflow) or the PORTH-494 lab."
            echo "Tier 2 creates its own \`demo-tenant\` — the seeder leaves that slot alone."
          } >> "$GITHUB_STEP_SUMMARY"
