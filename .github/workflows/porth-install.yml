name: Porth components — install + upgrade

# PORTH-471 — Pipeline 1. PORTH-530 — SAR 0.1.16 + ADR-Z9 BFF wiring.
# PORTH-582 — upgraded to SAR 0.2.0 (container-image Porth).
#
# Installs or upgrades the Porth components stack (serverlessrepo-porth-components) in the EMS
# account by consuming the porth-user-management SAR application, then
# bootstraps the reserved 'platform' tenant and patches its IdP config.
#
# Two-step SAR consume (PORTH-459 pattern): render the SAR template, then
# `cloudformation create-change-set --role-arn <porth-cfn-execution-role>` so
# CloudFormation performs every resource operation as the dedicated execution
# role. porth-install-role only orchestrates — it calls the CFN/SAR APIs.
#
# GitHubRepoOwner is intentionally NOT passed, so the SAR template's
# CreateDeployRole condition stays false — no porth-deploy-role is created
# and no GitHub OIDC provider is required in the EMS account
# (PORTH-471 decision, 2026-05-19).
#
# A change-set inspection step aborts before execute if the change set would
# Remove or Replace any DynamoDB table (ADR-Z1/Z2 — DDB safety).
#
# PORTH-530 — environment model: EMS is a SINGLE-environment instance (no slots), so
# FixedEnvironment=prod. This turns on the ADR-Z8 `ENV#prod#` partition-key prefix
# for all Porth data.
#
# PORTH-557 (SAR 0.2.0): the EnvironmentMode parameter is GONE. A non-empty
# FixedEnvironment *is* single mode; empty is multi. The two can no longer
# disagree, so the deploy-time Rule that policed the pair went with it.
#
# PORTH-530 — required vars/secrets (GitHub environment: porth-install):
#   vars.AWS_ROLE_ARN                 OIDC role to assume
#   vars.AWS_CFN_EXECUTION_ROLE_ARN   (optional) CFN execution role
#   vars.DNS_ZONE                     e.g. ems.estynsoftware.cloud — cookie-domain derivation
#   vars.API_DOMAIN_NAME              (or legacy vars.PORTH_API_DOMAIN_NAME)
#   vars.PORTH_SPA_ORIGINS            CSV of SPA origins, e.g. https://app.ems.estynsoftware.cloud
#   secrets.ACM_CERTIFICATE_ARN       cert for the custom domain (us-east-1)
#   secrets.PORTH_AUTH_TEST_TOKEN     (optional) authorizer test-token bypass
#
# Everything above describes the STACK's shape. Identity configuration is not here — it lives
# in SSM at /porth/config/testbed under `platform.idp`, in the account it authenticates
# against (PORTH-530). PLATFORM_AUTH0_DOMAIN / _CLIENT_ID / _AUDIENCE and PORTH_TENANT_CONFIG
# are no longer read by this workflow and can be deleted from the repo's secrets.
#
on:
  workflow_dispatch:
    inputs:
      sar_version:
        description: 'Porth SAR app semantic version to install/upgrade to'
        required: true
        default: '0.2.0'
      stack_name:
        description: 'CloudFormation stack name in EMS'
        required: false
        default: 'serverlessrepo-porth-components'
      sar_app_id:
        description: 'Porth SAR application ARN'
        required: false
        default: 'arn:aws:serverlessrepo:us-east-1:084847995635:applications/porth-user-management'
      environment_name:
        description: 'Porth Environment parameter (drives the DynamoDB table name suffix)'
        required: false
        default: 'dev'
      fixed_environment:
        description: 'ADR-Z8 environment slot this install is pinned to. Non-empty = single-environment mode.'
        required: false
        default: 'prod'
      api_domain_name:
        description: 'API Gateway custom domain FQDN. Blank = use the vars value.'
        required: false
        default: ''
      acm_certificate_arn:
        description: 'ACM certificate ARN for the custom domain. Blank = use the secret.'
        required: false
        default: ''
      adopt_existing_resources:
        description: 'CREATE only: adopt pre-existing retained resources (the 8 Porth tables) into the new stack instead of failing on their names. Needed after a stack deletion.'
        required: false
        type: boolean
        default: false
      allow_stack_delete:
        description: 'Permit deleting a failed stack before recreating it. Retained tables/KMS keys SURVIVE and will block the recreate — read the pre-flight error first.'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: porth-install-${{ inputs.stack_name || 'serverlessrepo-porth-components' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  install-or-upgrade:
    name: Install or upgrade Porth ${{ inputs.sar_version || '0.2.0' }}
    runs-on: ubuntu-latest
    environment: porth-install
    timeout-minutes: 30
    # Passed to the bootstrap job, which runs under its own role on a fresh runner and so
    # cannot see anything this job put in GITHUB_ENV.
    outputs:
      env_scope: ${{ steps.tables.outputs.env_scope }}
      tenants_table: ${{ steps.tables.outputs.tenants_table }}
      permissions_table: ${{ steps.tables.outputs.permissions_table }}
      roles_table: ${{ steps.tables.outputs.roles_table }}
      claim_mapping_table: ${{ steps.tables.outputs.claim_mapping_table }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install boto3

      # Resolves workflow_dispatch inputs with hard-coded defaults so this job
      # also works when triggered by the push shim (inputs are empty on push).
      - name: Resolve effective inputs
        run: |
          echo "EFF_SAR_VERSION=${{ inputs.sar_version || '0.2.0' }}" >> "$GITHUB_ENV"
          echo "EFF_STACK_NAME=${{ inputs.stack_name || 'serverlessrepo-porth-components' }}" >> "$GITHUB_ENV"
          echo "EFF_SAR_APP_ID=${{ inputs.sar_app_id || 'arn:aws:serverlessrepo:us-east-1:084847995635:applications/porth-user-management' }}" >> "$GITHUB_ENV"
          echo "EFF_ENV_NAME=${{ inputs.environment_name || 'dev' }}" >> "$GITHUB_ENV"
          echo "EFF_FIXED_ENV=${{ inputs.fixed_environment || 'prod' }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Caller identity
        run: aws sts get-caller-identity

      # Precondition: verify the SAR app is accessible (Org-scoped share).
      # A 403/404 here means the share is missing — escalate to the Porth team
      # rather than debugging a confusing template-render failure later.
      - name: Verify SAR app is accessible (Org-scoped share)
        run: |
          set -euo pipefail
          echo "Checking SAR app accessibility: ${{ env.EFF_SAR_APP_ID }}"
          aws serverlessrepo get-application \
            --application-id "${{ env.EFF_SAR_APP_ID }}" \
            --query '{Name:Name,Author:Author,Version:Version.SemanticVersion}' \
            --output json
          echo "✅ SAR app is accessible"

      - name: Validate inputs and resolve domain parameters
        env:
          ACM_SECRET: ${{ secrets.ACM_CERTIFICATE_ARN }}
          ACM_LEGACY_VAR: ${{ vars.ACM_CERTIFICATE_ARN }}
          API_DOMAIN_VAR: ${{ vars.API_DOMAIN_NAME }}
          API_DOMAIN_LEGACY_VAR: ${{ vars.PORTH_API_DOMAIN_NAME }}
          DNS_ZONE_VAR: ${{ vars.DNS_ZONE }}
          SPA_ORIGINS_VAR: ${{ vars.PORTH_SPA_ORIGINS }}
        run: |
          set -euo pipefail
          APP_ARN="${{ env.EFF_SAR_APP_ID }}"
          if [[ ! "$APP_ARN" =~ ^arn:aws:serverlessrepo:[a-z0-9-]+:[0-9]+:applications/[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid sar_app_id: $APP_ARN"
            exit 1
          fi

          # Custom domain: dispatch input wins, then the canonical var, then the legacy name.
          DOMAIN="${{ inputs.api_domain_name }}"
          [ -z "$DOMAIN" ] && DOMAIN="${API_DOMAIN_VAR:-}" || true
          [ -z "$DOMAIN" ] && DOMAIN="${API_DOMAIN_LEGACY_VAR:-}" || true

          # ACM: dispatch input wins, then the secret (canonical), then the legacy var.
          CERT="${{ inputs.acm_certificate_arn }}"
          [ -z "$CERT" ] && CERT="${ACM_SECRET:-}" || true
          [ -z "$CERT" ] && CERT="${ACM_LEGACY_VAR:-}" || true

          if [ -n "$DOMAIN" ] && [ -z "$CERT" ]; then
            echo "::error::api_domain_name '$DOMAIN' is set but no ACM certificate ARN was provided"
            exit 1
          fi

          echo "PORTH_DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          echo "PORTH_CERT=$CERT" >> "$GITHUB_ENV"
          echo "PORTH_DNS_ZONE=${DNS_ZONE_VAR%.}" >> "$GITHUB_ENV"
          echo "PORTH_SPA_ORIGINS_RAW=${SPA_ORIGINS_VAR:-}" >> "$GITHUB_ENV"

          echo "Resolved domain:      '${DOMAIN:-<execute-api default>}'"
          echo "Resolved DNS zone:    '${DNS_ZONE_VAR%.}'"
          echo "Resolved SPA origins: '${SPA_ORIGINS_VAR:-<unset — authorizer origin gate disabled>}'"
          if [ -z "${SPA_ORIGINS_VAR:-}" ]; then
            echo "::warning::PORTH_SPA_ORIGINS is empty — the cookie path's CSRF/Origin gate will be OFF"
          fi

      - name: Pre-flight stack-state check
        id: preflight
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
          ALLOW_STACK_DELETE: ${{ inputs.allow_stack_delete }}
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Pre-flight stack status: $STATUS"

          # Robust delete: plain delete first; if it lands in DELETE_FAILED
          # (resources that can't be deleted — common after a ROLLBACK_FAILED),
          # retry retaining the stuck resources so the stack can be removed.
          robust_delete() {
            local s="$1"
            aws cloudformation delete-stack --stack-name "$s"
            if ! aws cloudformation wait stack-delete-complete --stack-name "$s" 2>/dev/null; then
              echo "::warning::Plain delete did not complete — retrying with --retain-resources"
              local stuck
              stuck=$(aws cloudformation list-stack-resources --stack-name "$s" \
                --query "StackResourceSummaries[?ResourceStatus=='DELETE_FAILED'].LogicalResourceId" \
                --output text 2>/dev/null || true)
              echo "Retaining stuck resources: ${stuck:-none}"
              if [ -n "$stuck" ]; then
                aws cloudformation delete-stack --stack-name "$s" --retain-resources $stuck
              else
                aws cloudformation delete-stack --stack-name "$s"
              fi
              aws cloudformation wait stack-delete-complete --stack-name "$s"
            fi
          }

          case "$STATUS" in
            DOES_NOT_EXIST)
              echo "🟢 Action: INSTALL — stack does not exist"
              echo "action=install" >> "$GITHUB_OUTPUT"
              ;;
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
              echo "🟢 Action: UPGRADE — stack in clean state ($STATUS)"
              echo "action=upgrade" >> "$GITHUB_OUTPUT"
              ;;
            REVIEW_IN_PROGRESS)
              # A CREATE change set was made but never executed, so the stack holds
              # NO resources. Deleting it is genuinely free and is the documented
              # recovery — it is the one delete in this block that cannot lose data,
              # so it needs no opt-in.
              echo "::warning::Stack is REVIEW_IN_PROGRESS (change set never executed, no resources) — deleting the empty shell"
              robust_delete "$STACK"
              echo "🟢 Action: INSTALL"
              echo "action=install" >> "$GITHUB_OUTPUT"
              ;;
            UPDATE_ROLLBACK_FAILED)
              # NEVER auto-delete this one. It is a stack that was LIVE and healthy,
              # whose update failed AND whose rollback then also failed. Deleting it
              # destroys a working installation. The supported recovery is to
              # continue the rollback, not to start again.
              echo "::error::Stack is UPDATE_ROLLBACK_FAILED — this workflow will NOT delete it."
              echo "::error::This state means a live stack failed to update and failed to roll back."
              echo "::error::Recover it in place:"
              echo "::error::  aws cloudformation continue-update-rollback --stack-name $STACK"
              echo "::error::If specific resources block the rollback, add:"
              echo "::error::  --resources-to-skip <LogicalId> [...]"
              echo "::error::Then re-run this workflow. Deleting a Porth stack is a ONE-WAY DOOR:"
              echo "::error::the DynamoDB tables and KMS keys are DeletionPolicy: Retain, so they"
              echo "::error::survive and their fixed names then block any recreate at"
              echo "::error::AWS::EarlyValidation::ResourceExistenceCheck."
              exit 1
              ;;
            ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED)
              # These are failed-CREATE states, where deleting is the standard (and
              # for ROLLBACK_COMPLETE, the only) recovery — CloudFormation refuses to
              # update a stack in them. But the retained tables and KMS keys outlive
              # the delete, so a "recreate" afterwards is not clean: the orphaned
              # fixed names block it. That makes this a decision, not a default.
              if [ "${ALLOW_STACK_DELETE:-false}" != "true" ]; then
                echo "::error::Stack is $STATUS. Recovery requires deleting and recreating it,"
                echo "::error::which this workflow will not do unless you ask for it explicitly."
                echo "::error::Re-run with allow_stack_delete=true if that is what you want."
                echo "::error::Before you do: the 8 Porth DynamoDB tables and 2 KMS keys are"
                echo "::error::DeletionPolicy: Retain. They SURVIVE the delete, and their fixed"
                echo "::error::names then block the recreate at change-set creation. Either adopt"
                echo "::error::them with an IMPORT change set, remove them, or install under a"
                echo "::error::different Environment value so the names do not collide."
                exit 1
              fi
              echo "::warning::Stack in $STATUS and allow_stack_delete=true — deleting and recreating"
              robust_delete "$STACK"
              echo "🟢 Action: INSTALL — recreating after cleanup"
              echo "action=install" >> "$GITHUB_OUTPUT"
              ;;
            *_IN_PROGRESS)
              echo "::error::Stack in non-terminal state ($STATUS) — investigate manually before re-running"
              exit 1
              ;;
            *)
              echo "::error::Stack in unexpected state ($STATUS)"
              exit 1
              ;;
          esac

      - name: Render SAR template
        id: render
        run: |
          set -euo pipefail
          echo "Rendering SAR template: ${{ env.EFF_SAR_APP_ID }} @ ${{ env.EFF_SAR_VERSION }}"
          CREATE_OUT=$(aws serverlessrepo create-cloud-formation-template \
            --application-id "${{ env.EFF_SAR_APP_ID }}" \
            --semantic-version "${{ env.EFF_SAR_VERSION }}" \
            --output json)
          TEMPLATE_ID=$(echo "$CREATE_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["TemplateId"])')
          for i in $(seq 1 30); do
            GET_OUT=$(aws serverlessrepo get-cloud-formation-template \
              --application-id "${{ env.EFF_SAR_APP_ID }}" \
              --template-id "$TEMPLATE_ID" --output json)
            STATUS=$(echo "$GET_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Status"])')
            if [ "$STATUS" = "ACTIVE" ]; then
              TEMPLATE_URL=$(echo "$GET_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["TemplateUrl"])')
              echo "template_url=$TEMPLATE_URL" >> "$GITHUB_OUTPUT"
              echo "✅ SAR template ACTIVE"
              exit 0
            elif [ "$STATUS" = "EXPIRED" ]; then
              echo "::error::SAR template EXPIRED before becoming ACTIVE"
              exit 1
            fi
            echo "  (attempt $i) template status=$STATUS — waiting 2s"
            sleep 2
          done
          echo "::error::SAR template did not become ACTIVE within 60s"
          exit 1

      - name: Create change set
        id: changeset
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
          CFN_EXECUTION_ROLE_ARN: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
          ADOPT_EXISTING_RESOURCES: ${{ inputs.adopt_existing_resources }}
        run: |
          set -euo pipefail
          if [ "${{ steps.preflight.outputs.action }}" = "install" ]; then
            CS_TYPE="CREATE"
          else
            CS_TYPE="UPDATE"
          fi
          CHANGE_SET_NAME="porth-${{ steps.preflight.outputs.action }}-$(date -u +%Y%m%d-%H%M%S)"

          PARAMS=( "ParameterKey=Environment,ParameterValue=${{ env.EFF_ENV_NAME }}" )

          # ADR-Z8 (PORTH-530): EMS is a single-environment instance — the authorizer pins
          # every request to FixedEnvironment and IGNORES the X-Porth-Environment header.
          #
          # PORTH-557 (SAR 0.2.0): EnvironmentMode was REMOVED as a parameter. The
          # presence of a non-empty FixedEnvironment now *is* the mode, so the pair
          # can no longer disagree and the deploy-time Rule that policed them is gone.
          # Passing it is not merely redundant — CloudFormation rejects unknown
          # parameters, so change-set creation fails before anything is touched.
          PARAMS+=( "ParameterKey=FixedEnvironment,ParameterValue=${{ env.EFF_FIXED_ENV }}" )

          # AuthTestToken enables the Layer 1 JWT bypass in the Lambda authorizer.
          # Only set if the secret is present — otherwise the bypass is disabled.
          AUTH_TEST_TOKEN="${{ secrets.PORTH_AUTH_TEST_TOKEN }}"
          if [ -n "$AUTH_TEST_TOKEN" ]; then
            PARAMS+=( "ParameterKey=AuthTestToken,ParameterValue=$AUTH_TEST_TOKEN" )
          fi
          # GitHubRepoOwner intentionally omitted → SAR CreateDeployRole condition stays false.

          # Custom domain (PORTH-479): AcmCertificateArn + ApiDomainName together flip the
          # template's HasCustomDomain condition, creating the ApiGatewayV2 DomainName +
          # ApiMapping and exporting the regional domain/hosted-zone outputs for the Route53
          # alias. Without BOTH the API stays on the raw execute-api URL. DnsZone (dot-less)
          # keeps the authorizer's cookie-domain derivation consistent with the proxy blob.
          if [ -n "${PORTH_DOMAIN:-}" ] && [ -n "${PORTH_CERT:-}" ]; then
            PARAMS+=( "ParameterKey=AcmCertificateArn,ParameterValue=${PORTH_CERT}" )
            PARAMS+=( "ParameterKey=ApiDomainName,ParameterValue=${PORTH_DOMAIN}" )
            if [ -n "${PORTH_DNS_ZONE:-}" ]; then
              PARAMS+=( "ParameterKey=DnsZone,ParameterValue=${PORTH_DNS_ZONE}" )
            fi
            echo "Custom domain ENABLED: ${PORTH_DOMAIN}"
          else
            echo "ℹ️  Custom domain OFF (API domain / ACM cert not both set) — execute-api URL only"
          fi

          # PORTH-556 (SAR 0.2.0): SpaOrigins was REMOVED as a parameter. The authorizer
          # now DERIVES its Origin allow-list from root_url + environments in the
          # /porth/auth blob, which is exactly what the "Seed OAuth-proxy config blob"
          # step below writes — and it writes spa_origins from this same
          # PORTH_SPA_ORIGINS var. So the value still reaches the authorizer; it now
          # travels through the blob instead of through a stack parameter, and the two
          # can no longer drift apart.
          #
          # PORTH_SPA_ORIGINS_RAW is therefore still required. Passing SpaOrigins as a
          # parameter would fail change-set creation on an unknown parameter.
          if [ -z "${PORTH_SPA_ORIGINS_RAW:-}" ]; then
            echo "::warning::PORTH_SPA_ORIGINS is empty — the cookie path's CSRF/Origin gate will be OFF"
          else
            echo "SPA origins (via /porth/auth, no longer a stack parameter): ${PORTH_SPA_ORIGINS_RAW}"
          fi

          # CFN_EXECUTION_ROLE_ARN is optional. When set, CloudFormation assumes this
          # role for all resource operations (recommended for least-privilege). When absent,
          # CloudFormation uses the calling OIDC role (porth-install-role) directly.
          ROLE_ARGS=()
          if [ -n "${CFN_EXECUTION_ROLE_ARN:-}" ]; then
            ROLE_ARGS=("--role-arn" "$CFN_EXECUTION_ROLE_ARN")
            echo "CloudFormation execution role: $CFN_EXECUTION_ROLE_ARN"
          else
            echo "ℹ️  AWS_CFN_EXECUTION_ROLE_ARN not set — CloudFormation will use the calling role directly"
          fi

          # PORTH-582 — adopting orphaned retained resources.
          #
          # Porth's 8 DynamoDB tables and 2 KMS keys are DeletionPolicy: Retain, so
          # if the stack is ever deleted they survive with their FIXED names. A
          # later CREATE then fails at AWS::EarlyValidation::ResourceExistenceCheck
          # — the names are taken, by resources no stack owns.
          #
          # --import-existing-resources tells CloudFormation to ADOPT such resources
          # into the new stack instead of failing on them. It is off by default:
          # silently adopting whatever happens to share a name is exactly the
          # behaviour you do not want as a default.
          #
          # PORTH-473 removed this flag from the Porth repo's own deploy.yml after
          # it produced an immediate ChangeSetNotFound — but that was a stack which
          # already tracked all of its resources, so there was nothing to import.
          # That note ends "use explicit IMPORT changesets if orphan adoption is
          # ever needed", and this is that case. The flag is the one-shot form of
          # the same thing; the explicit two-phase IMPORT (stripped template of
          # only the imported resources, then an update adding the rest) remains
          # the fallback if this errors.
          IMPORT_ARGS=()
          if [ "${ADOPT_EXISTING_RESOURCES:-false}" = "true" ]; then
            if [ "$CS_TYPE" != "CREATE" ]; then
              echo "::error::adopt_existing_resources only applies to a CREATE change set (this run is $CS_TYPE)."
              echo "::error::An existing stack already owns its resources — there is nothing to adopt."
              exit 1
            fi
            IMPORT_ARGS=("--import-existing-resources")
            echo "::warning::Adopting pre-existing resources into the new stack (--import-existing-resources)."
            echo "::warning::Every resource whose name matches the template will be TAKEN OVER by this stack."
          fi

          echo "Creating $CS_TYPE change set: $CHANGE_SET_NAME"
          CHANGE_SET_ID=$(aws cloudformation create-change-set \
            --stack-name "$STACK" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CS_TYPE" \
            --template-url "${{ steps.render.outputs.template_url }}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            "${ROLE_ARGS[@]}" \
            ${IMPORT_ARGS[@]+"${IMPORT_ARGS[@]}"} \
            --parameters "${PARAMS[@]}" \
            --query 'Id' --output text)
          echo "change_set_id=$CHANGE_SET_ID" >> "$GITHUB_OUTPUT"
          echo "Created change set: $CHANGE_SET_ID"

          set +e
          aws cloudformation wait change-set-create-complete --change-set-name "$CHANGE_SET_ID"
          WAIT_RC=$?
          set -e

          if [ "$WAIT_RC" -ne 0 ]; then
            DESCRIBE=$(aws cloudformation describe-change-set \
              --change-set-name "$CHANGE_SET_ID" \
              --query '{Status:Status,StatusReason:StatusReason}' --output json 2>/dev/null || echo '{}')
            echo "$DESCRIBE"
            REASON=$(echo "$DESCRIBE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StatusReason") or "")' 2>/dev/null || echo "")
            if echo "$REASON" | grep -qi "didn't contain changes\|no changes\|No updates"; then
              echo "✅ Action: NO-OP — stack already at the requested version"
              echo "no_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Change set creation failed: $REASON"
              exit "$WAIT_RC"
            fi
          fi

      - name: Inspect change set for destructive DynamoDB actions
        if: steps.changeset.outputs.no_changes != 'true'
        run: |
          set -euo pipefail
          CHANGES=$(aws cloudformation describe-change-set \
            --change-set-name "${{ steps.changeset.outputs.change_set_id }}" \
            --query 'Changes[?ResourceChange.ResourceType==`AWS::DynamoDB::Table`].ResourceChange.{Id:LogicalResourceId,Action:Action,Replacement:Replacement}' \
            --output json)
          echo "DynamoDB table changes in change set: $CHANGES"
          DESTRUCTIVE=$(echo "$CHANGES" | python3 -c 'import json, sys; changes = json.load(sys.stdin) or []; bad = [c for c in changes if c.get("Action") == "Remove" or c.get("Replacement") == "True"]; print(json.dumps(bad))')
          if [ "$DESTRUCTIVE" != "[]" ]; then
            echo "::error::Change set would Remove or Replace DynamoDB tables — aborting to protect data (ADR-Z1/Z2)."
            echo "Destructive changes: $DESTRUCTIVE"
            exit 1
          fi
          echo "✅ No destructive DynamoDB table changes in change set"

      - name: Execute change set
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
        run: |
          set -euo pipefail
          if [ "${{ steps.changeset.outputs.no_changes }}" = "true" ]; then
            echo "No changes — skipping execute."
            exit 0
          fi
          aws cloudformation execute-change-set \
            --change-set-name "${{ steps.changeset.outputs.change_set_id }}"

          set +e
          if [ "${{ steps.preflight.outputs.action }}" = "install" ]; then
            aws cloudformation wait stack-create-complete --stack-name "$STACK"
          else
            aws cloudformation wait stack-update-complete --stack-name "$STACK"
          fi
          WAIT_RC=$?
          set -e

          if [ "$WAIT_RC" -ne 0 ]; then
            echo "::warning::Stack waiter failed (rc=$WAIT_RC) — capturing failed stack events"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK" \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`)] | [:20].{Time:Timestamp,LogicalId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output json || true
            exit "$WAIT_RC"
          fi
          echo "✅ Stack $STACK reached terminal state for ${{ steps.preflight.outputs.action }}"

      - name: Resolve Porth stack outputs
        id: tables
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
        run: |
          set -euo pipefail
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text 2>/dev/null || echo ""
          }
          PORTH_API_URL=$(get_output PorthApiUrl)
          TENANTS_TABLE=$(get_output TenantsTableName)
          PERMISSIONS_TABLE=$(get_output PermissionsTableName)
          ROLES_TABLE=$(get_output RolesTableName)
          CLAIM_TABLE=$(get_output ClaimMappingConfigsTableName)
          EXECUTE_API_URL=$(get_output ApiEndpoint)
          APIGW_REGIONAL_DOMAIN=$(get_output ApiGatewayRegionalDomainName)
          APIGW_REGIONAL_HZ=$(get_output ApiGatewayRegionalHostedZoneId)
          # PORTH-530: the ADR-Z9 BFF session spine — needed by the /porth/auth blob.
          SESSIONS_TABLE=$(get_output SessionsTableName)
          SESSION_KMS=$(get_output SessionKmsKeyArn)

          MISSING=""
          require() {
            if [ -z "$2" ] || [ "$2" = "None" ]; then MISSING="$MISSING $1"; fi
          }
          require PorthApiUrl "$PORTH_API_URL"
          require TenantsTableName "$TENANTS_TABLE"
          require PermissionsTableName "$PERMISSIONS_TABLE"
          require RolesTableName "$ROLES_TABLE"
          require ClaimMappingConfigsTableName "$CLAIM_TABLE"
          if [ -n "$MISSING" ]; then
            echo "::error::porth-components stack is missing expected outputs:$MISSING"
            exit 1
          fi

          echo "PORTH_API_URL=$PORTH_API_URL"                               >> "$GITHUB_ENV"
          echo "PORTH_EXECUTE_API_URL=$EXECUTE_API_URL"                     >> "$GITHUB_ENV"
          echo "PORTH_TENANTS_TABLE=$TENANTS_TABLE"                         >> "$GITHUB_ENV"
          echo "PORTH_PERMISSIONS_TABLE=$PERMISSIONS_TABLE"                 >> "$GITHUB_ENV"
          echo "PORTH_ROLES_TABLE=$ROLES_TABLE"                             >> "$GITHUB_ENV"
          echo "PORTH_CLAIM_MAPPING_CONFIGS_TABLE=$CLAIM_TABLE"             >> "$GITHUB_ENV"
          echo "PORTH_SESSIONS_TABLE=$SESSIONS_TABLE"                       >> "$GITHUB_ENV"
          echo "PORTH_SESSION_KMS=$SESSION_KMS"                             >> "$GITHUB_ENV"
          echo "APIGW_REGIONAL_DOMAIN=$APIGW_REGIONAL_DOMAIN"               >> "$GITHUB_ENV"
          echo "APIGW_REGIONAL_HZ=$APIGW_REGIONAL_HZ"                       >> "$GITHUB_ENV"

          # Step outputs for the bootstrap job — different role, fresh runner, so GITHUB_ENV
          # does not reach it.
          {
            echo "env_scope=${{ env.EFF_FIXED_ENV }}"
            echo "tenants_table=$TENANTS_TABLE"
            echo "permissions_table=$PERMISSIONS_TABLE"
            echo "roles_table=$ROLES_TABLE"
            echo "claim_mapping_table=$CLAIM_TABLE"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Resolved Porth outputs (API: $PORTH_API_URL, execute-api: $EXECUTE_API_URL)"
          if [ -n "$SESSIONS_TABLE" ] && [ "$SESSIONS_TABLE" != "None" ]; then
            echo "✅ BFF session spine: sessions table $SESSIONS_TABLE"
          else
            echo "::warning::SessionsTableName not exported — the BFF may not be present in this SAR version"
          fi

      - name: Upsert Route 53 alias for Porth API custom domain
        # Idempotent: creates or updates the A-alias record pointing
        # porth-api.ems.estynsoftware.cloud → API Gateway regional domain.
        # Skipped if no custom domain was configured (PORTH_DOMAIN empty).
        # Non-fatal: if IAM perms are missing the operator must create the
        # record manually; subsequent steps still run.
        if: env.PORTH_DOMAIN != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          DOMAIN="${PORTH_DOMAIN}"
          REGIONAL_DOMAIN="${APIGW_REGIONAL_DOMAIN}"
          REGIONAL_HZ="${APIGW_REGIONAL_HZ}"

          if [ -z "$REGIONAL_DOMAIN" ] || [ "$REGIONAL_DOMAIN" = "None" ]; then
            echo "::warning::ApiGatewayRegionalDomainName not in stack outputs — skipping Route 53 upsert"
            exit 0
          fi

          # Derive parent zone name (porth-api.ems.estynsoftware.cloud → ems.estynsoftware.cloud)
          PARENT="${DOMAIN#*.}"
          HZ_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "${PARENT}." \
            --query "HostedZones[?Name=='${PARENT}.'].Id" \
            --output text | head -1 | sed 's|/hostedzone/||')

          if [ -z "$HZ_ID" ]; then
            echo "::warning::No Route 53 hosted zone found for $PARENT — skipping Route 53 upsert"
            echo "  Manual step: create ALIAS A record $DOMAIN → $REGIONAL_DOMAIN (hz $REGIONAL_HZ)"
            exit 0
          fi

          echo "Upserting: $DOMAIN → $REGIONAL_DOMAIN (apigw hz=$REGIONAL_HZ, r53 hz=$HZ_ID)"
          aws route53 change-resource-record-sets \
            --hosted-zone-id "$HZ_ID" \
            --change-batch "{
              \"Comment\": \"porth-install.yml: alias for Porth API custom domain\",
              \"Changes\": [{
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"${DOMAIN}.\",
                  \"Type\": \"A\",
                  \"AliasTarget\": {
                    \"HostedZoneId\": \"${REGIONAL_HZ}\",
                    \"DNSName\": \"${REGIONAL_DOMAIN}.\",
                    \"EvaluateTargetHealth\": false
                  }
                }
              }]
            }"
          echo "✅ Route 53 alias upserted: $DOMAIN → $REGIONAL_DOMAIN"

      # ── Seed the OAuth-proxy config blob (/porth/auth) — PORTH-530 ──────────
      # PORTH-479: the BFF proxy (estyn_platform.config, prefix /porth) reads this
      # JSON blob at request time. Without it the proxy is INERT — no browser login
      # completes. custom_domain drives the /auth/callback URL (must be registered in
      # Auth0); cookie_domain is the ZONE-level .<DnsZone> (env is a data axis, not the
      # cookie). sessions_table + kms come from the stack outputs above. spa_origins is
      # sourced from the SAME PORTH_SPA_ORIGINS var as the authorizer's SpaOrigins param,
      # so the two cannot drift.
      # PORTH-530: the IdP half of this blob comes from SSM /porth/config/testbed
      # (`platform.idp`), not from GitHub secrets. Identity configuration belongs in the
      # account it authenticates against — this repo is public, and a repo secret is
      # unversioned, unaudited, and masked in logs only when it is the exact literal value.
      # The rest of the blob stays derived from the stack outputs and the install vars,
      # because it describes the stack's shape rather than the identity provider.
      #
      # NOT continue-on-error. Without this blob the BFF proxy is completely inert — no
      # browser login completes — so swallowing a failure here produces a green install that
      # cannot authenticate anyone, with nothing in the log saying so.
      - name: Seed OAuth-proxy config blob (/porth/auth)
        run: |
          set -euo pipefail
          if [ -z "${PORTH_DNS_ZONE:-}" ] || [ -z "${PORTH_DOMAIN:-}" ]; then
            echo "::error::DNS_ZONE / API domain are unset — /porth/auth cannot be built and the proxy would stay inert"
            exit 1
          fi

          # --with-decryption so the parameter works as String or SecureString.
          MANIFEST=$(aws ssm get-parameter --name /porth/config/testbed --with-decryption \
            --query Parameter.Value --output text --region "$AWS_REGION" 2>/dev/null || echo "")
          if [ -z "$MANIFEST" ]; then
            echo "::error::/porth/config/testbed is absent — it holds the platform IdP config."
            echo "::error::Create it with:"
            echo "::error::  aws ssm put-parameter --name /porth/config/testbed --type SecureString --value file://manifest.json"
            exit 1
          fi

          BLOB=$(MANIFEST="$MANIFEST" python3 -c '
          import json, os, sys
          manifest = json.loads(os.environ["MANIFEST"])
          idp = (manifest.get("platform") or {}).get("idp") or {}
          missing = [k for k in ("issuer", "jwks_uri") if not idp.get(k)]
          if missing:
              print(f"::error::platform.idp is missing {missing} (PORTH-488 needs both)", file=sys.stderr)
              raise SystemExit(1)

          z = os.environ["PORTH_DNS_ZONE"].rstrip(".")
          blob = {
              # Identity — from the manifest, verbatim. `client_id` is named
              # interactive_client_id here because that is what the proxy reads.
              "issuer": idp["issuer"],
              "jwks_uri": idp["jwks_uri"],
              "interactive_client_id": idp.get("client_id", ""),
              "audience": idp.get("audience", ""),
              "protocol": idp.get("protocol", "oidc"),
              # Stack shape — derived, stays in the pipeline.
              "custom_domain": os.environ.get("PORTH_DOMAIN", ""),
              "cookie_domain": f".{z}",
              "dns_zone": z,
              "spa_origins": os.environ.get("PORTH_SPA_ORIGINS_RAW", ""),
              "platform_tenant_id": "platform",
              "environment": os.environ.get("EFF_FIXED_ENV", ""),
              "sessions_table": os.environ.get("PORTH_SESSIONS_TABLE", ""),
              "session_kms_key_id": os.environ.get("PORTH_SESSION_KMS", ""),
          }
          # Providers without RP-initiated logout simply omit it.
          if idp.get("end_session_endpoint"):
              blob["end_session_endpoint"] = idp["end_session_endpoint"]
          print(json.dumps(blob))
          ')

          echo "→ writing /porth/auth blob"
          aws ssm put-parameter --name /porth/auth --type String --overwrite \
            --value "$BLOB" --region "$AWS_REGION"
          echo "✅ Seeded /porth/auth (issuer $(echo "$BLOB" | python3 -c 'import json,sys; print(json.load(sys.stdin)["issuer"])'))"

      # ── Seed SSM auth-policy + session-policy templates ─────────────────────
      # Components deploy.yml seeds these after every deploy, but porth-install
      # (SAR consume path) has no equivalent step.  Without these params the
      # AuthorizerFunction cannot load its policy cache and authorised routes
      # return 500.  continue-on-error: true so a missing SSM permission doesn't
      # block the rest of the workflow; an operator can re-run just this step.
      - name: Seed SSM auth-policy templates
        continue-on-error: true
        run: |
          ENV="${{ env.EFF_ENV_NAME }}"
          ALLOW_ALL='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"execute-api:Invoke","Resource":"*"}]}'
          INDEX='{ "/organizations":"platform-admin-only", "/tenants":"tenant-scoped-rbac", "/users":"tenant-scoped-user", "/roles":"tenant-scoped-rbac", "/permissions":"tenant-scoped-rbac", "/claim-mapping-configs":"tenant-scoped-rbac", "/org-units":"tenant-scoped-rbac", "/provision":"tenant-scoped-user" }'

          for NAME in \
            "/porth/${ENV}/auth-policy/platform-admin-only:$ALLOW_ALL" \
            "/porth/${ENV}/auth-policy/tenant-scoped-rbac:$ALLOW_ALL" \
            "/porth/${ENV}/auth-policy/tenant-scoped-user:$ALLOW_ALL"
          do
            PARAM="${NAME%%:*}"
            VALUE="${NAME#*:}"
            aws ssm put-parameter \
              --name "$PARAM" \
              --value "$VALUE" \
              --type String \
              --overwrite \
              --region "$AWS_REGION" \
              --no-cli-pager
            echo "✅ $PARAM"
          done

          aws ssm put-parameter \
            --name "/porth/${ENV}/auth-policy/index" \
            --value "$INDEX" \
            --type String \
            --overwrite \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "✅ /porth/${ENV}/auth-policy/index"

          # ── Session-policy templates ────────────────────────────────────────
          # This block is a COPY of the canonical seeding in the Porth repo's
          # deploy.yml. It had drifted three releases behind, and every drift was
          # silent. Kept byte-compatible with the source now; the duplication is
          # the real defect and belongs in `porth-install auth-config` instead.
          TEMPLATE_NAME="tenant-scoped-default"
          PLATFORM_TEMPLATE_NAME="platform-scoped-default"

          # PORTH-514/530 — LeadingKeys must carry the ENV#$env# prefix. EMS pins
          # FixedEnvironment, so every item is written under ENV#{slot}#…; the old
          # un-prefixed TENANT#$tenant / ORG#$org_id matched no key that exists.
          TENANT_SESSION_POLICY='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["dynamodb:GetItem","dynamodb:PutItem","dynamodb:Query","dynamodb:UpdateItem","dynamodb:DeleteItem","dynamodb:BatchGetItem","dynamodb:BatchWriteItem","dynamodb:ConditionCheckItem"],"Resource":"*","Condition":{"ForAllValues:StringLike":{"dynamodb:LeadingKeys":["ENV#$env#TENANT#$tenant#*"]}}}]}'
          aws ssm put-parameter \
            --name "/porth/${ENV}/auth-session-policy/${TEMPLATE_NAME}" \
            --value "$TENANT_SESSION_POLICY" \
            --type String \
            --overwrite \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "✅ /porth/${ENV}/auth-session-policy/${TEMPLATE_NAME}"

          # PORTH-576 — the platform operator's template: cross-TENANT, but NOT
          # cross-ENVIRONMENT. Without it, a platform admin resolves the tenant
          # template above with $tenant substituted as the literal "platform" and
          # can read only TENANT#platform — one partition, for the one operator
          # whose entire job is cross-tenant.
          #
          # Scan is a SEPARATE, unconditioned statement on purpose. A Scan
          # populates no dynamodb:LeadingKeys, so ForAllValues:StringLike passes
          # vacuously; folding it in above would read as constrained while
          # constraining nothing.
          PLATFORM_SESSION_POLICY='{"Version":"2012-10-17","Statement":[{"Sid":"PlatformOperatorKeyedAccess","Effect":"Allow","Action":["dynamodb:GetItem","dynamodb:PutItem","dynamodb:Query","dynamodb:UpdateItem","dynamodb:DeleteItem","dynamodb:BatchGetItem","dynamodb:BatchWriteItem","dynamodb:ConditionCheckItem"],"Resource":"*","Condition":{"ForAllValues:StringLike":{"dynamodb:LeadingKeys":["ENV#$env#*"]}}},{"Sid":"PlatformOperatorScan","Effect":"Allow","Action":["dynamodb:Scan"],"Resource":"*"}]}'
          aws ssm put-parameter \
            --name "/porth/${ENV}/auth-session-policy/${PLATFORM_TEMPLATE_NAME}" \
            --value "$PLATFORM_SESSION_POLICY" \
            --type String \
            --overwrite \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "✅ /porth/${ENV}/auth-session-policy/${PLATFORM_TEMPLATE_NAME}"

          # PORTH-550 — `paths` values are PATH PREFIXES, matched longest-first by
          # policy_cache._find_template using path.startswith(key). "default" is
          # not a prefix of any request path, so it matched NOTHING:
          # get_session_policy returned None for every request and the authorizer
          # assumed the tenant role with NO session policy at all — i.e. its full
          # ceiling, reaching every tenant. "/" is the catch-all prefix that
          # "default" was meant to express.
          #
          # PORTH-576 — platform_paths selects the template for the platform-admin
          # role.
          SESSION_INDEX="{\"roles\":{\"tenant\":\"porth-tenant-${ENV}\",\"platform_admin\":\"porth-platform-admin-${ENV}\"},\"context_rules\":[],\"paths\":{\"/\":\"${TEMPLATE_NAME}\"},\"platform_paths\":{\"/\":\"${PLATFORM_TEMPLATE_NAME}\"}}"
          aws ssm put-parameter \
            --name "/porth/${ENV}/auth-session-policy/index" \
            --value "$SESSION_INDEX" \
            --type String \
            --overwrite \
            --region "$AWS_REGION" \
            --no-cli-pager
          echo "✅ /porth/${ENV}/auth-session-policy/index"

          # Seed the auth-test-token SSM fallback. The AuthorizerFunction reads
          # PORTH_AUTH_TEST_TOKEN env var first (set via CFN AuthTestToken param),
          # then falls back to this SSM path on cold start.
          AUTH_TEST_TOKEN="${{ secrets.PORTH_AUTH_TEST_TOKEN }}"
          if [ -n "$AUTH_TEST_TOKEN" ]; then
            aws ssm put-parameter \
              --name "/porth/${ENV}/auth-test-token" \
              --value "$AUTH_TEST_TOKEN" \
              --type SecureString \
              --overwrite \
              --region "$AWS_REGION" \
              --no-cli-pager
            echo "✅ /porth/${ENV}/auth-test-token"
          else
            echo "⚠️  PORTH_AUTH_TEST_TOKEN secret not set — skipping auth-test-token SSM seed"
          fi

      - name: Smoke test Porth API
        run: |
          # Use raw execute-api URL so smoke test works before DNS record exists
          SMOKE_URL="${PORTH_EXECUTE_API_URL:-$PORTH_API_URL}"
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "${SMOKE_URL}/health" || echo "000")
          if [[ "$STATUS" == "200" ]]; then
            echo "✅ Smoke test passed (GET /health → 200)"
          else
            echo "::warning::Smoke test: GET /health → HTTP $STATUS (non-fatal)"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Porth install/upgrade summary"
            echo ""
            echo "- **Action:** ${{ steps.preflight.outputs.action }}"
            echo "- **No-op:** ${{ steps.changeset.outputs.no_changes || 'false' }}"
            echo "- **Target version:** ${{ env.EFF_SAR_VERSION }}"
            echo "- **Stack:** ${{ env.EFF_STACK_NAME }}"
            echo "- **Environment param:** ${{ env.EFF_ENV_NAME }}"
            echo "- **Env mode:** single (FixedEnvironment=\`${{ env.EFF_FIXED_ENV }}\`)"
            echo "- **Porth API URL:** ${PORTH_API_URL:-'(unresolved)'}"
            echo "- **Custom domain:** ${PORTH_DOMAIN:-'OFF (execute-api only)'}"
            echo "- **SPA origins:** ${PORTH_SPA_ORIGINS_RAW:-'(unset — origin gate OFF)'}"
            echo ""
            echo "### Next steps"
            echo "- Seed test tenants via the (separate) porth-seed-testbed workflow"
            echo "- Then run the PORTH-494 security suite against this install"
          } >> "$GITHUB_STEP_SUMMARY"

  # Own job so it runs under the bootstrap role — a job has exactly one environment, and this
  # one can write the Porth tables but cannot touch CloudFormation, SAR, or Route 53.
  # Deliberately last: every other step needs the install role, and the platform tenant is
  # independent of the CloudFormation stack.
  bootstrap:
    name: Bootstrap platform tenant
    needs: install-or-upgrade
    uses: ./.github/workflows/porth-bootstrap.yml
    with:
      # ADR-Z8 (PORTH-532): the install pins FixedEnvironment, so the bootstrap must write
      # ENV#{scope}#… or the authorizer will never resolve the platform tenant.
      env_scope: ${{ needs.install-or-upgrade.outputs.env_scope }}
      tenants_table: ${{ needs.install-or-upgrade.outputs.tenants_table }}
      permissions_table: ${{ needs.install-or-upgrade.outputs.permissions_table }}
      roles_table: ${{ needs.install-or-upgrade.outputs.roles_table }}
      claim_mapping_table: ${{ needs.install-or-upgrade.outputs.claim_mapping_table }}
