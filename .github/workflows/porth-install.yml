name: Porth components — install + upgrade

# PORTH-471 — Pipeline 1. PORTH-530 — SAR 0.1.16 + ADR-Z9 BFF wiring.
# PORTH-582 — upgraded to SAR 0.2.0 (container-image Porth).
#
# PORTH-657 — installs from Porth's S3 release, not SAR.
#
# Installs or upgrades the Porth components stack (serverlessrepo-porth-components) in the EMS
# account from a versioned Porth release in the Estyn Components account, then
# bootstraps the reserved 'platform' tenant and patches its IdP config.
#
# Two steps: resolve the requested version to its template URL from
# s3://porth-releases-084847995635/porth/<version>/manifest.json, then
# `cloudformation create-change-set --template-url … --role-arn <porth-cfn-execution-role>` so
# CloudFormation performs every resource operation as the dedicated execution
# role. porth-install-role only orchestrates — it calls the CFN APIs and reads the release.
# The stack keeps its SAR-era name: a new name would be a new stack, and the old one's
# retained fixed-name tables would block it.
#
# GitHubRepoOwner is intentionally NOT passed, so the template's
# CreateDeployRole condition stays false — no porth-deploy-role is created
# and no GitHub OIDC provider is required in the EMS account
# (PORTH-471 decision, 2026-05-19).
#
# A change-set inspection step aborts before execute if the change set would
# Remove or Replace any DynamoDB table (ADR-Z1/Z2 — DDB safety).
#
# PORTH-627 — environment model: EMS runs SEVERAL ADR-Z8 environments, so
# FixedEnvironment is EMPTY. Each one is a label in the domain and a deployment of
# its own — porth-sample.ems.… is where main lands, porth-dau.ems.… is the working
# environment — and every partition key is prefixed ENV#{that environment}#.
#
# It was `prod` and single-environment (PORTH-530). That is the value that made the
# deployed names disagree with the URL a tenant types, and it is why the multiple-
# environment access path — the one Elegans has always run — was asserted by unit
# tests here and witnessed by nothing.
#
# PORTH-557 (SAR 0.2.0): the EnvironmentMode parameter is GONE. A non-empty
# FixedEnvironment *is* single mode; empty is multi. The two can no longer
# disagree, so the deploy-time Rule that policed the pair went with it.
#
# PORTH-530 — required vars/secrets (GitHub environment: porth-install):
#   vars.AWS_ROLE_ARN                 OIDC role to assume
#   vars.AWS_CFN_EXECUTION_ROLE_ARN   (optional) CFN execution role
#   vars.DNS_ZONE                     e.g. ems.estynsoftware.cloud — cookie-domain derivation
#   vars.API_DOMAIN_NAME              (or legacy vars.PORTH_API_DOMAIN_NAME)
#   vars.PORTH_SPA_ORIGINS            CSV of SPA origins, e.g. https://app.ems.estynsoftware.cloud
#   vars.PORTH_FIXED_ENVIRONMENT      ADR-Z8 slot to PIN this install to. UNSET on EMS, which
#                                     is multi-environment. Presence is the mode (PORTH-557).
#   secrets.ACM_CERTIFICATE_ARN       cert for the custom domain (us-east-1)
#
# Everything above describes the STACK's shape. Identity configuration is not here — it lives
# in SSM at /porth/config/testbed under `platform.idp`, in the account it authenticates
# against (PORTH-530). PLATFORM_AUTH0_DOMAIN / _CLIENT_ID / _AUDIENCE and PORTH_TENANT_CONFIG
# are no longer read by this workflow and can be deleted from the repo's secrets.
#
on:
  workflow_dispatch:
    inputs:
      porth_version:
        # Kept current deliberately. A stale default is not a harmless
        # convenience: the dispatch form prefills it, so leaving 0.2.0 here
        # meant an upgrade silently asked for a release older than the one
        # installed, and the change set was refused with an error that reads as
        # a stack problem rather than a wrong input. Bump this with each Porth
        # release the consumer is expected to move to.
        description: 'Porth release version to install/upgrade to (must be published: s3://porth-releases-084847995635/porth/<version>/manifest.json)'
        required: true
        # 0.3.1 is what run 32524612746 installed on 2026-08-21. It said 0.3.0,
        # which is the stale-default trap the comment above describes, one
        # release later: accepting the prefilled box asks for an OLDER version
        # than the one deployed and the change set is refused with an error that
        # reads as a stack problem.
        #
        # PORTH-657: 0.4.2 is the first version published to the S3 release bucket
        # (backfilled from SAR so the switch-over can be tested at the same code).
        # PORTH-656: 0.4.3 serves tenant API hosts ({tenant}.api.{slot}.{zone}) —
        # host-bound credentials, the `porth` mapping key and per-host CORS.
        # PORTH-656: 0.4.7 adds the browser surface (BrowserHttpApiId and the
        # browser authorizer), which deploy-sample-app.yml moves tenant-API-host
        # slots onto; 0.4.5 clears the drifted authorizer; 0.4.6 reloads the
        # tenant directory on a login-org miss.
        # 0.4.8 names the two Porth APIs (porth-dev-api / porth-dev-browser-api).
        # 0.4.9 — PORTH-655 bugs (audit slot, org routes platform-only,
        # legacy-read refusal, connector claim-mapping lineage).
        # 0.4.17 — PORTH-655: path_basis "as_sent" (the policy documents below
        # key Porth's routes /porth/...), and the browser gateway cache
        # (browser_gateway_cache_ttl, below).
        # 0.4.19 — PORTH-655: the authorizers restore the API mapping key, so
        # the as_sent index below matches /porth/..., /mcp and /suppliers.
        default: '0.4.19'
      stack_name:
        description: 'CloudFormation stack name in EMS'
        required: false
        default: 'serverlessrepo-porth-components'
      environment_name:
        description: 'Porth Environment parameter (drives the DynamoDB table name suffix)'
        required: false
        default: 'dev'
      fixed_environment:
        # A per-run OVERRIDE of vars.PORTH_FIXED_ENVIRONMENT, and empty by
        # default so it overrides nothing unless typed.
        #
        # The install's mode belongs in the environment's variables with every
        # other setting, not in a form default. A default is whatever the last
        # person left prefilled and changes with the ref the run was dispatched
        # from — which is not control, and re-pinning an install by accepting a
        # prefilled box is silent: envelopes keep being minted for one slot and
        # the other environment simply cannot be reached.
        #
        # It also has to default to empty rather than be handled further down:
        # on workflow_dispatch GitHub fills an omitted input with its declared
        # default, so `inputs.fixed_environment || …` never sees an empty value
        # while a default is set here.
        description: 'Override vars.PORTH_FIXED_ENVIRONMENT for this run only. Leave blank to use the configured value.'
        required: false
        default: ''
      log_level:
        # EMS is the Porth testbed: DEBUG by default, so every authorizer, API,
        # auth-proxy and mint decision is in the logs (PORTH-655, Richard 2026-11-07).
        description: 'Python log level for every Porth Lambda. EMS runs DEBUG.'
        required: false
        type: choice
        options: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        default: 'DEBUG'
      browser_gateway_cache_ttl:
        # PORTH-655 (Porth >= 0.4.16): API Gateway caches the browser authorizer
        # per browser handle (Authorization). Non-zero REQUIRES every browser
        # caller to send the handle — the SPA, the tier-2 e2e and Prawf still send
        # the old empty `Bearer ` and would be refused (missing_handle). 0 = cache
        # off and the handle optional. Raise to 300 once they all send it.
        description: 'Seconds API Gateway caches a browser-authorizer result (0 = off, handle optional; 300 once every browser caller sends the handle)'
        required: false
        default: '0'
      prune_retired:
        description: 'Delete permissions Porth no longer ships (e.g. platform.orgs.*) and every grant to them. Leave OFF: the install always prints the dry run; read it first.'
        required: false
        type: boolean
        default: false
      allow_stack_delete:
        description: 'Permit deleting a failed stack before recreating it. Retained tables/KMS keys SURVIVE and will block the recreate — read the pre-flight error first.'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: porth-install-${{ inputs.stack_name || 'serverlessrepo-porth-components' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # PORTH-657 — Porth releases live here, in the Estyn Components account, readable by
  # principals in the Estyn Organization (porth-install-role needs s3:GetObject on porth/*).
  PORTH_RELEASE_BUCKET: porth-releases-084847995635
  # PORTH-656: no porth-install pin here. The version every step runs is the
  # one the Porth release was cut with — its manifest's
  # components["porth-install"] — resolved by scripts/resolve-porth-release.sh
  # into PORTH_INSTALL_VERSION (install job) and the job output the check job
  # reads. Exact, so pip cannot backtrack (why the old pin existed); and it moves
  # with the release, so a release's migrations and checks always run here. The
  # pins it replaces (0.3.0 for the install, 0.4.4 for check) had kept every
  # migration and check since 0.4.1 off this install.

jobs:
  install-or-upgrade:
    name: Install or upgrade Porth ${{ inputs.porth_version || '0.4.19' }}
    runs-on: ubuntu-latest
    environment: porth-install
    timeout-minutes: 30
    # Passed to the bootstrap job, which runs under its own role on a fresh runner and so
    # cannot see anything this job put in GITHUB_ENV.
    outputs:
      porth_install_version: ${{ steps.release.outputs.porth_install_version }}
      env_scopes: ${{ steps.tables.outputs.env_scopes }}
      tenants_table: ${{ steps.tables.outputs.tenants_table }}
      permissions_table: ${{ steps.tables.outputs.permissions_table }}
      roles_table: ${{ steps.tables.outputs.roles_table }}
      claim_mapping_table: ${{ steps.tables.outputs.claim_mapping_table }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install boto3

      # Resolves workflow_dispatch inputs with hard-coded defaults so this job
      # also works when triggered by the push shim (inputs are empty on push).
      - name: Resolve effective inputs
        run: |
          echo "EFF_PORTH_VERSION=${{ inputs.porth_version || '0.4.19' }}" >> "$GITHUB_ENV"
          echo "EFF_STACK_NAME=${{ inputs.stack_name || 'serverlessrepo-porth-components' }}" >> "$GITHUB_ENV"
          echo "EFF_ENV_NAME=${{ inputs.environment_name || 'dev' }}" >> "$GITHUB_ENV"
          # The configured mode, overridable for one run. Empty IS the mode
          # (PORTH-557): a non-empty FixedEnvironment pins every envelope to one
          # slot, so on EMS — which runs porth-sample and porth-dau — the
          # variable is left unset and this resolves empty.
          echo "EFF_FIXED_ENV=${{ inputs.fixed_environment || vars.PORTH_FIXED_ENVIRONMENT || '' }}" >> "$GITHUB_ENV"
          echo "EFF_LOG_LEVEL=${{ inputs.log_level || 'DEBUG' }}" >> "$GITHUB_ENV"
          echo "EFF_BROWSER_CACHE_TTL=${{ inputs.browser_gateway_cache_ttl || '0' }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Caller identity
        run: aws sts get-caller-identity

      # PORTH-657 — precondition: the requested version is a published release and this
      # role can read it. A version exists for consumers once its manifest does (the
      # Components release workflow writes it last), so an absent manifest means "not
      # released", and AccessDenied means porth-install-role lacks s3:GetObject on
      # arn:aws:s3:::porth-releases-084847995635/porth/* — escalate either to the Porth team
      # rather than debugging a confusing change-set failure later.
      - name: Resolve the Porth release
        id: release
        run: scripts/resolve-porth-release.sh "${{ env.EFF_PORTH_VERSION }}"

      - name: Validate inputs and resolve domain parameters
        env:
          DNS_ZONE_VAR: ${{ vars.DNS_ZONE }}
          SPA_ORIGINS_VAR: ${{ vars.PORTH_SPA_ORIGINS }}
          ROOT_URL_VAR: ${{ vars.PORTH_ROOT_URL }}
        run: |
          set -euo pipefail
          # PORTH-655: no shared Porth API host. Every declared environment is on
          # tenant API hosts ({tenant}.api.{slot}.{zone}), so the old
          # porth-api.{zone} custom domain, its certificate and its alias are
          # retired: the install passes no ApiDomainName/AcmCertificateArn
          # (CloudFormation deletes the domain and mapping) and removes the alias.
          echo "PORTH_DNS_ZONE=${DNS_ZONE_VAR%.}" >> "$GITHUB_ENV"
          echo "PORTH_SPA_ORIGINS_RAW=${SPA_ORIGINS_VAR:-}" >> "$GITHUB_ENV"

          echo "Resolved domain:      '${DOMAIN:-<execute-api default>}'"
          echo "Resolved DNS zone:    '${DNS_ZONE_VAR%.}'"
          echo "Resolved SPA origins: '${SPA_ORIGINS_VAR:-<unset — authorizer origin gate disabled>}'"
          if [ -z "${SPA_ORIGINS_VAR:-}" ]; then
            echo "::warning::PORTH_SPA_ORIGINS is empty — the cookie path's CSRF/Origin gate will be OFF"
          fi

          # ── PORTH-587: auth/root_url — the DERIVED-SHAPE origin policy ──────
          # estyn_platform.oauth_proxy.origins.is_allowed() has two modes, chosen
          # by whether auth/root_url is present in the /porth/auth blob:
          #
          #   root_url ABSENT  → legacy mode. Exact string match against
          #                      auth/spa_origins. Every tenant subdomain would
          #                      have to be listed individually, so a wildcard
          #                      install refuses `return_to` for every tenant
          #                      host with "return_to not allowed".
          #   root_url PRESENT → derived mode. decompose() strips the root, the
          #                      bare root is the platform origin (allowed with
          #                      no lookup), and one label to its left is a
          #                      tenant resolved against the tenants table.
          #
          # This install is wildcard-shaped — template.yml has
          # CloudFrontApexAlias (platform) and CloudFrontAlias '*.<apex>'
          # (tenants) — so derived mode is the only one that can work, and
          # root_url is the apex.
          #
          # spa_origins is written as well and deliberately kept: it is ignored
          # while root_url is set, and leaving it in place means unsetting the
          # var is a working rollback to legacy mode rather than an install that
          # refuses every origin.
          #
          # Left unset, this whole block is a no-op and behaviour is unchanged —
          # single-host consumers stay on the legacy list.
          # PORTH-588: the VALUES are resolved here; the WRITING is not. These three
          # keys belong to `porth-install auth-config` (policy.MANAGED_KEYS), which
          # runs after the seed step below. This workflow no longer validates them
          # either — the package's policy module does, with fatal-vs-warning
          # semantics and a refusal to write a blob that would still be inert.
          ROOT_URL="${ROOT_URL_VAR:-}"
          if [ -n "$ROOT_URL" ]; then
            echo "Resolved root_url:    '$ROOT_URL' (derived-shape origin policy)"
          else
            echo "::warning::PORTH_ROOT_URL is unset — the origin policy stays on the LEGACY exact-match list."
            echo "::warning::Tenant subdomains will be refused with 'return_to not allowed' unless each is in PORTH_SPA_ORIGINS."
          fi
          echo "PORTH_ROOT_URL_RESOLVED=$ROOT_URL" >> "$GITHUB_ENV"
          # PORTH-656: the ADR-Z8 environments this install serves, declared once
          # in deploy/porth/environments.json and read from main. No repository
          # variable and no default here: one list, which `porth-install check`
          # verifies the install against at the end of this run.
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          ENVIRONMENTS=$(python3 scripts/environments.py list)
          echo "Declared environments: ${ENVIRONMENTS}"
          echo "PORTH_AUTH_ENVIRONMENTS_RAW=${ENVIRONMENTS}" >> "$GITHUB_ENV"

      - name: Pre-flight stack-state check
        id: preflight
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
          ALLOW_STACK_DELETE: ${{ inputs.allow_stack_delete }}
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Pre-flight stack status: $STATUS"

          # Robust delete: plain delete first; if it lands in DELETE_FAILED
          # (resources that can't be deleted — common after a ROLLBACK_FAILED),
          # retry retaining the stuck resources so the stack can be removed.
          robust_delete() {
            local s="$1"
            aws cloudformation delete-stack --stack-name "$s"
            if ! aws cloudformation wait stack-delete-complete --stack-name "$s" 2>/dev/null; then
              echo "::warning::Plain delete did not complete — retrying with --retain-resources"
              local stuck
              stuck=$(aws cloudformation list-stack-resources --stack-name "$s" \
                --query "StackResourceSummaries[?ResourceStatus=='DELETE_FAILED'].LogicalResourceId" \
                --output text 2>/dev/null || true)
              echo "Retaining stuck resources: ${stuck:-none}"
              if [ -n "$stuck" ]; then
                aws cloudformation delete-stack --stack-name "$s" --retain-resources $stuck
              else
                aws cloudformation delete-stack --stack-name "$s"
              fi
              aws cloudformation wait stack-delete-complete --stack-name "$s"
            fi
          }

          case "$STATUS" in
            DOES_NOT_EXIST)
              echo "🟢 Action: INSTALL — stack does not exist"
              echo "action=install" >> "$GITHUB_OUTPUT"
              ;;
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
              echo "🟢 Action: UPGRADE — stack in clean state ($STATUS)"
              echo "action=upgrade" >> "$GITHUB_OUTPUT"
              ;;
            REVIEW_IN_PROGRESS)
              # A CREATE change set was made but never executed, so the stack holds
              # NO resources. Deleting it is genuinely free and is the documented
              # recovery — it is the one delete in this block that cannot lose data,
              # so it needs no opt-in.
              echo "::warning::Stack is REVIEW_IN_PROGRESS (change set never executed, no resources) — deleting the empty shell"
              robust_delete "$STACK"
              echo "🟢 Action: INSTALL"
              echo "action=install" >> "$GITHUB_OUTPUT"
              ;;
            UPDATE_ROLLBACK_FAILED)
              # NEVER auto-delete this one. It is a stack that was LIVE and healthy,
              # whose update failed AND whose rollback then also failed. Deleting it
              # destroys a working installation. The supported recovery is to
              # continue the rollback, not to start again.
              echo "::error::Stack is UPDATE_ROLLBACK_FAILED — this workflow will NOT delete it."
              echo "::error::This state means a live stack failed to update and failed to roll back."
              echo "::error::Recover it in place:"
              echo "::error::  aws cloudformation continue-update-rollback --stack-name $STACK"
              echo "::error::If specific resources block the rollback, add:"
              echo "::error::  --resources-to-skip <LogicalId> [...]"
              echo "::error::Then re-run this workflow. Deleting a Porth stack is a ONE-WAY DOOR:"
              echo "::error::the DynamoDB tables and KMS keys are DeletionPolicy: Retain, so they"
              echo "::error::survive and their fixed names then block any recreate at"
              echo "::error::AWS::EarlyValidation::ResourceExistenceCheck."
              exit 1
              ;;
            ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED)
              # These are failed-CREATE states, where deleting is the standard (and
              # for ROLLBACK_COMPLETE, the only) recovery — CloudFormation refuses to
              # update a stack in them. But the retained tables and KMS keys outlive
              # the delete, so a "recreate" afterwards is not clean: the orphaned
              # fixed names block it. That makes this a decision, not a default.
              if [ "${ALLOW_STACK_DELETE:-false}" != "true" ]; then
                echo "::error::Stack is $STATUS. Recovery requires deleting and recreating it,"
                echo "::error::which this workflow will not do unless you ask for it explicitly."
                echo "::error::Re-run with allow_stack_delete=true if that is what you want."
                echo "::error::Before you do: the 8 Porth DynamoDB tables and 2 KMS keys are"
                echo "::error::DeletionPolicy: Retain. They SURVIVE the delete, and their fixed"
                echo "::error::names then block the recreate at change-set creation. Either adopt"
                echo "::error::them with an IMPORT change set, remove them, or install under a"
                echo "::error::different Environment value so the names do not collide."
                exit 1
              fi
              echo "::warning::Stack in $STATUS and allow_stack_delete=true — deleting and recreating"
              robust_delete "$STACK"
              echo "🟢 Action: INSTALL — recreating after cleanup"
              echo "action=install" >> "$GITHUB_OUTPUT"
              ;;
            *_IN_PROGRESS)
              echo "::error::Stack in non-terminal state ($STATUS) — investigate manually before re-running"
              exit 1
              ;;
            *)
              echo "::error::Stack in unexpected state ($STATUS)"
              exit 1
              ;;
          esac

      - name: Create change set
        id: changeset
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
          CFN_EXECUTION_ROLE_ARN: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.preflight.outputs.action }}" = "install" ]; then
            CS_TYPE="CREATE"
          else
            CS_TYPE="UPDATE"
          fi
          CHANGE_SET_NAME="porth-${{ steps.preflight.outputs.action }}-$(date -u +%Y%m%d-%H%M%S)"

          PARAMS=( "ParameterKey=Environment,ParameterValue=${{ env.EFF_ENV_NAME }}" )

          # ADR-Z8 (PORTH-530): EMS is a single-environment instance — the authorizer pins
          # every request to FixedEnvironment and IGNORES the X-Porth-Environment header.
          #
          # PORTH-557 (SAR 0.2.0): EnvironmentMode was REMOVED as a parameter. The
          # presence of a non-empty FixedEnvironment now *is* the mode, so the pair
          # can no longer disagree and the deploy-time Rule that policed them is gone.
          # Passing it is not merely redundant — CloudFormation rejects unknown
          # parameters, so change-set creation fails before anything is touched.
          PARAMS+=( "ParameterKey=FixedEnvironment,ParameterValue=${{ env.EFF_FIXED_ENV }}" )

          # PORTH-585 — log level, passed on EVERY install so the value is always
          # explicit in the change set rather than inherited from whatever the last
          # run happened to leave behind. Both template parameters take the same
          # value: AuthorizerLogLevel drives the authorizer, ApiLogLevel drives BOTH
          # the API and the auth-proxy Lambdas, and there is no diagnosis where you
          # want one of the three turned up and not the others.
          #
          # LOG_LEVEL is read at MODULE LOAD (lambdas/*/handler.py), so a change
          # takes effect on the next cold start, not on the next request. The
          # env-var update replaces the function config, which forces one anyway.
          #
          # This is also what stops a same-version re-install being a no-op: the
          # change set has a real parameter diff, so it will execute.
          PARAMS+=( "ParameterKey=AuthorizerLogLevel,ParameterValue=${{ env.EFF_LOG_LEVEL }}" )
          PARAMS+=( "ParameterKey=ApiLogLevel,ParameterValue=${{ env.EFF_LOG_LEVEL }}" )
          echo "Log level: ${{ env.EFF_LOG_LEVEL }} (authorizer + api + auth-proxy)"

          # PORTH-655: the browser gateway cache (Porth >= 0.4.16 has the parameter;
          # CloudFormation rejects an unknown one, so older releases get nothing).
          if scripts/porth-version-at-least.sh 0.4.16 "${{ env.EFF_PORTH_VERSION }}"; then
            PARAMS+=( "ParameterKey=BrowserGatewayCacheTtl,ParameterValue=${{ env.EFF_BROWSER_CACHE_TTL }}" )
            echo "Browser gateway cache: ${{ env.EFF_BROWSER_CACHE_TTL }} s"
          fi

          # PORTH-655: no AuthTestToken. The static-token bypass is gone from Porth
          # (0.4.14 removes the parameter, so passing it would fail the change set).
          # GitHubRepoOwner intentionally omitted → CreateDeployRole condition stays false.

          # PORTH-655: no shared host. AcmCertificateArn/ApiDomainName are not passed,
          # so HasCustomDomain is false and CloudFormation deletes the old
          # porth-api.{zone} DomainName + ApiMapping. DnsZone (dot-less) is still
          # passed: the authorizer derives tenant origins from it.
          if [ -n "${PORTH_DNS_ZONE:-}" ]; then
            PARAMS+=( "ParameterKey=DnsZone,ParameterValue=${PORTH_DNS_ZONE}" )
          fi
          echo "Shared Porth API host: retired (tenant API hosts only)"

          # PORTH-556 (SAR 0.2.0): SpaOrigins was REMOVED as a parameter. The authorizer
          # DERIVES its Origin allow-list from root_url + environments in the
          # /porth/auth blob.
          #
          # PORTH-588 — this comment used to claim the "Seed OAuth-proxy config blob"
          # step writes root_url + environments. It never did, and believing it cost a
          # broken login and a wrong diagnosis ("the blob must predate 0.2.0" — it did
          # not; it was rewritten on every install, without those keys). Those three
          # keys are written by the "Conform the auth config blob" step, via
          # `porth-install auth-config`. The seed step writes spa_origins from
          # PORTH_SPA_ORIGINS, which is the LEGACY fallback and is only consulted when
          # root_url is absent.
          #
          # PORTH_SPA_ORIGINS_RAW is therefore still required. Passing SpaOrigins as a
          # parameter would fail change-set creation on an unknown parameter.
          if [ -z "${PORTH_SPA_ORIGINS_RAW:-}" ]; then
            echo "::warning::PORTH_SPA_ORIGINS is empty — the cookie path's CSRF/Origin gate will be OFF"
          else
            echo "SPA origins (via /porth/auth, no longer a stack parameter): ${PORTH_SPA_ORIGINS_RAW}"
          fi

          # CFN_EXECUTION_ROLE_ARN is optional. When set, CloudFormation assumes this
          # role for all resource operations (recommended for least-privilege). When absent,
          # CloudFormation uses the calling OIDC role (porth-install-role) directly.
          ROLE_ARGS=()
          if [ -n "${CFN_EXECUTION_ROLE_ARN:-}" ]; then
            ROLE_ARGS=("--role-arn" "$CFN_EXECUTION_ROLE_ARN")
            echo "CloudFormation execution role: $CFN_EXECUTION_ROLE_ARN"
          else
            echo "ℹ️  AWS_CFN_EXECUTION_ROLE_ARN not set — CloudFormation will use the calling role directly"
          fi

          echo "Creating $CS_TYPE change set: $CHANGE_SET_NAME"
          CHANGE_SET_ID=$(aws cloudformation create-change-set \
            --stack-name "$STACK" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CS_TYPE" \
            --template-url "${{ steps.release.outputs.template_url }}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            "${ROLE_ARGS[@]}" \
            --parameters "${PARAMS[@]}" \
            --query 'Id' --output text)
          echo "change_set_id=$CHANGE_SET_ID" >> "$GITHUB_OUTPUT"
          echo "Created change set: $CHANGE_SET_ID"

          set +e
          aws cloudformation wait change-set-create-complete --change-set-name "$CHANGE_SET_ID"
          WAIT_RC=$?
          set -e

          if [ "$WAIT_RC" -ne 0 ]; then
            DESCRIBE=$(aws cloudformation describe-change-set \
              --change-set-name "$CHANGE_SET_ID" \
              --query '{Status:Status,StatusReason:StatusReason}' --output json 2>/dev/null || echo '{}')
            echo "$DESCRIBE"
            REASON=$(echo "$DESCRIBE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StatusReason") or "")' 2>/dev/null || echo "")
            if echo "$REASON" | grep -qi "didn't contain changes\|no changes\|No updates"; then
              echo "✅ Action: NO-OP — stack already at the requested version"
              echo "no_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Change set creation failed: $REASON"
              exit "$WAIT_RC"
            fi
          fi

      - name: Inspect change set for destructive DynamoDB actions
        if: steps.changeset.outputs.no_changes != 'true'
        run: |
          set -euo pipefail
          CHANGES=$(aws cloudformation describe-change-set \
            --change-set-name "${{ steps.changeset.outputs.change_set_id }}" \
            --query 'Changes[?ResourceChange.ResourceType==`AWS::DynamoDB::Table`].ResourceChange.{Id:LogicalResourceId,Action:Action,Replacement:Replacement}' \
            --output json)
          echo "DynamoDB table changes in change set: $CHANGES"
          DESTRUCTIVE=$(echo "$CHANGES" | python3 -c 'import json, sys; changes = json.load(sys.stdin) or []; bad = [c for c in changes if c.get("Action") == "Remove" or c.get("Replacement") == "True"]; print(json.dumps(bad))')
          if [ "$DESTRUCTIVE" != "[]" ]; then
            echo "::error::Change set would Remove or Replace DynamoDB tables — aborting to protect data (ADR-Z1/Z2)."
            echo "Destructive changes: $DESTRUCTIVE"
            exit 1
          fi
          echo "✅ No destructive DynamoDB table changes in change set"

      - name: Execute change set
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
        run: |
          set -euo pipefail
          if [ "${{ steps.changeset.outputs.no_changes }}" = "true" ]; then
            echo "No changes — skipping execute."
            exit 0
          fi
          aws cloudformation execute-change-set \
            --change-set-name "${{ steps.changeset.outputs.change_set_id }}"

          set +e
          if [ "${{ steps.preflight.outputs.action }}" = "install" ]; then
            aws cloudformation wait stack-create-complete --stack-name "$STACK"
          else
            aws cloudformation wait stack-update-complete --stack-name "$STACK"
          fi
          WAIT_RC=$?
          set -e

          if [ "$WAIT_RC" -ne 0 ]; then
            echo "::warning::Stack waiter failed (rc=$WAIT_RC) — capturing failed stack events"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK" \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`)] | [:20].{Time:Timestamp,LogicalId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output json || true
            exit "$WAIT_RC"
          fi
          echo "✅ Stack $STACK reached terminal state for ${{ steps.preflight.outputs.action }}"

      - name: Resolve Porth stack outputs
        id: tables
        env:
          STACK: ${{ env.EFF_STACK_NAME }}
        run: |
          set -euo pipefail
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text 2>/dev/null || echo ""
          }
          PORTH_API_URL=$(get_output PorthApiUrl)
          TENANTS_TABLE=$(get_output TenantsTableName)
          PERMISSIONS_TABLE=$(get_output PermissionsTableName)
          ROLES_TABLE=$(get_output RolesTableName)
          CLAIM_TABLE=$(get_output ClaimMappingConfigsTableName)
          EXECUTE_API_URL=$(get_output ApiEndpoint)
          APIGW_REGIONAL_DOMAIN=$(get_output ApiGatewayRegionalDomainName)
          APIGW_REGIONAL_HZ=$(get_output ApiGatewayRegionalHostedZoneId)
          # PORTH-530: the ADR-Z9 BFF session spine — needed by the /porth/auth blob.
          SESSIONS_TABLE=$(get_output SessionsTableName)
          SESSION_KMS=$(get_output SessionKmsKeyArn)

          MISSING=""
          require() {
            if [ -z "$2" ] || [ "$2" = "None" ]; then MISSING="$MISSING $1"; fi
          }
          require PorthApiUrl "$PORTH_API_URL"
          require TenantsTableName "$TENANTS_TABLE"
          require PermissionsTableName "$PERMISSIONS_TABLE"
          require RolesTableName "$ROLES_TABLE"
          require ClaimMappingConfigsTableName "$CLAIM_TABLE"
          if [ -n "$MISSING" ]; then
            echo "::error::porth-components stack is missing expected outputs:$MISSING"
            exit 1
          fi

          echo "PORTH_API_URL=$PORTH_API_URL"                               >> "$GITHUB_ENV"
          echo "PORTH_EXECUTE_API_URL=$EXECUTE_API_URL"                     >> "$GITHUB_ENV"
          echo "PORTH_TENANTS_TABLE=$TENANTS_TABLE"                         >> "$GITHUB_ENV"
          echo "PORTH_PERMISSIONS_TABLE=$PERMISSIONS_TABLE"                 >> "$GITHUB_ENV"
          echo "PORTH_ROLES_TABLE=$ROLES_TABLE"                             >> "$GITHUB_ENV"
          echo "PORTH_CLAIM_MAPPING_CONFIGS_TABLE=$CLAIM_TABLE"             >> "$GITHUB_ENV"
          echo "PORTH_SESSIONS_TABLE=$SESSIONS_TABLE"                       >> "$GITHUB_ENV"
          echo "PORTH_SESSION_KMS=$SESSION_KMS"                             >> "$GITHUB_ENV"
          echo "APIGW_REGIONAL_DOMAIN=$APIGW_REGIONAL_DOMAIN"               >> "$GITHUB_ENV"
          echo "APIGW_REGIONAL_HZ=$APIGW_REGIONAL_HZ"                       >> "$GITHUB_ENV"

          # Step outputs for the bootstrap job — different role, fresh runner, so GITHUB_ENV
          # does not reach it.
          # One scope per ADR-Z8 environment (PORTH-627). This was
          # EFF_FIXED_ENV, a single pinned slot; with the pin gone that is empty
          # and the platform tenant would be written under ENV##… — a key the
          # authorizer never looks for, so no operator could sign in anywhere.
          #
          # A JSON array because the bootstrap runs as a matrix over it: the
          # platform tenant is per environment, like every other row.
          if [ -z "${PORTH_AUTH_ENVIRONMENTS_RAW:-}" ]; then
            echo "❌ No environments configured, so the platform tenant would be"
            echo "❌ written nowhere and no operator could sign in to any"
            echo "❌ environment. Declare them in deploy/porth/environments.json."
            exit 1
          fi
          ENV_SCOPES=$(printf '%s' "$PORTH_AUTH_ENVIRONMENTS_RAW" \
            | python3 -c 'import json,sys; print(json.dumps([e.strip() for e in sys.stdin.read().split(",") if e.strip()]))')

          {
            echo "env_scopes=${ENV_SCOPES}"
            echo "tenants_table=$TENANTS_TABLE"
            echo "permissions_table=$PERMISSIONS_TABLE"
            echo "roles_table=$ROLES_TABLE"
            echo "claim_mapping_table=$CLAIM_TABLE"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Resolved Porth outputs (API: $PORTH_API_URL, execute-api: $EXECUTE_API_URL)"
          if [ -n "$SESSIONS_TABLE" ] && [ "$SESSIONS_TABLE" != "None" ]; then
            echo "✅ BFF session spine: sessions table $SESSIONS_TABLE"
          else
            echo "::warning::SessionsTableName not exported — the BFF may not be present in this Porth version"
          fi

      - name: Remove the retired shared-host alias (porth-api.{zone})
        # PORTH-655: the shared Porth API host is retired; its custom domain goes
        # with this change set. The alias pointed at it is deleted here — exactly
        # that one record, and only if it exists. Warn-don't-fail: DNS hygiene
        # must not fail an install.
        continue-on-error: true
        env:
          RETIRED_HOST: ${{ vars.API_DOMAIN_NAME || vars.PORTH_API_DOMAIN_NAME || format('porth-api.{0}', vars.DNS_ZONE) }}
        run: scripts/remove-retired-porth-api-dns.sh "$RETIRED_HOST"

      # ── Seed the OAuth-proxy config blob (/porth/auth) — PORTH-530 ──────────
      # PORTH-479: the BFF proxy (estyn_platform.config, prefix /porth) reads this
      # JSON blob at request time. Without it the proxy is INERT — no browser login
      # completes. custom_domain drives the /auth/callback URL (must be registered in
      # Auth0); cookie_domain is the ZONE-level .<DnsZone> (env is a data axis, not the
      # cookie). sessions_table + kms come from the stack outputs above. spa_origins is
      # sourced from the SAME PORTH_SPA_ORIGINS var as the authorizer's SpaOrigins param,
      # so the two cannot drift.
      # PORTH-530: the IdP half of this blob comes from SSM /porth/config/testbed
      # (`platform.idp`), not from GitHub secrets. Identity configuration belongs in the
      # account it authenticates against — this repo is public, and a repo secret is
      # unversioned, unaudited, and masked in logs only when it is the exact literal value.
      # The rest of the blob stays derived from the stack outputs and the install vars,
      # because it describes the stack's shape rather than the identity provider.
      #
      # NOT continue-on-error. Without this blob the BFF proxy is completely inert — no
      # browser login completes — so swallowing a failure here produces a green install that
      # cannot authenticate anyone, with nothing in the log saying so.
      - name: Seed OAuth-proxy config blob (/porth/auth)
        run: |
          set -euo pipefail
          if [ -z "${PORTH_DNS_ZONE:-}" ]; then
            echo "::error::DNS_ZONE is unset — /porth/auth cannot be built and the proxy would stay inert"
            exit 1
          fi

          # --with-decryption so the parameter works as String or SecureString.
          MANIFEST=$(aws ssm get-parameter --name /porth/config/testbed --with-decryption \
            --query Parameter.Value --output text --region "$AWS_REGION" 2>/dev/null || echo "")
          if [ -z "$MANIFEST" ]; then
            echo "::error::/porth/config/testbed is absent — it holds the platform IdP config."
            echo "::error::Create it with:"
            echo "::error::  aws ssm put-parameter --name /porth/config/testbed --type SecureString --value file://manifest.json"
            exit 1
          fi

          # PORTH-598: the builder lives in deploy/porth/scripts/. It used to be a
          # python3 -c '...' here — a single-quoted shell string containing Python
          # containing JSON. An apostrophe in one of its comments ended the shell
          # string and broke the deploy (PORTH-589); the error read as a bash
          # syntax error pointing at a parenthesis.
          # PORTH-656: the live blob, so the builder can carry the managed keys
          # (root_url, environments, tenant_origins) over instead of dropping
          # them for the seconds until auth-config writes them back.
          EXISTING_AUTH_BLOB=$(aws ssm get-parameter --name /porth/auth \
            --query Parameter.Value --output text --region "$AWS_REGION" 2>/dev/null || echo "")
          BLOB=$(
            MANIFEST="$MANIFEST" \
            EFF_FIXED_ENVIRONMENT="$EFF_FIXED_ENV" \
            EXISTING_AUTH_BLOB="$EXISTING_AUTH_BLOB" \
            python3 deploy/porth/scripts/build_auth_blob.py
          )

          echo "→ writing /porth/auth blob"
          aws ssm put-parameter --name /porth/auth --type String --overwrite \
            --value "$BLOB" --region "$AWS_REGION"
          echo "✅ Seeded /porth/auth (issuer $(echo "$BLOB" | python3 -c 'import json,sys; print(json.load(sys.stdin)["issuer"])'))"
          echo "   (origin policy keys carried over from the live blob; the next step conforms them)"

      # ── Conform the origin policy — PORTH-588 ───────────────────────────────
      # root_url / environments / tenant_origins are policy.MANAGED_KEYS, owned by
      # `porth-install auth-config`. It ships WITH the Porth release, so the rules
      # for what a given version needs travel with that version instead of being
      # copied into each consumer's pipeline and drifting — which is exactly how
      # PORTH-550 happened (a session-policy index three releases stale, silently).
      #
      # It reads the blob, changes only the keys it owns, reports the rest as
      # "left alone", and refuses to write at all if the result would still be
      # inert. Re-running with no change is a no-op that prints "already conforms",
      # so this doubles as a conformance check on every install.
      #
      # ORDER MATTERS: the step above REWRITES the whole blob, so this must follow
      # it. Reversed, the seed would erase the managed keys on the next install and
      # the origin policy would silently revert to legacy.
      - name: Conform the auth config blob (porth-install auth-config)
        env:
          CA_DOMAIN: porth
          CA_REPO: porth-py
          # The Porth publisher account, which owns the CodeArtifact domain. Same
          # account as the release bucket above.
          CA_OWNER: ${{ vars.PORTH_CODEARTIFACT_OWNER || '084847995635' }}
        run: |
          set -euo pipefail

          if [ -z "${PORTH_ROOT_URL_RESOLVED:-}" ]; then
            echo "::warning::PORTH_ROOT_URL is unset — skipping auth-config."
            echo "::warning::The origin policy stays on the LEGACY exact-match list and tenant subdomains will be refused."
            exit 0
          fi

          # Cross-account consume from the publisher's CodeArtifact domain. This
          # is the same package the Porth release itself is built from, so the
          # consumer cannot end up running upgrade logic from a different version
          # than the release it just installed.
          aws codeartifact login \
            --tool pip \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_OWNER" \
            --repository "$CA_REPO" \
            --region "$AWS_REGION"
          # Pinned, not floating. `pip install porth-install` takes whatever is
          # latest THAT IT CAN RESOLVE, and on 2026-08-18 that silently meant an
          # old one: 0.2.3 requires porth-common>=0.0.6, 0.0.6 had not been
          # published yet, so pip backtracked to 0.2.1 — whose floor it could
          # satisfy — and installed that. The symptom was
          #
          #   porth-install: error: argument command: invalid choice: 'migrate-keys'
          #
          # which reads as a broken workflow rather than an unpublished
          # dependency, and it survived a re-run because nothing about it was
          # transient. A pin turns that into "no matching distribution", which
          # names the real problem.
          #
          # Bump this deliberately when a new porth-install is published.
          pip install --quiet "porth-install==${PORTH_INSTALL_VERSION}"
          echo "porth-install $(pip show porth-install | awk '/^Version:/ {print $2}')"

          # Dry run first: the plan is the audit trail. It names every key that
          # changes, old value to new, and everything deliberately left alone.
          echo "── plan ──"
          porth-install auth-config \
            --root-url "$PORTH_ROOT_URL_RESOLVED" \
            --environments "${PORTH_AUTH_ENVIRONMENTS_RAW:-}" \
            --dry-run

          echo "── apply ──"
          porth-install auth-config \
            --root-url "$PORTH_ROOT_URL_RESOLVED" \
            --environments "${PORTH_AUTH_ENVIRONMENTS_RAW:-}"

      # ── Porth's permissions match this release's catalogue ─────────────────
      # PORTH-656. Before the migrations, because the 0.4.1 catalogue migration
      # lets a record already at the new key supersede every per-tenant copy:
      # reconciled first, Porth's own permissions collapse without comparison.
      # Per declared environment. Registration only: retired permissions are
      # listed (and, with prune_retired, removed) by the reconcile job after the
      # bootstrap, so nothing the bootstrap writes can outlive them.
      - name: Reconcile Porth's permissions (porth-install reconcile-permissions)
        env:
          ENV_NAME: ${{ env.EFF_ENV_NAME }}
          ENV_SCOPES: ${{ steps.tables.outputs.env_scopes }}
          PRUNE: skip
        run: scripts/porth-reconcile-permissions.sh

      # ── Data migrations (porth-install migrate-keys) ───────────────────────
      # PORTH-605. This runs on EVERY install and upgrade, because that is what
      # migrations.py is built for: each migration scans, asks each row whether
      # it already conforms, and fixes only the ones that do not. There is no
      # "has this run?" state anywhere — the data IS the state — so re-running a
      # converged install is a scan that writes nothing.
      #
      # It was briefly a hand-dispatched task in porth-admin.yml. That was the
      # wrong home: it made an upgrade step something a person had to remember,
      # on exactly the installs nobody is sure about, which is the situation the
      # convergence design exists to survive.
      #
      # Placement matters more than anything else here. This sits AFTER "Execute
      # change set", so the stack is already running code that reads
      # tenant-leading keys (PORTH-604). The reverse order — data moved while the
      # old code is live — is the failure this whole sequence is arranged to
      # avoid: every read misses, every role resolves zero permissions, and the
      # install reports success.
      #
      # No continue-on-error. A migration that cannot key a row stops with that
      # row named and writes nothing; carrying on would leave an install that
      # passed its pipeline and is not isolated.
      - name: Run data migrations (porth-install migrate-keys)
        env:
          CA_DOMAIN: porth
          CA_REPO: porth-py
          CA_OWNER: ${{ vars.PORTH_CODEARTIFACT_OWNER || '084847995635' }}
          # EFF_ENV_NAME is what every other step in this workflow uses (see the
          # change-set parameters); inventing a second source for the same value
          # is how the table-name suffix drifts.
          ENV_NAME: ${{ env.EFF_ENV_NAME }}
        run: |
          set -euo pipefail

          # Empty would build "porth-roles-" and fail somewhere less obvious.
          if [ -z "${ENV_NAME:-}" ]; then
            echo "::error::EFF_ENV_NAME is empty — cannot resolve the table names."
            exit 1
          fi

          if [ -z "${EFF_PORTH_VERSION:-}" ]; then
            echo "::error::EFF_PORTH_VERSION is empty — refusing to run migrations"
            echo "::error::without knowing which release is being installed."
            exit 1
          fi

          aws codeartifact login --tool pip \
            --domain "$CA_DOMAIN" --domain-owner "$CA_OWNER" \
            --repository "$CA_REPO" --region "${AWS_REGION}"
          pip install --quiet "porth-install==${PORTH_INSTALL_VERSION}"

          # Dry run first, for the same reason auth-config does: the plan is the
          # audit trail. It names every key that moves, old value to new.
          # --target-version is the safety gate, not a convenience (PORTH-606).
          # A migration is only correct once the code that can READ its output is
          # running, so an install of an older release must not carry it. Without
          # this, dispatching an old porth_version (e.g. 0.2.0) would deploy
          # code that reads ENV#e#ROLE#{id} and then re-key every row to
          # ENV#e#TENANT#t#ROLE#{id} — every read missing, on a stack that just
          # reported success. That very dispatch happened; an unrelated
          # change-set failure is the only reason it did not.
          #
          # No --installed-version: omitted means "unknown", which considers
          # every migration up to the target. Convergence makes that affordable,
          # and an install nobody can date is the one most likely to be behind.
          echo "── plan ──"
          porth-install migrate-keys \
            --roles-table "porth-roles-${ENV_NAME}" \
            --users-table "porth-users-${ENV_NAME}" \
            --permissions-table "porth-permissions-${ENV_NAME}" \
            --claim-mapping-configs-table "porth-claim-mapping-configs-${ENV_NAME}" \
            --target-version "${EFF_PORTH_VERSION}" \
            --dry-run

          echo "── apply ──"
          porth-install migrate-keys \
            --roles-table "porth-roles-${ENV_NAME}" \
            --users-table "porth-users-${ENV_NAME}" \
            --permissions-table "porth-permissions-${ENV_NAME}" \
            --claim-mapping-configs-table "porth-claim-mapping-configs-${ENV_NAME}" \
            --target-version "${EFF_PORTH_VERSION}"

      # ── The policy documents (auth-policy + auth-session-policy) ────────────
      # Without them the authorizer cannot resolve a binding or a policy and
      # every authorised route denies. continue-on-error: if `policies apply`
      # refuses (an invalid document) or the role lacks an SSM permission, the
      # documents already live are left untouched — the step's log says why —
      # and the rest of the install carries on.
      - name: Write the policy documents (porth-install policies apply)
        continue-on-error: true
        run: |
          ENV="${{ env.EFF_ENV_NAME }}"

          # PORTH-627 — the second axis, and it is NOT this one. ENV is the
          # configuration axis: it selects /porth/{branch}/… and names Porth's
          # own roles, which Porth's stack deploys from its Environment
          # parameter. ENV_SLOT is the ADR-Z8 environment: it names EMS's
          # resources, which the sample-app stack deploys from EnvironmentSlot.
          #
          # They were one placeholder while both read `dev`. EMS's roles are now
          # ems-sample-app-tenant-porth-sample and Porth's are still
          # porth-tenant-dev, so one value cannot render both — the authorizer
          # would assume a role that does not exist and every request would fail
          # at the assume, not at anything that names the mistake.
          # Every ADR-Z8 environment this install serves. The session-policy
          # index needs one rule and one binding per environment, because the
          # authorizer substitutes ${role_type}, {account} and {region} into a
          # role ARN and NOTHING else — there is no $env, so one binding cannot
          # answer for two.
          ENV_SLOTS="${PORTH_AUTH_ENVIRONMENTS_RAW:-porth-sample}"

          # PORTH-655: both policy documents and their templates come from
          # deploy/porth/ through `porth-install policies apply`, which renders
          # session-policy/index.template.json over ENV_SLOTS, validates both
          # documents together (every binding has an auth-policy prefix, every
          # template exists, the index parses) and writes nothing if anything is
          # wrong. It replaces hand-written put-parameter calls that nothing
          # checked. docs/INSTALL.md §3e in Components.
          #
          # The index is "path_basis": "as_sent" — Porth's routes are keyed
          # /porth/..., the app's /sample, /mcp, /suppliers. API Gateway removes
          # the mapping key before the authorizer runs (/porth/users/me arrives
          # as /users/me); Porth 0.4.19 puts it back from the account's API
          # mappings. 0.4.17/0.4.18 read as_sent but cannot restore the key, so
          # every keyed route denied (2026-11-08, #168). Refuse below 0.4.19.
          if ! scripts/porth-version-at-least.sh 0.4.19 "${{ env.EFF_PORTH_VERSION }}"; then
            echo "::error::deploy/porth/ is path_basis \"as_sent\", which needs Porth >= 0.4.19 (installing ${{ env.EFF_PORTH_VERSION }})."
            exit 1
          fi
          # IAM existence is not checked here (--no-check-iam): this role has no
          # iam:GetRole. A binding naming a role that does not exist fails at the
          # assume, which the authorizer logs by name.
          porth-install policies apply \
            --dir deploy/porth \
            --branch "$ENV" \
            --environments "$ENV_SLOTS" \
            --no-check-iam \
            --dry-run
          porth-install policies apply \
            --dir deploy/porth \
            --branch "$ENV" \
            --environments "$ENV_SLOTS" \
            --no-check-iam

          # PORTH-655: the auth test token is gone from Porth. Remove the SSM
          # fallback it was seeded into, if an earlier install left it.
          if aws ssm get-parameter --name "/porth/${ENV}/auth-test-token" \
               --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ssm delete-parameter --name "/porth/${ENV}/auth-test-token" --region "$AWS_REGION" \
              && echo "🗑️  deleted /porth/${ENV}/auth-test-token" \
              || echo "::warning::could not delete /porth/${ENV}/auth-test-token — delete it by hand"
          else
            echo "✅ no /porth/${ENV}/auth-test-token"
          fi

      - name: Smoke test Porth API
        run: |
          # Use raw execute-api URL so smoke test works before DNS record exists
          SMOKE_URL="${PORTH_EXECUTE_API_URL:-$PORTH_API_URL}"
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "${SMOKE_URL}/health" || echo "000")
          if [[ "$STATUS" == "200" ]]; then
            echo "✅ Smoke test passed (GET /health → 200)"
          else
            echo "::warning::Smoke test: GET /health → HTTP $STATUS (non-fatal)"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Porth install/upgrade summary"
            echo ""
            echo "- **Action:** ${{ steps.preflight.outputs.action }}"
            echo "- **No-op:** ${{ steps.changeset.outputs.no_changes || 'false' }}"
            echo "- **Target version:** ${{ env.EFF_PORTH_VERSION }}"
            echo "- **Stack:** ${{ env.EFF_STACK_NAME }}"
            echo "- **Environment param:** ${{ env.EFF_ENV_NAME }}"
            echo "- **Env mode:** ${{ env.EFF_FIXED_ENV == '' && 'MULTI (FixedEnvironment empty)' || format('single (FixedEnvironment=`{0}`)', env.EFF_FIXED_ENV) }}"
            echo "- **Environments:** ${PORTH_AUTH_ENVIRONMENTS_RAW:-'(none)'}"
            echo "- **Log level:** \`${{ env.EFF_LOG_LEVEL }}\` (authorizer + api + auth-proxy)"
            echo "- **Porth API URL:** ${PORTH_API_URL:-'(unresolved)'}"
            echo "- **Shared Porth API host:** retired (tenant API hosts only)"
            echo "- **SPA origins:** ${PORTH_SPA_ORIGINS_RAW:-'(unset — origin gate OFF)'}"
            echo ""
            echo "### Next steps"
            echo "- Seed test tenants via the (separate) porth-seed-testbed workflow"
            echo "- Then run the PORTH-494 security suite against this install"
          } >> "$GITHUB_STEP_SUMMARY"

  # Own job so it runs under the bootstrap role — a job has exactly one environment, and this
  # one can write the Porth tables but cannot touch CloudFormation, SAR, or Route 53.
  # Deliberately last: every other step needs the install role, and the platform tenant is
  # independent of the CloudFormation stack.
  bootstrap:
    name: Bootstrap platform tenant
    needs: install-or-upgrade
    uses: ./.github/workflows/porth-bootstrap.yml
    # Once per environment (PORTH-627). The platform tenant is a row like any
    # other and rows are keyed ENV#{environment}#…, so an operator can only sign
    # in to an environment whose platform tenant exists. One bootstrap left the
    # second environment with no way in — and nothing to say so, because the
    # authorizer simply fails to resolve a tenant.
    #
    # fail-fast off: the environments are independent, and one failing should
    # not cancel a bootstrap that would have succeeded.
    strategy:
      fail-fast: false
      matrix:
        env_scope: ${{ fromJSON(needs.install-or-upgrade.outputs.env_scopes) }}
    with:
      # ADR-Z8 (PORTH-532): rows are written ENV#{scope}#… or the authorizer
      # will never resolve the platform tenant.
      env_scope: ${{ matrix.env_scope }}
      tenants_table: ${{ needs.install-or-upgrade.outputs.tenants_table }}
      permissions_table: ${{ needs.install-or-upgrade.outputs.permissions_table }}
      roles_table: ${{ needs.install-or-upgrade.outputs.roles_table }}
      claim_mapping_table: ${{ needs.install-or-upgrade.outputs.claim_mapping_table }}

  # ── PORTH-656: is the install complete for every declared environment? ────
  # Read-only, and last: it checks what the steps above wrote, including each
  # environment's platform tenant. ERROR (configuration) fails the run; WARN
  # (one tenant's data — no org id, an org not named for its tenant — and, with
  # porth-install ≥ 0.4.7, legacy data: rows a key migration would still
  # rewrite, permissions Porth no longer ships, grants to missing keys, each
  # naming its fix) is named and does not. The Auth0 checks run when AUTH0_MGMT_CLIENT_ID and
  # AUTH0_MGMT_CLIENT_SECRET are set on the porth-install environment (a
  # Management API app with read:clients and read:organizations); without
  # them the output says they were skipped.
  # PORTH-656: after the bootstrap (which creates the platform tenant and its
  # platform-admin role but writes no permissions), make every environment's
  # permissions match this release, and list — or, with prune_retired, remove —
  # what Porth no longer ships. See porth-reconcile.yml.
  reconcile:
    name: Reconcile Porth's permissions
    needs: [install-or-upgrade, bootstrap]
    if: ${{ !cancelled() && needs.install-or-upgrade.result == 'success' }}
    uses: ./.github/workflows/porth-reconcile.yml
    with:
      env_scopes: ${{ needs.install-or-upgrade.outputs.env_scopes }}
      environment_name: ${{ inputs.environment_name || 'dev' }}
      porth_install_version: ${{ needs.install-or-upgrade.outputs.porth_install_version }}
      prune_retired: ${{ inputs.prune_retired }}

  check:
    name: Check the install against the declared environments
    needs: [install-or-upgrade, bootstrap, reconcile]
    if: ${{ !cancelled() && needs.install-or-upgrade.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: porth-install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: porth-install check
        env:
          CA_DOMAIN: porth
          CA_REPO: porth-py
          CA_OWNER: ${{ vars.PORTH_CODEARTIFACT_OWNER || '084847995635' }}
          AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
          PORTH_ENV_NAME: ${{ inputs.environment_name || 'dev' }}
          # The release's own porth-install (from its manifest), so check
          # carries every data and configuration check that release ships.
          PORTH_INSTALL_CHECK_VERSION: ${{ needs.install-or-upgrade.outputs.porth_install_version }}
          EFF_PORTH_VERSION: ${{ inputs.porth_version || '0.4.19' }}
        run: scripts/porth-install-check.sh
