name: Seed sample app data

# PORTH-586. The app's table is filled by the EventBridge consumer from Porth
# entity events, so a tenant provisioned before that consumer existed has
# nothing and never will — its pages render empty, which looks exactly like
# broken. This puts records in front of a tester.
#
# Dispatch-only and additive: it writes new rows and removes nothing, so running
# it twice gives more data rather than a different outcome.

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: >
          Tenant to seed. Records are written under pk=TENANT#{id}, which is the
          same partition the app's queries read — so this must be a tenant that
          actually logs in, or the data will be invisible to it.
        required: true
      count:
        description: 'How many of each record type (invoices, bills, approvals)'
        required: false
        default: '5'
      porth_environment:
        description: 'Table suffix — porth-sample-app-{this}. Not the ADR-Z8 slot.'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    name: Seed ${{ inputs.tenant_id }}
    runs-on: ubuntu-latest
    environment: sample-app-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet boto3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Seed
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          SEED_COUNT: ${{ inputs.count }}
          PORTH_ENVIRONMENT: ${{ inputs.porth_environment }}
          AWS_REGION: us-east-1
        run: python3 scripts/seed_sample_data.py
