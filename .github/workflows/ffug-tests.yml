name: ffug — unit tests

# ffug is the ADR-Z11 UAT compute target (PORTH-555, PORTH-587). Its suite has
# to be green on the PR, not only on the merge-to-main deploy — the epic's
# review model gates each slice on a linked green run (evidence checkpoint).
#
# Deliberately separate from deploy.yml: that workflow deploys, and PR-triggering
# a deploy would be the wrong fix.

on:
  pull_request:
    paths:
      - 'lambdas/ffug/**'
      - 'lambdas/requirements.txt'
      # PORTH-587 — the suite now asserts against the template, because the
      # half of this slice that does the isolating is IAM and never appears in
      # a code diff. A template change that quietly restores ffug's ambient
      # DynamoDB grant has to fail here, on the PR that makes it.
      - 'template.yml'
      - '.github/workflows/ffug-tests.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: ffug unit tests
    runs-on: ubuntu-latest
    # PORTH-587 — this job needs AWS now, which it did not before.
    #
    # porth-common is published to the Porth CodeArtifact repository and not to
    # PyPI, and since Phase B ffug imports it directly: the Director, the
    # envelope errors and the tenant-lifecycle contract are the things under
    # test. Stubbing them to keep the job credential-free would mean asserting
    # against a fake of the very library whose behaviour is the subject.
    #
    # It reuses the deploy environment's role rather than declaring a narrower
    # one, which is the trade worth naming: a pull_request run from a branch in
    # THIS repo can see it. Forks cannot — GitHub withholds environment values
    # from fork PRs — but a minimal CodeArtifact-read role for CI is the right
    # end state and is a follow-up, not this slice.
    environment: sample-app-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `login --tool pip` sets a global index-url, so everything resolves
      # through porth-py — which proxies PyPI, so pytest and pyyaml come through
      # it too. Without this the install fails on
      #   ERROR: Could not find a version that satisfies the requirement porth-common
      # which reads as a bad version pin rather than an unconfigured index.
      - name: Configure pip for CodeArtifact (porth-common)
        run: |
          set -euo pipefail
          aws codeartifact login --tool pip \
            --domain porth --domain-owner 084847995635 \
            --repository porth-py --region "$AWS_REGION"

      - name: Install test dependencies
        working-directory: lambdas
        # requirements.txt, not a curated list — the lesson PORTH-614 cost a
        # broken pipeline to learn. A hand-listed set is a second statement of
        # requirements.txt and drifts the moment the Lambda gains a dependency.
        # pyyaml is for the template assertions, which are not a runtime need.
        run: python -m pip install --quiet -r requirements.txt pytest pyyaml

      - name: Run ffug tests
        working-directory: lambdas
        # The IAM-legality guard that used to live inline in this workflow is
        # now test_template_isolation.py, alongside the other properties that
        # live in the template. One place, and the deploy gate runs it too.
        run: python -m pytest ffug/tests -q
