name: Porth — IAM setup

# Deploys porth-admin-role into the receiving account using the existing
# porth-install-role (which already has cloudformation:* on porth-* stacks
# and iam:PassRole to porth-cfn-execution-role that can create porth-* IAM roles).
#
# Run this once before porth-bootstrap.yml. Safe to re-run — CloudFormation
# deploy is idempotent.
#
# After this workflow succeeds:
# 1. Copy PorthAdminRoleArn from the job summary
# 2. Create a porth-bootstrap GitHub environment in this repo
# 3. Set AWS_ROLE_ARN = PorthAdminRoleArn in that environment
# 4. Set AWS_REGION, PORTH_API_URL and add secrets (see README)
on:
  workflow_dispatch:
    inputs:
      repo_owner:
        description: 'GitHub repo owner (org or user) for porth-admin-role OIDC trust'
        required: false
        default: ''
      repo_name:
        description: 'GitHub repo name for porth-admin-role OIDC trust'
        required: false
        default: ''
      bootstrap_environment:
        description: 'GitHub environment name for the OIDC trust condition (default: porth-bootstrap)'
        required: false
        default: 'porth-bootstrap'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK: porth-admin-role

jobs:
  iam-setup:
    name: Deploy porth-admin-role
    runs-on: ubuntu-latest
    environment: porth-install

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve OIDC trust parameters
        id: trust
        run: |
          OWNER="${{ inputs.repo_owner }}"
          REPO="${{ inputs.repo_name }}"
          ENV="${{ inputs.bootstrap_environment }}"
          [ -z "$OWNER" ] && OWNER="${{ github.repository_owner }}"
          [ -z "$REPO"  ] && REPO="${{ github.event.repository.name }}"
          [ -z "$ENV"   ] && ENV="porth-bootstrap"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO"   >> "$GITHUB_OUTPUT"
          echo "env=$ENV"     >> "$GITHUB_OUTPUT"
          echo "Deploying porth-admin-role with OIDC trust for repo:${OWNER}/${REPO}:environment:${ENV}"

      - name: Deploy porth-admin-role stack
        run: |
          aws cloudformation deploy \
            --template-file infra/porth-admin-role.yaml \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}" \
            --parameter-overrides \
              GitHubRepoOwner="${{ steps.trust.outputs.owner }}" \
              GitHubRepoName="${{ steps.trust.outputs.repo }}" \
              BootstrapEnvironment="${{ steps.trust.outputs.env }}" \
            --no-fail-on-empty-changeset

      - name: Output PorthAdminRoleArn
        run: |
          ADMIN_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='PorthAdminRoleArn'].OutputValue" \
            --output text)
          echo "PorthAdminRoleArn: $ADMIN_ROLE_ARN"
          {
            echo "## Porth IAM Setup — PASS"
            echo "- **Stack:** \`$STACK\`"
            echo "- **PorthAdminRoleArn:** \`$ADMIN_ROLE_ARN\`"
            echo ""
            echo "### Next steps"
            echo "1. Create a **\`porth-bootstrap\`** GitHub environment in this repo"
            echo "2. Set \`AWS_ROLE_ARN\` = \`$ADMIN_ROLE_ARN\`"
            echo "3. Set \`AWS_REGION\` = \`us-east-1\`"
            echo "4. Set \`PORTH_API_URL\` = Porth API base URL"
            echo "5. Add secrets: \`PORTH_AUTH_TEST_TOKEN\`, \`PLATFORM_AUTH0_DOMAIN\`, \`PLATFORM_AUTH0_CLIENT_ID\`"
            echo "6. Run **porth-install.yml** → **porth-bootstrap.yml** will fire automatically"
          } >> "$GITHUB_STEP_SUMMARY"
