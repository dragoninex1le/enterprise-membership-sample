name: Deploy Porth QA Tools

# Deploys infra/qa-tools into THIS account (195950944420) under EMS's own OIDC role.
#
# The stack is a prerequisite for two other workflows:
#   * reset-env.yml     — resolves QaCleanupFunctionArn to wipe the Porth tables
#   * porth-seed-testbed.yml — resolves QaSeedFunctionArn to refill them
#
# Both fail with an actionable message if it is absent.
#
# These Lambdas previously lived in the private Components repo, which would have required a
# cross-account deploy role for Components CI to reach this account. They are EMS's tooling —
# the seeder's reserved-name guard protects an e2e spec in this repo — so they live here and
# no cross-account credential exists.

on:
  push:
    branches: [main]
    paths:
      - 'infra/qa-tools/**'
      - '.github/workflows/deploy-qa-tools.yml'
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Porth table-name suffix (must match the Porth install Environment)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
      env_scope:
        description: >
          ADR-Z8 slot the seeder writes under (ENV#{scope}#…). DATA axis — must match the Porth
          install's FixedEnvironment. Distinct from the table-name suffix above.
        required: false
        default: 'prod'

permissions:
  id-token: write
  contents: read

concurrency:
  group: porth-qa-tools-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: porth-qa-tools
  ENVIRONMENT: ${{ inputs.environment_name || 'dev' }}
  ENV_SCOPE: ${{ inputs.env_scope || 'prod' }}

jobs:
  deploy:
    name: Deploy QA tools stack
    runs-on: ubuntu-latest
    # Own environment: this role can create and DELETE the qa-tools stack and pass the
    # CloudFormation execution role. Nothing else should be able to assume it.
    environment: porth-qa-tools

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Offline, no AWS. Gates the deploy because a regression in the seeder's key scoping is
      # a silent failure: records land where the authorizer never looks and everything reports
      # success (PORTH-514).
      - name: Test the QA tools Lambdas
        run: |
          python3 -m pip install --quiet pytest boto3
          python3 -m pytest infra/qa-tools/tests -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template-file infra/qa-tools/template.yml

      # A stack left in ROLLBACK_FAILED or ROLLBACK_COMPLETE cannot be updated — it has to be
      # deleted before it can be recreated. --retain-resources is what makes that possible
      # when the failure was itself a permissions error: without it, DELETE re-attempts the
      # operation that was denied and fails again, and the stack stays wedged forever.
      - name: Clear a wedged stack
        env:
          CFN_EXECUTION_ROLE: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          ROLE_ARG=()
          [ -n "${CFN_EXECUTION_ROLE:-}" ] && ROLE_ARG=(--role-arn "$CFN_EXECUTION_ROLE")

          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" --output text --region "$AWS_REGION" 2>/dev/null || echo "NONE")
          echo "$STACK_NAME: $STATUS"

          case "$STATUS" in
            ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED|REVIEW_IN_PROGRESS)
              # --retain-resources is only accepted from DELETE_FAILED, so the first attempt
              # is always a plain delete. If resources are stuck it lands in DELETE_FAILED,
              # and only then can we retry retaining them.
              echo "Deleting so the stack can be recreated cleanly"
              aws cloudformation delete-stack --stack-name "$STACK_NAME" \
                "${ROLE_ARG[@]}" --region "$AWS_REGION"

              if aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" \
                   --region "$AWS_REGION" 2>/dev/null; then
                echo "Deleted"
              else
                STUCK=$(aws cloudformation list-stack-resources --stack-name "$STACK_NAME" \
                  --query "StackResourceSummaries[?ResourceStatus=='DELETE_FAILED'].LogicalResourceId" \
                  --output text --region "$AWS_REGION" 2>/dev/null || echo "")
                if [ -z "$STUCK" ]; then
                  echo "::error::Delete failed and no resource is in DELETE_FAILED — inspect the stack events"
                  exit 1
                fi
                echo "Retrying, retaining: $STUCK"
                echo "::warning::Retaining $STUCK — these are orphaned in the account and safe to"
                echo "::warning::delete by hand; the redeploy creates new ones with fresh suffixes."
                aws cloudformation delete-stack --stack-name "$STACK_NAME" \
                  --retain-resources $STUCK "${ROLE_ARG[@]}" --region "$AWS_REGION"
                aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION"
                echo "Deleted (with retained resources)"
              fi
              ;;
            *)
              echo "No cleanup needed"
              ;;
          esac

      - name: SAM deploy
        run: |
          set -euo pipefail
          # CloudFormation must act as the EXECUTION role, not the orchestration role this job
          # assumed. porth-install-role only calls the CFN/SAR APIs — it deliberately has no
          # iam:CreateRole, so without this the Lambda execution roles cannot be created.
          ROLE_ARG=()
          if [ -n "${CFN_EXECUTION_ROLE:-}" ]; then
            ROLE_ARG=(--role-arn "$CFN_EXECUTION_ROLE")
            echo "CloudFormation will act as $CFN_EXECUTION_ROLE"
          else
            echo "::warning::AWS_CFN_EXECUTION_ROLE_ARN is unset — CloudFormation will act as the"
            echo "::warning::job's own role, which needs iam:CreateRole/DeleteRole/PutRolePolicy"
            echo "::warning::and friends to manage the two Lambda execution roles."
          fi

          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            "${ROLE_ARG[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION" \
            --parameter-overrides "Environment=$ENVIRONMENT" "EnvScope=$ENV_SCOPE"
        env:
          CFN_EXECUTION_ROLE: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}

      # No smoke test: there is no HTTP surface left to probe. The functions are invoked by
      # ARN over the AWS API, where authorisation is IAM by construction.
      - name: Summary
        run: |
          {
            echo "## QA tools deployed"
            echo ""
            echo "- **Tables:** \`porth-*-${ENVIRONMENT}\`"
            echo "- **Env scope:** \`${ENV_SCOPE}\` (records at \`ENV#${ENV_SCOPE}#…\`)"
            echo ""
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?ends_with(OutputKey, 'FunctionArn')].[OutputKey,OutputValue]" \
              --output text | while read -r k v; do echo "- \`$k\` = \`$v\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
