name: Reset Dev Environment

# Empties every table EMS holds, in every environment, so the install can be rebuilt from nothing
# (Richard, 2026-11-10): "clear all tables". The tables themselves stay - CloudFormation owns them -
# and so do the stacks, SSM parameters and keys. Only rows go:
#
#   * Porth's, all eight: tenants, roles, permissions, claim-mapping-configs, users, org-units,
#     sessions and the audit log. They are shared by every environment, so one environment cannot
#     be emptied alone (purge-env-scope.yml refuses a live one).
#   * EMS's own, for every declared environment (deploy/porth/environments.json):
#     ems-sample-app-{slot}, ems-supplier-links-{slot}, ems-ffug-{slot}.
#   * prawf's ledger and baselines, prawf-adapter-audit: they describe rows that no longer exist.
#     A baseline too big for its item stays in the snapshot bucket, content-addressed and unread.
#
# Nothing is rebuilt here. Afterwards, in order:
#   1. porth-install.yml at the installed version - the platform tenant in every environment, and
#      Porth's own permissions;
#   2. deploy-sample-app.yml for each environment - the app's permissions (register-permissions);
#   3. the adapter's bootstrap of `porth` in each - the clean install becomes the baseline;
#   4. prawf-runner, to seed what a use case needs.
#
# A dry run unless `apply` is ticked: it counts what would go, table by table. The deleting is the
# QA tools' cleanup Lambda, which empties only these families and refuses any other table.
#
# Trigger:  Actions -> Reset Dev Environment -> Run workflow

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete. Leave OFF to count exactly what would go.'
        type: boolean
        default: false
      stack_name:
        description: 'Porth components CloudFormation stack name'
        required: false
        default: 'serverlessrepo-porth-components'

concurrency:
  group: reset-dev-env
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PORTH_STACK: ${{ inputs.stack_name || 'serverlessrepo-porth-components' }}
  APPLY: ${{ inputs.apply }}

jobs:
  reset:
    name: ${{ inputs.apply && 'Empty every table' || 'Count every table (dry run)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The bootstrap role, as before: it may invoke the cleanup Lambda, and nothing here needs more.
    environment: porth-bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the tables and the cleanup function
        run: |
          set -euo pipefail
          TENANTS=$(aws cloudformation describe-stacks --stack-name "$PORTH_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='TenantsTableName'].OutputValue" --output text)
          if [ -z "$TENANTS" ] || [ "$TENANTS" = "None" ]; then
            echo "::error::$PORTH_STACK has no TenantsTableName output"
            exit 1
          fi
          CLEANUP_FN=$(aws cloudformation describe-stacks --stack-name porth-qa-tools \
            --query "Stacks[0].Outputs[?OutputKey=='QaCleanupFunctionArn'].OutputValue" --output text)
          {
            echo "PORTH_SUFFIX=${TENANTS#porth-tenants-}"
            echo "CLEANUP_FN=$CLEANUP_FN"
            echo "ENVIRONMENTS=$(python3 scripts/environments.py list)"
          } >> "$GITHUB_ENV"

      - name: ${{ inputs.apply && 'Empty every table' || 'Count every table' }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          import boto3

          apply = os.environ["APPLY"] == "true"
          suffix = os.environ["PORTH_SUFFIX"]
          slots = [s for s in os.environ["ENVIRONMENTS"].split(",") if s]
          # Porth names every table porth-{family}-{Environment}; several have no stack output.
          tables = [f"porth-{family}-{suffix}" for family in (
              "tenants", "roles", "permissions", "claim-mapping-configs", "users", "org-units",
              "sessions", "audit-log")]
          tables += [f"ems-{family}-{slot}" for slot in slots for family in ("sample-app", "supplier-links", "ffug")]
          tables += ["prawf-adapter-audit"]

          client = boto3.client("lambda", region_name=os.environ["AWS_REGION"])

          def cleanup(table, dry_run):
              out = client.invoke(FunctionName=os.environ["CLEANUP_FN"],
                                  Payload=json.dumps({"body": json.dumps({"table_name": table, "dry_run": dry_run})}))
              result = json.loads(out["Payload"].read())
              return result.get("statusCode", 200), json.loads(result.get("body") or "{}")

          # A cleanup function from before the dry run would ignore it and delete. It also refuses
          # prawf's table, so a dry run there tells the two apart before anything is touched.
          status, body = cleanup("prawf-adapter-audit", True)
          if status != 200 or body.get("dry_run") is not True:
              print("::error::The QA tools' cleanup function predates the dry run and EMS's own tables. "
                    "Deploy the QA tools stack (deploy-qa-tools.yml) first. Nothing was touched.")
              sys.exit(1)

          verb = "deleted" if apply else "would delete"
          failed = False
          print(f"{'Emptying' if apply else 'Counting'} {len(tables)} tables in {', '.join(slots)} and Porth's shared tables")
          for table in tables:
              status, body = cleanup(table, not apply)
              if status == 200:
                  print(f"  {table}: {verb} {body.get('deleted', '?')}")
              elif status == 404:
                  print(f"  {table}: no such table - skipped")
              else:
                  print(f"::error::{table}: {body.get('error', status)}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Summary
        if: success()
        run: |
          {
            if [ "$APPLY" = "true" ]; then echo "## Every table emptied"; else echo "## Dry run - nothing deleted"; fi
            echo ""
            echo "Environments: \`${ENVIRONMENTS}\`. Porth's tables are shared by all of them."
            echo ""
            echo "Next, in order: **porth-install** at the installed version, **deploy-sample-app** for"
            echo "each environment, the adapter's **bootstrap** of \`porth\` in each, then **prawf-runner**."
          } >> "$GITHUB_STEP_SUMMARY"
