name: ffug — prove tenant isolation

# The evidence run for PORTH-587, and the shape PORTH-553 asks for: journeys
# driven by a workflow_dispatch, with the GitHub run as the evidence pack of
# record. It reads and invokes; it deploys nothing and writes nothing.
#
# Three stages, in the order they were asked for:
#   A. the bus created the tenant in ffug's table, with its own prime
#   B. a synchronous call returns that tenant's digest, and two tenants
#      disagree on an identical payload
#   C. this environment's credentials are refused another environment's rows
#      for the same tenant, and an envelope narrows to its own signed claim
#      (PORTH-627). Skipped when only one environment is deployed.
#
# PRECONDITION: at least one tenant must have been created AFTER the ffug
# lifecycle consumer was deployed. A tenant that already existed gets no prime
# retroactively.
#
# Create it in the ADMIN UI. NOT the QA seeder: it writes tenant rows straight
# to Porth's table and publishes no `tenant.created`, so ffug never hears about
# the tenant, never mints a prime, and stage A finds nothing — with the remedy
# printed being the very step that cannot work. Only PUT /tenants/ emits the
# event.

on:
  workflow_dispatch:
    inputs:
      environment_slot:
        description: 'Which ADR-Z8 environment to prove'
        type: choice
        default: porth-sample
        options:
          - porth-sample
          - porth-dau

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Which environment is under test, and the stack that deploys it. The two
  # move together: every resource is named from the slot (PORTH-627), so
  # proving the other environment is a different stack, not a flag.
  #
  # porth-sample keeps the unsuffixed stack name, matching deploy-sample-app.yml
  # — that stack predates the convention and renaming it would strand it.
  ENVIRONMENT_SLOT: ${{ inputs.environment_slot || 'porth-sample' }}
  SAM_STACK_NAME: ${{ (inputs.environment_slot || 'porth-sample') == 'porth-sample' && 'enterprise-membership-sample' || format('enterprise-membership-sample-{0}', inputs.environment_slot) }}

jobs:
  prove:
    name: A - seeded from the bus, B - synchronous call, C - environment isolation
    runs-on: ubuntu-latest
    environment: sample-app-deploy
    env:
      PORTH_STACK_NAME: ${{ vars.PORTH_STACK_NAME || 'serverlessrepo-porth-components' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Two OIDC assumptions in one job, and they are NOT role chaining. The UAT
      # runner's trust policy accepts sts:AssumeRoleWithWebIdentity only, so no
      # other role can assume it — configure-aws-credentials requests a fresh
      # OIDC token each time it runs, which is what makes the second step work.
      #
      # This first one is the deploy role: it is the identity that can read the
      # stack outputs and CodeArtifact. It deliberately holds no kms:Sign.
      - name: Configure AWS credentials (deploy role, for discovery)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve what the proof needs
        run: |
          set -euo pipefail

          sample_output() {
            aws cloudformation describe-stacks --stack-name "$SAM_STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          porth_param() {
            aws cloudformation describe-stacks --stack-name "$PORTH_STACK_NAME" \
              --query "Stacks[0].Parameters[?ParameterKey=='$1'].ParameterValue" --output text
          }

          FFUG_FUNCTION_ARN=$(sample_output FfugFunctionArn)
          FFUG_TABLE_NAME=$(sample_output FfugTableName)
          UAT_ROLE_ARN=$(sample_output PorthUatRunnerRoleArn)
          PORTH_BRANCH=$(porth_param Environment)

          # The signer needs the key. Taken from the STACK'S OWN PARAMETERS,
          # not from SSM: deploy.yml already resolved it once and passed it in,
          # and the deploy role's SSM access is the thing that cannot be relied
          # on (run 32442832244). DescribeStacks is already permitted, and this
          # way the proof signs with exactly the key the deployed function was
          # told to verify against — reading SSM again could disagree with it.
          CONTEXT_KEY_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --query "Stacks[0].Parameters[?ParameterKey=='PorthContextSigningKeyArn'].ParameterValue" \
            --output text)
          WIRED=$(sample_output FfugInternalPlaneWired)
          if [ "$WIRED" != "yes" ]; then
            echo "::error::The stack reports FfugInternalPlaneWired=$WIRED."
            echo "ffug deployed as the bus consumer only, with no context verifier."
            echo "Stage A (the tenant's salt) will work; stage B cannot — every"
            echo "synchronous call is refused at the boundary."
            echo "Fix: grant ssm:GetParameter on /porth/* to sample-app-deploy-role,"
            echo "then re-run Deploy Admin UI."
            exit 1
          fi

          MISSING=()
          [ -z "$FFUG_FUNCTION_ARN" ] || [ "$FFUG_FUNCTION_ARN" == "None" ] && MISSING+=("FfugFunctionArn")
          [ -z "$FFUG_TABLE_NAME" ] || [ "$FFUG_TABLE_NAME" == "None" ] && MISSING+=("FfugTableName")
          [ -z "$UAT_ROLE_ARN" ] || [ "$UAT_ROLE_ARN" == "None" ] && MISSING+=("PorthUatRunnerRoleArn")
          [ -z "$CONTEXT_KEY_ARN" ] || [ "$CONTEXT_KEY_ARN" == "None" ] && MISSING+=("context-signing-key-arn")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::could not resolve: ${MISSING[*]}"
            echo "If FfugLifecycleFunctionArn and friends are absent, the stack predates"
            echo "PORTH-587 — run 'Deploy Admin UI' on main first."
            exit 1
          fi

          {
            echo "FFUG_FUNCTION_ARN=$FFUG_FUNCTION_ARN"
            echo "FFUG_TABLE_NAME=$FFUG_TABLE_NAME"
            echo "UAT_ROLE_ARN=$UAT_ROLE_ARN"
            echo "PORTH_CONTEXT_SIGNING_KEY_ALIAS=$CONTEXT_KEY_ARN"
          } >> "$GITHUB_ENV"

          echo "ffug function : $FFUG_FUNCTION_ARN"
          echo "ffug table    : $FFUG_TABLE_NAME"
          echo "porth branch  : $PORTH_BRANCH"

      # Under the deploy role, because the UAT runner has no CodeArtifact grant.
      # The login writes a 12-hour token into pip's config, so the install
      # survives the role switch below.
      - name: Configure pip for CodeArtifact and install porth-common
        run: |
          set -euo pipefail
          aws codeartifact login --tool pip \
            --domain porth --domain-owner 084847995635 \
            --repository porth-py --region "$AWS_REGION"
          python -m pip install --quiet -r lambdas/requirements.txt

      # The identity that actually runs the proof. This is the one holding
      # kms:Sign, lambda:InvokeFunction on ffug, and read-only on its table —
      # and holding no write to anything.
      - name: Assume the Porth UAT runner role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.UAT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ffug-proof

      - name: Which identity is running the proof
        run: aws sts get-caller-identity

      - name: Prove it
        # `set -o pipefail` is load-bearing, not hygiene. A pipeline's exit
        # status is its LAST command's — `tee` — so without it the script's
        # exit(1) is swallowed and a FAILED proof reports green. Run 32527214822
        # did exactly that: stage A found no tenant projections, printed the
        # remedy, exited 1, and the job concluded success.
        #
        # An evidence workflow that can report green while proving nothing is
        # worse than no evidence workflow, because someone will cite it.
        env:
          # The other deployed environment, for stage C. Derived from the
          # environments this install serves, minus the one being proved — so a
          # third environment needs no change here.
          #
          # Empty skips stage C rather than failing it: on a single-environment
          # install there is no real second environment to be refused, and a
          # probe aimed at an invented one proves nothing (PORTH-598).
          PORTH_AUTH_ENVIRONMENTS: ${{ vars.PORTH_AUTH_ENVIRONMENTS || 'porth-sample,porth-dau' }}
        run: |
          set -o pipefail
          THIS="${ENVIRONMENT_SLOT:-porth-sample}"
          OTHER=$(printf '%s' "$PORTH_AUTH_ENVIRONMENTS" \
            | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v "^${THIS}$" | head -1)
          export OTHER_ENVIRONMENT="${OTHER}"
          echo "proving ${THIS}; stage C probes ${OTHER:-'(none — skipped)'}"
          python scripts/ffug_proof.py | tee proof.txt

      - name: Publish the evidence
        if: always()
        run: |
          {
            echo '## ffug tenant-isolation proof'
            echo '```'
            cat proof.txt 2>/dev/null || echo '(no output - the run failed before the script)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
