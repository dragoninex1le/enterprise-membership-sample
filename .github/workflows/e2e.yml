name: E2E Tests

# PORTH-611 — automatic execution is PAUSED, not deleted.
#
# The suite has been failing and is due to move to a separate harness, so
# running it on every push, every pull request and every deploy costs pipeline
# time to re-report a known-red state. A red check nobody acts on is worse than
# no check: it trains everyone to ignore the colour, and the next genuine
# failure arrives wearing the same face.
#
# workflow_dispatch is deliberately kept. The suite still runs on demand, so
# this is a pause with the tests intact and not a quiet deletion — the specs,
# fixtures and helpers are all untouched.
#
# To restore, put the three triggers below back:
#
#   push:
#     branches: ['**']
#   pull_request:
#   workflow_run:                    # Tier 2 only after the deploy finishes,
#     workflows: ["Deploy Admin UI"] # so it never tests a stale live site
#     types: [completed]
#     branches: [main]
#
# Restoring them without fixing the suite first just reinstates the noise.
on:
  workflow_dispatch:

# PORTH-540 removed the OIDC grant as vestigial, noting to restore it when the suite
# needs credentials. That moment is PORTH-531: @estyn/porth-admin resolves from the Porth
# CodeArtifact repo (frontend/.npmrc reads CODEARTIFACT_AUTH_TOKEN), so installing
# dependencies now requires an AWS role — without it npm dies with E401 before any test
# starts. Fork PRs cannot reach the environment's role and will fail at the credentials
# step; acceptable for this sample repo.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Same environment as deploy.yml: its role provably holds the CodeArtifact
    # permissions (every green deploy runs the identical token step).
    environment: sample-app-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, check out the commit that was deployed
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Same pattern as deploy.yml — frontend/.npmrc points the @estyn scope at the
      # porth-npm CodeArtifact repo and reads the token from this env var.
      - name: Authenticate npm to CodeArtifact (porth-npm for @estyn/porth-admin)
        run: |
          set -euo pipefail
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain porth --domain-owner 084847995635 \
            --query authorizationToken --output text --region "$AWS_REGION")
          echo "::add-mask::${TOKEN}"
          echo "CODEARTIFACT_AUTH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      # npm install rather than ci: @estyn/porth-admin is not yet in package-lock.json,
      # which `npm ci` refuses to reconcile. Revert alongside deploy.yml once the
      # lockfile is regenerated against CodeArtifact.
      - run: npm install
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Tier 1 tests (always)
        # Tier 1 uses a mocked API — no live deployment needed
        # Skip on workflow_run triggers to avoid re-running Tier 1 a second time for each push
        if: github.event_name != 'workflow_run'
        run: npx playwright test tests/e2e/tier1/
        working-directory: frontend
        env:
          VITE_E2E_AUTH: 'true'
          VITE_API_BASE_URL: 'http://localhost:5173'
          VITE_DEV_TENANT_ID: 'test-tenant'

      - name: Tier 2 tests (after successful deploy to main, or manual dispatch)
        if: |
          (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success') ||
          github.event_name == 'workflow_dispatch'
        run: npx playwright test tests/e2e/tier2/
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          PORTH_PLATFORM_BASE_URL: ${{ secrets.PORTH_PLATFORM_BASE_URL }}
          PORTH_API_URL: ${{ secrets.PORTH_API_URL }}
          PORTH_AUTH_TEST_TOKEN: ${{ secrets.PORTH_AUTH_TEST_TOKEN }}
          PORTH_PLATFORM_ADMIN_EMAIL: ${{ secrets.PORTH_PLATFORM_ADMIN_EMAIL }}
          PORTH_PLATFORM_ADMIN_PASSWORD: ${{ secrets.PORTH_PLATFORM_ADMIN_PASSWORD }}
          PORTH_TENANT_CONFIG: ${{ secrets.PORTH_TENANT_CONFIG }}
          PORTH_TENANT_USER_EMAIL: ${{ secrets.PORTH_TENANT_USER_EMAIL }}
          PORTH_TENANT_USER_PASSWORD: ${{ secrets.PORTH_TENANT_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
